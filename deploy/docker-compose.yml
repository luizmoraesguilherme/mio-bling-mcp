# Gerado por scripts/build-compose.mjs. Não edite à mão.
name: mio-loja

services:
  api:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "--no-warnings", "/app/server.js"]
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://srv1830184.hstgr.cloud:3200}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BLING_CLIENT_ID: ${BLING_CLIENT_ID:-}
      BLING_CLIENT_SECRET: ${BLING_CLIENT_SECRET:-}
      BLING_LOJA_ID: ${BLING_LOJA_ID:-}
      BLING_PEDIDO_AUTO: ${BLING_PEDIDO_AUTO:-false}
      BLING_SYNC_MIN: ${BLING_SYNC_MIN:-20}
      EXPECTED_CNPJ: "61102078000101"
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      ORIGEM_CEP: ${ORIGEM_CEP:-12233000}
      FRETE_LOCAL_VALOR: ${FRETE_LOCAL_VALOR:-15}
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      TZ: America/Sao_Paulo
    labels:
      mio.commit: "b7dfc68"
    configs:
      - source: api_server
        target: /app/server.js
    volumes:
      - mio-loja-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [mionet]
    mem_limit: 384m

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "3200:80"
    labels:
      mio.commit: "b7dfc68"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
      - source: web_app_js
        target: /usr/share/nginx/html/app.js
      - source: web_carrinho_html
        target: /usr/share/nginx/html/carrinho.html
      - source: web_config_js
        target: /usr/share/nginx/html/config.js
      - source: web_favicon_svg
        target: /usr/share/nginx/html/favicon.svg
      - source: web_index_html
        target: /usr/share/nginx/html/index.html
      - source: web_logo_svg
        target: /usr/share/nginx/html/logo.svg
      - source: web_loja_html
        target: /usr/share/nginx/html/loja.html
      - source: web_painel_html
        target: /usr/share/nginx/html/painel.html
      - source: web_painel_js
        target: /usr/share/nginx/html/painel.js
      - source: web_pedido_html
        target: /usr/share/nginx/html/pedido.html
      - source: web_politicas_html
        target: /usr/share/nginx/html/politicas.html
      - source: web_produto_html
        target: /usr/share/nginx/html/produto.html
      - source: web_styles_css
        target: /usr/share/nginx/html/styles.css
    networks: [mionet]
    mem_limit: 64m

volumes:
  mio-loja-data:

networks:
  mionet:

configs:
  api_server:
    content: "// Mio Peça — API da loja própria.\n// Node 22, sem dependências, banco SQLite embutido (node:sqlite).\n// Integra: Bling (catálogo, estoque, pedidos), Mercado Pago (Checkout Pro) e Melhor Envio (frete, opcional).\n'use strict';\n\nconst http = require('node:http');\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst crypto = require('node:crypto');\nconst { DatabaseSync } = require('node:sqlite');\n\n// ---------------------------------------------------------------------------\n// Configuração\n// ---------------------------------------------------------------------------\nconst env = process.env;\nconst CFG = {\n  port: Number(env.PORT || 3000),\n  dataDir: env.DATA_DIR || path.join(__dirname, 'data'),\n  publicUrl: (env.PUBLIC_URL || 'http://localhost:3200').replace(/\\/$$/, ''),\n  adminPassword: env.ADMIN_PASSWORD || '',\n  sessionSecret: env.SESSION_SECRET || '',\n  cookieSecure: env.COOKIE_SECURE === 'true',\n  // Bling\n  blingClientId: env.BLING_CLIENT_ID || '',\n  blingClientSecret: env.BLING_CLIENT_SECRET || '',\n  blingApi: 'https://api.bling.com.br/Api/v3',\n  blingAuthorize: 'https://www.bling.com.br/Api/v3/oauth/authorize',\n  expectedCnpj: (env.EXPECTED_CNPJ || '61102078000101').replace(/\\D/g, ''),\n  blingLojaId: Number(env.BLING_LOJA_ID || 0) || null,\n  blingPedidoAuto: env.BLING_PEDIDO_AUTO === 'true',\n  syncMinutos: Math.max(5, Number(env.BLING_SYNC_MIN || 20)),\n  // Mercado Pago\n  mpToken: env.MP_ACCESS_TOKEN || '',\n  // Frete\n  origemCep: (env.ORIGEM_CEP || '12233000').replace(/\\D/g, ''),\n  freteLocalValor: Number(env.FRETE_LOCAL_VALOR || 15),\n  freteLocalCeps: (env.FRETE_LOCAL_FAIXA || '12200000-12248999').split('-').map((s) => Number(s.replace(/\\D/g, ''))),\n  melhorEnvioToken: env.MELHOR_ENVIO_TOKEN || '',\n  melhorEnvioEmail: env.MELHOR_ENVIO_EMAIL || 'gerencia@dandecomercial.com.br',\n};\n\nif (!CFG.adminPassword || !CFG.sessionSecret) {\n  console.warn('[aviso] ADMIN_PASSWORD e SESSION_SECRET não definidos: o painel fica bloqueado.');\n}\n\nconst IMG_DIR = path.join(CFG.dataDir, 'img');\nfs.mkdirSync(IMG_DIR, { recursive: true });\n\n// ---------------------------------------------------------------------------\n// Identidade visual da Dande: arquivos do site dandecomercial.com.br espelhados\n// no volume na primeira execução e servidos em /assets/ (não depende do site antigo).\n// ---------------------------------------------------------------------------\nconst ASSET_DIR = path.join(CFG.dataDir, 'assets');\nfs.mkdirSync(ASSET_DIR, { recursive: true });\nconst DANDE = 'https://dandecomercial.com.br/wp-content';\nconst ASSETS = {\n  'logo-dande.png': `$${DANDE}/uploads/2018/08/Logo_Dande_Institucional.png`,\n  'logo-dande-negativo.png': `$${DANDE}/themes/dande/imagens/Logo_Dande_Negativo.png`,\n  'favicon-dande.png': `$${DANDE}/uploads/2018/08/cropped-favicon-1-270x270.png`,\n  'banner-1.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo-2.jpg`,\n  'banner-2.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo_2-2.jpg`,\n  'banner-3.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo_3-2.jpg`,\n  'banner-4.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo_4-2.jpg`,\n  'banner-m-1.jpg': `$${DANDE}/uploads/2021/02/DN_HOME_BannerTopo_640x640px-1-min.jpg`,\n  'banner-m-2.jpg': `$${DANDE}/uploads/2021/02/DN_HOME_BannerTopo_2_640x640px-1-min.jpg`,\n  'banner-m-3.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo_3_640x640px-1.jpg`,\n  'banner-m-4.jpg': `$${DANDE}/uploads/2018/10/DN_HOME_BannerTopo_4_640x640px-1.jpg`,\n  'supergraphic.jpg': `$${DANDE}/uploads/2021/02/supergraphic-gray-light-min.jpg`,\n  'pit-20anos.png': `$${DANDE}/themes/dande/imagens/DN_HOME_BarraTopo_Icones_20anos.png`,\n  'pit-rapido.png': `$${DANDE}/themes/dande/imagens/DN_HOME_BarraTopo_Icones_AtendRapido.png`,\n  'pit-marcas.png': `$${DANDE}/themes/dande/imagens/DN_HOME_BarraTopo_Icones_GrandesMarcas.png`,\n  'pit-entrega.png': `$${DANDE}/themes/dande/imagens/DN_HOME_BarraTopo_Icones_ProntaEntrega.png`,\n  'pit-estacionamento.png': `$${DANDE}/themes/dande/imagens/DN_HOME_BarraTopo_Icones_Estacionamento.png`,\n  'marca-brastemp.png': `$${DANDE}/themes/dande/imagens/af_logo_brastemp.png`,\n  'marca-consul.png': `$${DANDE}/themes/dande/imagens/consul-logo.png`,\n  'marca-electrolux.png': `$${DANDE}/themes/dande/imagens/Logo-Electrolux.png`,\n  'marca-planeta-agua.png': `$${DANDE}/themes/dande/imagens/planeta-agua.png`,\n  'cat-geladeiras.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_Geladeiras.png`,\n  'cat-lavadoras.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_Lavadora.png`,\n  'cat-secadoras.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_Secadoras.png`,\n  'cat-tanquinhos.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_Refrigeracao.png`,\n  'cat-microondas.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_Microondas.png`,\n  'cat-ar-condicionado.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_ArCondicionado.png`,\n  'cat-filtros.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_FiltrodeAgua.png`,\n  'cat-lava-loucas.png': `$${DANDE}/themes/dande/imagens/DN_HOME_Produtos_LavaLoucas.png`,\n  'ic-facebook.png': `$${DANDE}/themes/dande/imagens/if_facebook_circle_color_107175.png`,\n  'ic-whatsapp.png': `$${DANDE}/themes/dande/imagens/whatsapp.png`,\n  'ic-horario.png': `$${DANDE}/themes/dande/imagens/horario-rodape.png`,\n  'ic-mail.png': `$${DANDE}/themes/dande/imagens/if_Mail02_928432.png`,\n  'ic-facebook-rodape.png': `$${DANDE}/themes/dande/imagens/if_facebook_circle_rodape.png`,\n  'ic-whatsapp-rodape.png': `$${DANDE}/themes/dande/imagens/whatsapp-rodape.png`,\n  'pt-sans.woff': `$${DANDE}/themes/dande/fontes/PTS55F-webfont.woff`,\n  'pt-sans-bold.woff': `$${DANDE}/themes/dande/fontes/PTS75F-webfont.woff`,\n  'pt-sans-narrow.woff': `$${DANDE}/themes/dande/fontes/PTN57F-webfont.woff`,\n  'futura-pt-book.woff2': `$${DANDE}/themes/dande/fontes/FuturaPT-Book.woff2`,\n  'futura-pt-bold.woff2': `$${DANDE}/themes/dande/fontes/FuturaPT-Bold.woff2`,\n};\nconst TIPOS = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', woff: 'font/woff', woff2: 'font/woff2' };\nasync function espelharAssets() {\n  let novos = 0, falhas = 0;\n  for (const [nome, url] of Object.entries(ASSETS)) {\n    const destino = path.join(ASSET_DIR, nome);\n    if (fs.existsSync(destino) && fs.statSync(destino).size > 0) continue;\n    try {\n      const res = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 (mio-loja)' } });\n      if (!res.ok) throw new Error(String(res.status));\n      fs.writeFileSync(destino, Buffer.from(await res.arrayBuffer()));\n      novos++;\n    } catch (e) { falhas++; console.warn(`[asset] $${nome}: $${e.message}`); }\n  }\n  if (novos || falhas) console.log(`[asset] identidade Dande: $${novos} baixados, $${falhas} falhas`);\n}\n\n// ---------------------------------------------------------------------------\n// Banco\n// ---------------------------------------------------------------------------\nconst db = new DatabaseSync(path.join(CFG.dataDir, 'loja.db'));\ndb.exec(`\nPRAGMA journal_mode = WAL;\nPRAGMA foreign_keys = ON;\nCREATE TABLE IF NOT EXISTS kv (k TEXT PRIMARY KEY, v TEXT);\nCREATE TABLE IF NOT EXISTS produtos (\n  id INTEGER PRIMARY KEY,          -- id do produto no Bling\n  codigo TEXT, nome TEXT NOT NULL, slug TEXT UNIQUE,\n  preco REAL DEFAULT 0, custo REAL DEFAULT 0, estoque REAL DEFAULT 0,\n  descricao TEXT DEFAULT '', marca TEXT DEFAULT '', gtin TEXT DEFAULT '',\n  peso REAL DEFAULT 0, altura REAL DEFAULT 0, largura REAL DEFAULT 0, profundidade REAL DEFAULT 0,\n  categoria_bling INTEGER, situacao TEXT DEFAULT 'A', formato TEXT DEFAULT 'S',\n  imagens TEXT DEFAULT '[]',       -- nomes dos arquivos em /data/img\n  detalhe_em TEXT,                 -- quando o detalhe completo foi lido\n  sync_em TEXT,\n  -- campos da loja (não vêm do Bling)\n  publicado INTEGER DEFAULT 0, destaque INTEGER DEFAULT 0,\n  categoria_site TEXT, titulo_site TEXT, categoria_manual INTEGER DEFAULT 0\n);\nCREATE INDEX IF NOT EXISTS idx_prod_pub ON produtos(publicado, categoria_site);\nCREATE TABLE IF NOT EXISTS pedidos (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  codigo TEXT UNIQUE, token TEXT NOT NULL,\n  status TEXT NOT NULL DEFAULT 'aguardando_pagamento',\n  cliente TEXT NOT NULL, endereco TEXT, itens TEXT NOT NULL,\n  subtotal REAL NOT NULL, frete REAL NOT NULL DEFAULT 0, frete_tipo TEXT, frete_nome TEXT, total REAL NOT NULL,\n  mp_preferencia TEXT, mp_pagamento TEXT, mp_status TEXT, mp_link TEXT,\n  bling_pedido_id INTEGER, bling_numero TEXT, bling_erro TEXT,\n  obs_interna TEXT,\n  criado_em TEXT NOT NULL, atualizado_em TEXT NOT NULL\n);\nCREATE TABLE IF NOT EXISTS eventos (\n  id INTEGER PRIMARY KEY AUTOINCREMENT, em TEXT, tipo TEXT, dados TEXT\n);\n`);\n\n\n// Migração: bancos criados antes da coluna categoria_manual.\ntry { db.exec('ALTER TABLE produtos ADD COLUMN categoria_manual INTEGER DEFAULT 0'); } catch { /* já existe */ }\ntry { db.exec('ALTER TABLE produtos ADD COLUMN miniatura TEXT'); } catch { /* já existe */ }\nconst agora = () => new Date().toISOString();\nconst kvGet = (k) => { const r = db.prepare('SELECT v FROM kv WHERE k=?').get(k); return r ? JSON.parse(r.v) : null; };\nconst kvSet = (k, v) => db.prepare('INSERT INTO kv(k,v) VALUES(?,?) ON CONFLICT(k) DO UPDATE SET v=excluded.v').run(k, JSON.stringify(v));\nfunction evento(tipo, dados = {}) {\n  db.prepare('INSERT INTO eventos(em,tipo,dados) VALUES(?,?,?)').run(agora(), tipo, JSON.stringify(dados));\n  console.log(`[$${tipo}]`, JSON.stringify(dados).slice(0, 300));\n}\n\n// ---------------------------------------------------------------------------\n// Categorias do site (identidade da Dande) e classificação automática\n// ---------------------------------------------------------------------------\nconst CATEGORIAS = [\n  { slug: 'geladeiras', nome: 'Geladeiras e Freezers', chaves: ['geladeira', 'refrigerador', 'freezer', 'frost', 'degelo', 'gaveta', 'prateleira', 'termostato', 'guarnicao', 'gaxeta', 'antiodor', 'damper', 'evaporador', 'refrigeracao', 'forma de gelo', 'forma gelo', 'congelador', 'side by side', 'fusivel termico', 'sensor 2,7k', 'motor ventilador', 'duto', 'lampada led', 'capa difusor', 'dobradica freezer', 'capa traseira', 'cesto intermediario', 'interruptor duplo', ' dff '] },\n  { slug: 'secadoras', nome: 'Secadoras', chaves: ['secadora', 'roldana tambor', 'antepara'] },\n  { slug: 'tanquinhos', nome: 'Tanquinhos', chaves: ['tanquinho'] },\n  { slug: 'lavadoras', nome: 'Lavadoras', chaves: ['lavadora', 'maquina de lavar', 'lava e seca', 'tirante', 'agitador', 'atuador', 'pressostato', 'cesto', 'tanque', 'mecanismo', 'transmissao', 'correia', 'rolamento', 'retentor', 'suspensao', 'eletrovalvula', 'valvula de entrada', 'bomba drenagem', 'tira manchas', 'eixo', 'solenoide', 'mola do freio', 'freio', 'nivelador', 'caixa engrenagem', 'came', 'amortecedor', 'mondial', 'thormac', 'burdog', 'colormaq', 'molas cesto', 'filtro bomba', 'valvula dupla', 'valvula electrolux lm'] },\n  { slug: 'microondas', nome: 'Micro-ondas', chaves: ['microondas', 'micro-ondas', 'micro ondas', 'membrana', 'tinta epson', 'tinta branca', 'magnetron', 'prato giratorio'] },\n  { slug: 'ar-condicionado', nome: 'Ar-condicionado', chaves: ['ar condicionado', 'ar-condicionado', 'split', 'capacitor', 'placa universal ac'] },\n  { slug: 'filtros', nome: 'Filtros e Purificadores', chaves: ['refil', 'purificador', 'bebedouro', 'adaptador mangueira', 'filtro de agua', 'planeta agua'] },\n  { slug: 'lava-loucas', nome: 'Lava-louças', chaves: ['lava louca', 'lava-louca', 'lava loucas', 'lava-loucas'] },\n  { slug: 'ferramentas', nome: 'Ferramentas e Acessórios', chaves: ['chave', 'alicate', 'dobrador', 'curvador', 'graxa', 'anticorrosivo', 'limpeza', 'tablete', 'pastilha', 'ferramenta', 'kit instalacao', 'manifold', 'cortador', 'escareador', 'alargador', 'serra copo', 'engate rapido', 'fita', 'filmex', 'luva rosca', 'termometro', 'oleo', 'desengripante', 'alumax', 'solda', 'terminal bateria', 'espuma limpadora', 'controle remoto', 'schrader', 'rabicho', 'valvula para gas'] },\n  { slug: 'outros', nome: 'Outras peças', chaves: [] },\n];\nconst CAT_SLUGS = new Set(CATEGORIAS.map((c) => c.slug));\nconst semAcento = (s) => String(s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase();\n// Códigos de modelo (BWL11, CWH12, LTE12, BRE80, DFF…) dizem o aparelho mesmo sem a palavra.\nconst MODELOS = [\n  ['secadoras', /\\b(bs[ircx]\\d{2})/],\n  ['lavadoras', /\\b(bw[a-z]\\d{2}|cw[a-z]\\d{2}|lte?\\d{2}|lt\\d{2}f|lca\\d{2}|lm\\d{2}|lbu\\d{2}|ltr\\d{2}|ltc\\d{2}|lac\\d{2})/],\n  ['geladeiras', /\\b(br[emo]\\d{2}|crb\\d{2}|crm\\d{2}|dff\\d{2}|df\\d{2}|re\\d{2}|rde\\d{2}|tf\\d{2}|it\\d{2}|ss72)/],\n  ['microondas', /\\b(bms\\d{2}|cms\\d{2}|me\\d{2}[a-z])/],\n];\nfunction sugerirCategoria(nome) {\n  const n = semAcento(nome);\n  for (const c of CATEGORIAS) if (c.chaves.some((k) => n.includes(k))) return c.slug;\n  for (const [slug, re] of MODELOS) if (re.test(n)) return slug;\n  if (/\\bplaca\\b/.test(n) && /\\b(lavadora|lte|lt12|bwc|cwl|blf)/.test(n)) return 'lavadoras';\n  if (/\\bfiltro\\b/.test(n)) return 'filtros';\n  return 'outros';\n}\nfunction slugify(s) {\n  return semAcento(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$$/g, '').slice(0, 80) || 'produto';\n}\n\n// Higiene: o que bloqueia publicar e o que é só aviso.\nfunction problemas(p) {\n  const bloq = [], avisos = [];\n  if (!(p.preco > 0)) bloq.push('preço zerado');\n  if (!JSON.parse(p.imagens || '[]').length) bloq.push('sem imagem');\n  const desc = String(p.descricao || '').replace(/<[^>]+>/g, '').trim();\n  if (!desc || desc === '#N/A') bloq.push('sem descrição');\n  if (!(p.peso > 0)) avisos.push('sem peso (frete Correios indisponível)');\n  if (!(p.estoque > 0)) avisos.push('sem estoque');\n  if (!(p.custo > 0)) avisos.push('custo zerado no Bling');\n  if (p.custo > 0 && p.preco > 0 && p.preco < p.custo) bloq.push('preço abaixo do custo');\n  if (p.situacao !== 'A') bloq.push('inativo no Bling');\n  return { bloq, avisos };\n}\n\n// ---------------------------------------------------------------------------\n// Fotos otimizadas: as do Bling chegam com ~2.600 px e ~800 KB. A biblioteca sharp é\n// instalada uma vez no volume de dados (o repositório continua sem dependências) e gera\n// cards de 480 px e fotos de 1.200 px em WebP.\n// ---------------------------------------------------------------------------\nconst DEPS_DIR = path.join(CFG.dataDir, 'deps');\nlet sharp = null;\nfunction carregarSharp() {\n  try { sharp = require(path.join(DEPS_DIR, 'node_modules', 'sharp')); return true; } catch { return false; }\n}\nfunction instalarSharp() {\n  if (carregarSharp()) return Promise.resolve(true);\n  return new Promise((ok) => {\n    fs.mkdirSync(DEPS_DIR, { recursive: true });\n    const { spawn } = require('node:child_process');\n    console.log('[fotos] instalando sharp no volume (uma vez)…');\n    const pr = spawn('npm', ['install', '--prefix', DEPS_DIR, '--no-audit', '--no-fund', '--omit=dev', 'sharp@0.33.5'], { stdio: 'ignore' });\n    pr.on('exit', (code) => { const r = code === 0 && carregarSharp(); console.log(`[fotos] sharp $${r ? 'pronto' : 'indisponível (código ' + code + ')'}`); ok(r); });\n    pr.on('error', () => ok(false));\n  });\n}\nconst nomeOtim = (orig, tam) => orig.replace(/\\.(jpg|png|webp|gif)$$/, `-$${tam}.webp`);\nasync function otimizar(orig) {\n  if (!sharp) return;\n  const src = path.join(IMG_DIR, orig);\n  for (const tam of [480, 1200]) {\n    const dst = path.join(IMG_DIR, nomeOtim(orig, tam));\n    if (fs.existsSync(dst)) continue;\n    try { await sharp(src).rotate().resize(tam, tam, { fit: 'inside', withoutEnlargement: true }).webp({ quality: 78 }).toFile(dst); }\n    catch (e) { evento('foto_otim_erro', { orig, erro: e.message }); }\n  }\n}\nasync function otimizarTudo() {\n  let n = 0;\n  for (const r of db.prepare(\"SELECT imagens FROM produtos WHERE imagens <> '[]'\").all()) {\n    for (const f of JSON.parse(r.imagens)) { if (!fs.existsSync(path.join(IMG_DIR, nomeOtim(f, 480)))) { await otimizar(f); n++; } }\n  }\n  if (n) console.log(`[fotos] $${n} fotos otimizadas`);\n}\nconst fotoOtim = (orig, tam) => (orig && fs.existsSync(path.join(IMG_DIR, nomeOtim(orig, tam))) ? nomeOtim(orig, tam) : orig);\n\n// ---------------------------------------------------------------------------\n// Bling: OAuth + cliente\n// ---------------------------------------------------------------------------\nlet tokens = kvGet('bling_tokens');\nconst oauthStates = new Map();\n\nasync function blingToken(form) {\n  const basic = Buffer.from(`$${CFG.blingClientId}:$${CFG.blingClientSecret}`).toString('base64');\n  const res = await fetch(`$${CFG.blingApi}/oauth/token`, {\n    method: 'POST',\n    headers: { Authorization: `Basic $${basic}`, 'Content-Type': 'application/x-www-form-urlencoded', Accept: '1.0', 'enable-jwt': '1' },\n    body: new URLSearchParams(form).toString(),\n  });\n  const body = await res.json().catch(() => ({}));\n  if (!res.ok || !body.access_token) throw new Error(`Falha no token do Bling ($${res.status}): $${JSON.stringify(body).slice(0, 300)}`);\n  tokens = { ...body, obtido_em: Date.now() };\n  kvSet('bling_tokens', tokens);\n}\nlet renovando = null;\nasync function blingAccess() {\n  if (!tokens?.refresh_token) throw new Error('Bling não conectado. Conecte pelo painel.');\n  const expira = (tokens.obtido_em || 0) + (Number(tokens.expires_in || 0) - 120) * 1000;\n  if (Date.now() > expira) {\n    renovando ||= blingToken({ grant_type: 'refresh_token', refresh_token: tokens.refresh_token }).finally(() => { renovando = null; });\n    await renovando;\n  }\n  return tokens.access_token;\n}\nlet ultimaChamada = 0;\nasync function bling(method, rota, { query, body } = {}, tentou = false) {\n  const espera = ultimaChamada + 360 - Date.now(); // limite do Bling: 3 req/s\n  if (espera > 0) await new Promise((r) => setTimeout(r, espera));\n  ultimaChamada = Date.now();\n  const url = new URL(CFG.blingApi + rota);\n  for (const [k, v] of Object.entries(query || {})) if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);\n  const res = await fetch(url, {\n    method,\n    headers: { Authorization: `Bearer $${await blingAccess()}`, 'enable-jwt': '1', Accept: 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}) },\n    body: body ? JSON.stringify(body) : undefined,\n  });\n  if (res.status === 401 && !tentou) {\n    await blingToken({ grant_type: 'refresh_token', refresh_token: tokens.refresh_token });\n    return bling(method, rota, { query, body }, true);\n  }\n  if (res.status === 429 && !tentou) {\n    await new Promise((r) => setTimeout(r, 1500));\n    return bling(method, rota, { query, body }, true);\n  }\n  const text = await res.text();\n  let json = null;\n  try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }\n  if (!res.ok) {\n    const e = new Error(`Bling $${method} $${rota} → $${res.status}: $${JSON.stringify(json?.error || json).slice(0, 600)}`);\n    e.status = res.status;\n    throw e;\n  }\n  return json;\n}\nasync function garantirEmpresa() {\n  const r = await bling('GET', '/empresas/me/dados-basicos');\n  const cnpj = String(r?.data?.cnpj || '').replace(/\\D/g, '');\n  if (CFG.expectedCnpj && cnpj !== CFG.expectedCnpj) throw new Error(`Conta do Bling com CNPJ $${r?.data?.cnpj}, esperado o da Mio.`);\n  kvSet('bling_empresa', { nome: r?.data?.nome, cnpj: r?.data?.cnpj });\n}\n\n// ---------------------------------------------------------------------------\n// Sincronização do catálogo\n// ---------------------------------------------------------------------------\nconst sync = { rodando: false, etapa: '', inicio: null, fim: null, erro: null, lidos: 0, detalhados: 0 };\n\nasync function baixarImagem(url, nome) {\n  const destino = path.join(IMG_DIR, nome);\n  const res = await fetch(url);\n  if (!res.ok) throw new Error(`imagem $${res.status}`);\n  const buf = Buffer.from(await res.arrayBuffer());\n  if (buf.length > 4 * 1024 * 1024) throw new Error('imagem maior que 4 MB');\n  fs.writeFileSync(destino, buf);\n  for (const tam of [480, 1200]) fs.rmSync(path.join(IMG_DIR, nomeOtim(nome, tam)), { force: true });\n  return nome;\n}\n\nfunction extensaoImagem(url) {\n  const m = /\\.(jpe?g|png|webp|gif)(\\?|$$)/i.exec(url);\n  return m ? m[1].toLowerCase().replace('jpeg', 'jpg') : 'jpg';\n}\n\nasync function detalharProduto(id) {\n  const r = await bling('GET', `/produtos/$${id}`);\n  const d = r?.data;\n  if (!d) return;\n  const links = [\n    ...(d.midia?.imagens?.internas || []).map((i) => i.link),\n    ...(d.midia?.imagens?.externas || []).map((i) => i.link),\n    ...(d.midia?.imagens?.imagensURL || []).map((i) => i.link || i),\n  ].filter(Boolean).slice(0, 6);\n  const imagens = [];\n  for (let i = 0; i < links.length; i++) {\n    const nome = `$${id}-$${i}.$${extensaoImagem(links[i])}`;\n    try { imagens.push(await baixarImagem(links[i], nome)); await otimizar(nome); } catch (e) { evento('imagem_erro', { id, erro: e.message }); }\n  }\n  const desc = d.descricaoComplementar && d.descricaoComplementar.replace(/<[^>]+>/g, '').trim() ? d.descricaoComplementar : (d.descricaoCurta || '');\n  db.prepare(`UPDATE produtos SET descricao=?, marca=?, gtin=?, peso=?, altura=?, largura=?, profundidade=?,\n    categoria_bling=?, imagens=?, custo=?, detalhe_em=? WHERE id=?`).run(\n    limparHtml(desc), d.marca || '', d.gtin || '', Number(d.pesoBruto || d.pesoLiquido || 0),\n    Number(d.dimensoes?.altura || 0), Number(d.dimensoes?.largura || 0), Number(d.dimensoes?.profundidade || 0),\n    d.categoria?.id || null, JSON.stringify(imagens), Number(d.fornecedor?.precoCusto || 0), agora(), id,\n  );\n}\n\n// Mantém só tags simples de texto na descrição vinda do Bling.\nfunction limparHtml(html) {\n  return String(html || '')\n    .replace(/<\\s*(script|style|iframe|object|embed)[\\s\\S]*?<\\/\\s*\\1\\s*>/gi, '')\n    .replace(/<(\\/?)(\\w+)[^>]*>/g, (m, barra, tag) => (['p', 'br', 'b', 'strong', 'i', 'em', 'ul', 'ol', 'li', 'h3', 'h4'].includes(tag.toLowerCase()) ? `<$${barra}$${tag.toLowerCase()}>` : ''))\n    .replace(/<p>\\s*(&nbsp;| )?\\s*<\\/p>/g, '')\n    .trim();\n}\n\nfunction slugUnico(nome, id) {\n  let base = slugify(nome), s = base, n = 2;\n  while (db.prepare('SELECT 1 FROM produtos WHERE slug=? AND id<>?').get(s, id)) s = `$${base}-$${n++}`;\n  return s;\n}\n\n// completo=true relê o detalhe (imagens, descrição, peso) de todos; senão só dos novos ou sem detalhe recente.\nasync function sincronizar({ completo = false } = {}) {\n  if (sync.rodando) return;\n  Object.assign(sync, { rodando: true, etapa: 'listando produtos', inicio: agora(), fim: null, erro: null, lidos: 0, detalhados: 0 });\n  try {\n    await garantirEmpresa();\n    const vistos = new Set();\n    for (let pagina = 1; pagina < 200; pagina++) {\n      const r = await bling('GET', '/produtos', { query: { pagina, limite: 100, criterio: 2, tipo: 'P' } });\n      const lista = r?.data || [];\n      for (const p of lista) {\n        if (p.idProdutoPai) continue; // variação: fica para uma versão futura\n        vistos.add(p.id);\n        const existe = db.prepare('SELECT id, nome, slug FROM produtos WHERE id=?').get(p.id);\n        const preco = Number(p.preco || 0), estoque = Number(p.estoque?.saldoVirtualTotal || 0);\n        if (existe) {\n          db.prepare('UPDATE produtos SET codigo=?, nome=?, preco=?, estoque=?, situacao=?, formato=?, sync_em=? WHERE id=?')\n            .run(p.codigo || '', p.nome, preco, estoque, p.situacao || 'A', p.formato || 'S', agora(), p.id);\n          db.prepare('UPDATE produtos SET categoria_site=? WHERE id=? AND categoria_manual=0').run(sugerirCategoria(p.nome), p.id);\n        } else {\n          db.prepare(`INSERT INTO produtos(id,codigo,nome,slug,preco,estoque,situacao,formato,categoria_site,sync_em)\n            VALUES(?,?,?,?,?,?,?,?,?,?)`).run(p.id, p.codigo || '', p.nome, slugUnico(p.nome, p.id), preco, estoque,\n            p.situacao || 'A', p.formato || 'S', sugerirCategoria(p.nome), agora());\n        }\n        // Miniatura para os cards: a listagem do Bling já traz a versão reduzida da foto principal.\n        const mini = db.prepare('SELECT miniatura FROM produtos WHERE id=?').get(p.id)?.miniatura;\n        if (p.imagemURL && /\\/t\\//.test(p.imagemURL) && !(mini && fs.existsSync(path.join(IMG_DIR, mini)))) {\n          const nome = `$${p.id}-0t.$${extensaoImagem(p.imagemURL)}`;\n          try { await baixarImagem(p.imagemURL, nome); db.prepare('UPDATE produtos SET miniatura=? WHERE id=?').run(nome, p.id); } catch (e) { evento('miniatura_erro', { id: p.id, erro: e.message }); }\n        }\n        sync.lidos++;\n      }\n      if (lista.length < 100) break;\n    }\n    // Produtos que sumiram dos ativos no Bling saem do ar.\n    const todos = db.prepare(\"SELECT id FROM produtos WHERE situacao='A'\").all();\n    for (const { id } of todos) if (!vistos.has(id)) db.prepare(\"UPDATE produtos SET situacao='I', publicado=0 WHERE id=?\").run(id);\n\n    sync.etapa = 'lendo detalhes e imagens';\n    const umDia = new Date(Date.now() - 24 * 3600e3).toISOString();\n    const pend = completo\n      ? db.prepare(\"SELECT id FROM produtos WHERE situacao='A' ORDER BY publicado DESC\").all()\n      : db.prepare(\"SELECT id FROM produtos WHERE situacao='A' AND (detalhe_em IS NULL OR (publicado=1 AND detalhe_em < ?))\").all(umDia);\n    for (const { id } of pend) {\n      try { await detalharProduto(id); sync.detalhados++; } catch (e) { evento('detalhe_erro', { id, erro: e.message }); }\n    }\n    // Publicado que deixou de passar na higiene sai do ar.\n    for (const p of db.prepare('SELECT * FROM produtos WHERE publicado=1').all()) {\n      if (problemas(p).bloq.length) { db.prepare('UPDATE produtos SET publicado=0 WHERE id=?').run(p.id); evento('despublicado', { id: p.id, motivo: problemas(p).bloq }); }\n    }\n    kvSet('ultimo_sync', { em: agora(), lidos: sync.lidos, detalhados: sync.detalhados });\n  } catch (e) {\n    sync.erro = e.message;\n    evento('sync_erro', { erro: e.message });\n  } finally {\n    sync.rodando = false; sync.fim = agora(); sync.etapa = '';\n  }\n}\n\n// ---------------------------------------------------------------------------\n// Frete\n// ---------------------------------------------------------------------------\nasync function cotarFrete(cep, itens) {\n  cep = String(cep || '').replace(/\\D/g, '');\n  if (cep.length !== 8) throw httpErro(400, 'CEP inválido.');\n  const opcoes = [{ tipo: 'retirada', nome: 'Retirar na loja (Av. Andrômeda, 3358 – São José dos Campos)', valor: 0, prazo: 'No mesmo dia útil, após a confirmação do pagamento' }];\n  const n = Number(cep);\n  if (n >= CFG.freteLocalCeps[0] && n <= CFG.freteLocalCeps[1]) {\n    opcoes.push({ tipo: 'local', nome: 'Entrega em São José dos Campos', valor: CFG.freteLocalValor, prazo: 'Até 1 dia útil' });\n  }\n  if (CFG.melhorEnvioToken) {\n    const produtos = itens.map(({ p, qtd }) => ({\n      id: String(p.id), width: Math.max(p.largura || 11, 11), height: Math.max(p.altura || 2, 2), length: Math.max(p.profundidade || 16, 16),\n      weight: Math.max(p.peso || 0.1, 0.05), insurance_value: p.preco, quantity: qtd,\n    }));\n    if (itens.every(({ p }) => p.peso > 0)) {\n      try {\n        const res = await fetch('https://melhorenvio.com.br/api/v2/me/shipment/calculate', {\n          method: 'POST',\n          headers: { Authorization: `Bearer $${CFG.melhorEnvioToken}`, 'Content-Type': 'application/json', Accept: 'application/json', 'User-Agent': `Mio Peca ($${CFG.melhorEnvioEmail})` },\n          body: JSON.stringify({ from: { postal_code: CFG.origemCep }, to: { postal_code: cep }, products: produtos }),\n        });\n        const lista = await res.json();\n        for (const s of Array.isArray(lista) ? lista : []) {\n          if (s.error || !s.price) continue;\n          opcoes.push({ tipo: `me_$${s.id}`, nome: `$${s.company?.name || ''} $${s.name}`.trim(), valor: Number(s.custom_price || s.price), prazo: `$${s.custom_delivery_time || s.delivery_time} dias úteis` });\n        }\n      } catch (e) { evento('frete_erro', { erro: e.message }); }\n    }\n  }\n  return opcoes;\n}\n\n// ---------------------------------------------------------------------------\n// Mercado Pago\n// ---------------------------------------------------------------------------\nasync function mp(method, rota, body) {\n  const res = await fetch(`https://api.mercadopago.com$${rota}`, {\n    method,\n    headers: { Authorization: `Bearer $${CFG.mpToken}`, 'Content-Type': 'application/json', 'X-Idempotency-Key': crypto.randomUUID() },\n    body: body ? JSON.stringify(body) : undefined,\n  });\n  const json = await res.json().catch(() => ({}));\n  if (!res.ok) throw new Error(`Mercado Pago $${rota} → $${res.status}: $${JSON.stringify(json).slice(0, 400)}`);\n  return json;\n}\n\nasync function criarPreferencia(pedido) {\n  const cliente = JSON.parse(pedido.cliente);\n  const itens = JSON.parse(pedido.itens);\n  const volta = `$${CFG.publicUrl}/pedido.html?c=$${pedido.codigo}&t=$${pedido.token}`;\n  const https = CFG.publicUrl.startsWith('https://');\n  const pref = await mp('POST', '/checkout/preferences', {\n    items: itens.map((i) => ({ id: String(i.id), title: i.nome.slice(0, 250), quantity: i.qtd, unit_price: i.preco, currency_id: 'BRL' })),\n    shipments: pedido.frete > 0 ? { cost: pedido.frete, mode: 'not_specified' } : undefined,\n    payer: { name: cliente.nome, email: cliente.email },\n    external_reference: pedido.codigo,\n    statement_descriptor: 'MIOPECA',\n    back_urls: { success: volta, failure: volta, pending: volta },\n    ...(https ? { auto_return: 'approved', notification_url: `$${CFG.publicUrl}/api/webhooks/mercadopago` } : {}),\n    expires: true,\n    expiration_date_to: new Date(Date.now() + 48 * 3600e3).toISOString(),\n  });\n  db.prepare('UPDATE pedidos SET mp_preferencia=?, mp_link=?, atualizado_em=? WHERE id=?').run(pref.id, pref.init_point, agora(), pedido.id);\n  return pref.init_point;\n}\n\nconst STATUS_MP = { approved: 'pago', authorized: 'pago', pending: 'aguardando_pagamento', in_process: 'aguardando_pagamento', rejected: 'aguardando_pagamento', cancelled: 'cancelado', refunded: 'cancelado', charged_back: 'cancelado' };\n\nasync function atualizarPagamento(paymentId) {\n  const pg = await mp('GET', `/v1/payments/$${encodeURIComponent(paymentId)}`);\n  const pedido = db.prepare('SELECT * FROM pedidos WHERE codigo=?').get(pg.external_reference || '');\n  if (!pedido) return evento('mp_sem_pedido', { paymentId, ref: pg.external_reference });\n  const novo = STATUS_MP[pg.status] || pedido.status;\n  // Não regride status operacional (enviado/entregue) por notificação atrasada.\n  const status = ['enviado', 'entregue'].includes(pedido.status) && novo !== 'cancelado' ? pedido.status : novo;\n  if (status === 'pago' && Math.abs(Number(pg.transaction_amount) - pedido.total) > 0.01) {\n    evento('mp_valor_divergente', { codigo: pedido.codigo, pago: pg.transaction_amount, total: pedido.total });\n  }\n  db.prepare('UPDATE pedidos SET mp_pagamento=?, mp_status=?, status=?, atualizado_em=? WHERE id=?').run(String(pg.id), pg.status, status, agora(), pedido.id);\n  evento('mp_pagamento', { codigo: pedido.codigo, status: pg.status });\n  if (status === 'pago' && pedido.status !== 'pago' && CFG.blingPedidoAuto && !pedido.bling_pedido_id) {\n    enviarPedidoBling(pedido.id).catch((e) => evento('bling_pedido_erro', { codigo: pedido.codigo, erro: e.message }));\n  }\n}\n\n// ---------------------------------------------------------------------------\n// Pedido de venda no Bling\n// ---------------------------------------------------------------------------\nasync function contatoBling(cliente, end) {\n  const doc = cliente.cpf.replace(/\\D/g, '');\n  const busca = await bling('GET', '/contatos', { query: { numeroDocumento: doc, limite: 1 } });\n  if (busca?.data?.[0]?.id) return busca.data[0].id;\n  const novo = await bling('POST', '/contatos', {\n    body: {\n      nome: cliente.nome, tipo: 'F', numeroDocumento: doc, situacao: 'A', email: cliente.email, celular: cliente.telefone,\n      endereco: end ? { geral: { endereco: end.rua, numero: end.numero, complemento: end.complemento || '', bairro: end.bairro, cep: end.cep, municipio: end.cidade, uf: end.uf } } : undefined,\n    },\n  });\n  return novo?.data?.id;\n}\n\nasync function enviarPedidoBling(id) {\n  const pedido = db.prepare('SELECT * FROM pedidos WHERE id=?').get(id);\n  if (!pedido) throw httpErro(404, 'Pedido não encontrado.');\n  if (pedido.bling_pedido_id) throw httpErro(409, `Já enviado ao Bling (id $${pedido.bling_pedido_id}).`);\n  if (pedido.status !== 'pago') throw httpErro(409, 'Só pedidos pagos vão ao Bling.');\n  try {\n    await garantirEmpresa();\n    const cliente = JSON.parse(pedido.cliente), end = pedido.endereco ? JSON.parse(pedido.endereco) : null;\n    const contato = await contatoBling(cliente, end);\n    const hoje = new Date().toISOString().slice(0, 10);\n    const r = await bling('POST', '/pedidos/vendas', {\n      body: {\n        contato: { id: contato },\n        data: hoje,\n        numeroLoja: pedido.codigo,\n        ...(CFG.blingLojaId ? { loja: { id: CFG.blingLojaId } } : {}),\n        itens: JSON.parse(pedido.itens).map((i) => ({ produto: { id: i.id }, codigo: i.codigo, descricao: i.nome, unidade: 'UN', quantidade: i.qtd, valor: i.preco })),\n        transporte: {\n          fretePorConta: 0, frete: pedido.frete,\n          ...(end ? { etiqueta: { nome: cliente.nome, endereco: end.rua, numero: end.numero, complemento: end.complemento || '', municipio: end.cidade, uf: end.uf, cep: end.cep, bairro: end.bairro } } : {}),\n        },\n        parcelas: [{ dataVencimento: hoje, valor: pedido.total, observacoes: `Mercado Pago $${pedido.mp_pagamento || ''}`.trim() }],\n        observacoes: `Loja própria — $${pedido.codigo} — $${pedido.frete_nome || ''}`,\n        observacoesInternas: `Pagamento MP $${pedido.mp_pagamento || '-'}`,\n      },\n    });\n    const bid = r?.data?.id;\n    db.prepare('UPDATE pedidos SET bling_pedido_id=?, bling_erro=NULL, atualizado_em=? WHERE id=?').run(bid, agora(), id);\n    try {\n      const det = await bling('GET', `/pedidos/vendas/$${bid}`);\n      db.prepare('UPDATE pedidos SET bling_numero=? WHERE id=?').run(String(det?.data?.numero || ''), id);\n    } catch {}\n    evento('bling_pedido_criado', { codigo: pedido.codigo, bling: bid });\n    return bid;\n  } catch (e) {\n    db.prepare('UPDATE pedidos SET bling_erro=?, atualizado_em=? WHERE id=?').run(e.message.slice(0, 800), agora(), id);\n    throw e;\n  }\n}\n\n// ---------------------------------------------------------------------------\n// HTTP: utilitários\n// ---------------------------------------------------------------------------\nfunction httpErro(status, msg) { const e = new Error(msg); e.status = status; return e; }\nfunction send(res, status, body, headers = {}) {\n  const isStr = typeof body === 'string';\n  res.writeHead(status, { 'Content-Type': isStr ? 'text/html; charset=utf-8' : 'application/json; charset=utf-8', 'Cache-Control': 'no-store', ...headers });\n  res.end(isStr ? body : JSON.stringify(body));\n}\nfunction readBody(req, limite = 64 * 1024) {\n  return new Promise((ok, falha) => {\n    let tam = 0; const partes = [];\n    req.on('data', (c) => { tam += c.length; if (tam > limite) { falha(httpErro(413, 'Corpo grande demais.')); req.destroy(); } else partes.push(c); });\n    req.on('end', () => ok(Buffer.concat(partes).toString('utf8')));\n    req.on('error', falha);\n  });\n}\nasync function readJson(req) {\n  const t = await readBody(req);\n  try { return t ? JSON.parse(t) : {}; } catch { throw httpErro(400, 'JSON inválido.'); }\n}\nconst safeEqual = (a, b) => {\n  const ha = crypto.createHash('sha256').update(String(a)).digest(), hb = crypto.createHash('sha256').update(String(b)).digest();\n  return crypto.timingSafeEqual(ha, hb);\n};\n\n// Sessão do painel: cookie assinado com HMAC (sem estado no servidor).\nfunction assinar(v) { return crypto.createHmac('sha256', CFG.sessionSecret).update(v).digest('base64url'); }\nfunction criarSessao(res) {\n  const exp = String(Date.now() + 12 * 3600e3);\n  const cookie = `mio_s=$${exp}.$${assinar(exp)}; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200$${CFG.cookieSecure ? '; Secure' : ''}`;\n  res.setHeader('Set-Cookie', cookie);\n}\nfunction sessaoValida(req) {\n  if (!CFG.sessionSecret || !CFG.adminPassword) return false;\n  const m = /(?:^|;\\s*)mio_s=([^;]+)/.exec(req.headers.cookie || '');\n  if (!m) return false;\n  const [exp, sig] = m[1].split('.');\n  return sig && safeEqual(sig, assinar(exp)) && Number(exp) > Date.now();\n}\n// Limite simples por IP.\nconst janelas = new Map();\nfunction limitar(req, chave, max, janelaMs) {\n  const ip = req.headers['x-real-ip'] || req.socket.remoteAddress;\n  const k = `$${chave}:$${ip}`, t = Date.now();\n  const lista = (janelas.get(k) || []).filter((x) => t - x < janelaMs);\n  if (lista.length >= max) throw httpErro(429, 'Muitas tentativas. Aguarde alguns minutos.');\n  lista.push(t); janelas.set(k, lista);\n}\n\nfunction cpfValido(cpf) {\n  const c = String(cpf).replace(/\\D/g, '');\n  if (c.length !== 11 || /^(\\d)\\1+$$/.test(c)) return false;\n  for (const t of [9, 10]) {\n    let s = 0;\n    for (let i = 0; i < t; i++) s += Number(c[i]) * (t + 1 - i);\n    if (((s * 10) % 11) % 10 !== Number(c[t])) return false;\n  }\n  return true;\n}\n\n// Visão pública do produto.\nfunction produtoPublico(p, completo = false) {\n  const orig = JSON.parse(p.imagens || '[]');\n  const imgs = orig.map((f) => `/img/$${fotoOtim(f, 1200)}`);\n  const card = orig[0] && fotoOtim(orig[0], 480) !== orig[0] ? `/img/$${fotoOtim(orig[0], 480)}` : null;\n  const base = {\n    id: p.id, slug: p.slug, nome: p.titulo_site || p.nome, preco: p.preco, disponivel: p.estoque > 0,\n    estoque: p.estoque > 0 ? Math.min(Math.floor(p.estoque), 99) : 0, imagem: card || imgs[0] || (p.miniatura ? `/img/$${p.miniatura}` : null), categoria: p.categoria_site, marca: p.marca,\n  };\n  return completo ? { ...base, imagens: imgs, descricao: p.descricao, codigo: p.codigo, gtin: p.gtin, peso: p.peso } : base;\n}\nfunction produtoAdmin(p) {\n  const { bloq, avisos } = problemas(p);\n  return {\n    id: p.id, codigo: p.codigo, nome: p.nome, titulo_site: p.titulo_site, slug: p.slug, preco: p.preco, custo: p.custo, estoque: p.estoque,\n    peso: p.peso, marca: p.marca, situacao: p.situacao, publicado: !!p.publicado, destaque: !!p.destaque, categoria_site: p.categoria_site,\n    imagem: JSON.parse(p.imagens || '[]')[0] ? `/img/$${JSON.parse(p.imagens)[0]}` : null, detalhado: !!p.detalhe_em, bloqueios: bloq, avisos,\n  };\n}\n\n// ---------------------------------------------------------------------------\n// Rotas\n// ---------------------------------------------------------------------------\nasync function rotear(req, res, url) {\n  const p = url.pathname, m = req.method;\n\n  if (p === '/api/health') return send(res, 200, { ok: true, bling: !!tokens?.refresh_token, mp: !!CFG.mpToken });\n\n  // Imagens (cacheadas do Bling)\n  if (p.startsWith('/img/') && m === 'GET') {\n    const nome = path.basename(p);\n    if (!/^\\d+-\\d+(t|\\.\\w+-\\d+|-\\d+)?\\.(jpg|png|webp|gif)$$/.test(nome) && !/^\\d+-\\d+-(480|1200)\\.webp$$/.test(nome)) return send(res, 404, { erro: 'não encontrado' });\n    const arq = path.join(IMG_DIR, nome);\n    if (!fs.existsSync(arq)) return send(res, 404, { erro: 'não encontrado' });\n    const tipo = { jpg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' }[nome.split('.').pop()];\n    res.writeHead(200, { 'Content-Type': tipo, 'Cache-Control': 'public, max-age=86400' });\n    return fs.createReadStream(arq).pipe(res);\n  }\n\n  if (p.startsWith('/assets/') && m === 'GET') {\n    const nome = path.basename(p);\n    if (!ASSETS[nome]) return send(res, 404, { erro: 'não encontrado' });\n    const arq = path.join(ASSET_DIR, nome);\n    if (!fs.existsSync(arq)) { espelharAssets().catch(() => {}); return send(res, 404, { erro: 'não encontrado' }); }\n    res.writeHead(200, { 'Content-Type': TIPOS[nome.split('.').pop()], 'Cache-Control': 'public, max-age=604800', 'Access-Control-Allow-Origin': '*' });\n    return fs.createReadStream(arq).pipe(res);\n  }\n\n  // ---------- Loja pública ----------\n  if (p === '/api/categorias' && m === 'GET') {\n    const cont = Object.fromEntries(db.prepare(\"SELECT categoria_site c, COUNT(*) n FROM produtos WHERE publicado=1 GROUP BY categoria_site\").all().map((r) => [r.c, r.n]));\n    return send(res, 200, CATEGORIAS.map((c) => ({ slug: c.slug, nome: c.nome, total: cont[c.slug] || 0 })));\n  }\n\n  if (p === '/api/produtos' && m === 'GET') {\n    const cat = url.searchParams.get('cat') || '', q = semAcento(url.searchParams.get('q') || '').trim();\n    const pagina = Math.max(1, Number(url.searchParams.get('pagina') || 1)), porPag = Math.min(48, Math.max(1, Number(url.searchParams.get('limite') || 24)));\n    const ordem = { menor: 'preco ASC', maior: 'preco DESC', nome: 'nome ASC' }[url.searchParams.get('ordem')] || 'destaque DESC, (estoque>0) DESC, nome ASC';\n    let lista = db.prepare(`SELECT * FROM produtos WHERE publicado=1 $${cat ? 'AND categoria_site=?' : ''} ORDER BY $${ordem}`).all(...(cat ? [cat] : []));\n    if (url.searchParams.get('destaque') === '1') lista = lista.filter((x) => x.destaque);\n    if (q) {\n      const termos = q.split(/\\s+/);\n      lista = lista.filter((x) => { const t = semAcento(`$${x.titulo_site || ''} $${x.nome} $${x.codigo} $${x.marca} $${x.gtin}`); return termos.every((k) => t.includes(k)); });\n    }\n    return send(res, 200, { total: lista.length, pagina, itens: lista.slice((pagina - 1) * porPag, pagina * porPag).map((x) => produtoPublico(x)) });\n  }\n\n  let mm;\n  if ((mm = /^\\/api\\/produtos\\/([a-z0-9-]+)$$/.exec(p)) && m === 'GET') {\n    const prod = db.prepare('SELECT * FROM produtos WHERE slug=? AND publicado=1').get(mm[1]);\n    if (!prod) return send(res, 404, { erro: 'Produto não encontrado.' });\n    const rel = db.prepare('SELECT * FROM produtos WHERE publicado=1 AND categoria_site=? AND id<>? ORDER BY (estoque>0) DESC, destaque DESC LIMIT 4').all(prod.categoria_site, prod.id);\n    return send(res, 200, { ...produtoPublico(prod, true), relacionados: rel.map((x) => produtoPublico(x)) });\n  }\n\n  // Monta itens a partir do carrinho com preço e estoque do banco (nunca do cliente).\n  const montarItens = (itensReq) => {\n    if (!Array.isArray(itensReq) || !itensReq.length || itensReq.length > 30) throw httpErro(400, 'Carrinho vazio ou inválido.');\n    return itensReq.map((i) => {\n      const prod = db.prepare('SELECT * FROM produtos WHERE id=? AND publicado=1').get(Number(i.id));\n      if (!prod) throw httpErro(409, 'Um produto do carrinho não está mais disponível.');\n      const qtd = Math.floor(Number(i.qtd));\n      if (!(qtd >= 1 && qtd <= 99)) throw httpErro(400, 'Quantidade inválida.');\n      if (qtd > prod.estoque) throw httpErro(409, `Estoque insuficiente para \"$${prod.titulo_site || prod.nome}\" (disponível: $${Math.max(0, Math.floor(prod.estoque))}).`);\n      return { p: prod, qtd };\n    });\n  };\n\n  if (p === '/api/frete' && m === 'POST') {\n    limitar(req, 'frete', 60, 60e3);\n    const b = await readJson(req);\n    return send(res, 200, await cotarFrete(b.cep, montarItens(b.itens)));\n  }\n\n  if (p === '/api/pedidos' && m === 'POST') {\n    limitar(req, 'pedido', 8, 10 * 60e3);\n    const b = await readJson(req);\n    const c = b.cliente || {}, e = b.endereco || {};\n    const cliente = { nome: String(c.nome || '').trim().slice(0, 120), cpf: String(c.cpf || '').replace(/\\D/g, ''), email: String(c.email || '').trim().toLowerCase().slice(0, 160), telefone: String(c.telefone || '').replace(/\\D/g, '').slice(0, 13) };\n    if (cliente.nome.split(/\\s+/).length < 2) throw httpErro(400, 'Informe nome e sobrenome.');\n    if (!cpfValido(cliente.cpf)) throw httpErro(400, 'CPF inválido.');\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$$/.test(cliente.email)) throw httpErro(400, 'E-mail inválido.');\n    if (cliente.telefone.length < 10) throw httpErro(400, 'Telefone inválido.');\n    const itens = montarItens(b.itens);\n    const cep = String(e.cep || '').replace(/\\D/g, '');\n    const opcoes = await cotarFrete(cep, itens);\n    const frete = opcoes.find((o) => o.tipo === b.frete_tipo);\n    if (!frete) throw httpErro(400, 'Escolha uma forma de entrega válida.');\n    let endereco = null;\n    if (frete.tipo !== 'retirada') {\n      endereco = { cep, rua: String(e.rua || '').slice(0, 120), numero: String(e.numero || '').slice(0, 20), complemento: String(e.complemento || '').slice(0, 60), bairro: String(e.bairro || '').slice(0, 60), cidade: String(e.cidade || '').slice(0, 60), uf: String(e.uf || '').toUpperCase().slice(0, 2) };\n      if (!endereco.rua || !endereco.numero || !endereco.bairro || !endereco.cidade || endereco.uf.length !== 2) throw httpErro(400, 'Endereço de entrega incompleto.');\n    }\n    const linhas = itens.map(({ p: pr, qtd }) => ({ id: pr.id, codigo: pr.codigo, nome: pr.titulo_site || pr.nome, preco: pr.preco, qtd }));\n    const subtotal = Math.round(linhas.reduce((s, i) => s + i.preco * i.qtd, 0) * 100) / 100;\n    const total = Math.round((subtotal + frete.valor) * 100) / 100;\n    const token = crypto.randomBytes(12).toString('base64url');\n    const t = agora();\n    const info = db.prepare(`INSERT INTO pedidos(codigo,token,cliente,endereco,itens,subtotal,frete,frete_tipo,frete_nome,total,criado_em,atualizado_em)\n      VALUES(?,?,?,?,?,?,?,?,?,?,?,?)`).run('tmp-' + token, token, JSON.stringify(cliente), endereco && JSON.stringify(endereco), JSON.stringify(linhas), subtotal, frete.valor, frete.tipo, frete.nome, total, t, t);\n    const codigo = `MIO$${1000 + Number(info.lastInsertRowid)}`;\n    db.prepare('UPDATE pedidos SET codigo=? WHERE id=?').run(codigo, info.lastInsertRowid);\n    evento('pedido_criado', { codigo, total });\n    const pedido = db.prepare('SELECT * FROM pedidos WHERE id=?').get(info.lastInsertRowid);\n    let pagamento = null;\n    if (CFG.mpToken) {\n      try { pagamento = await criarPreferencia(pedido); } catch (err) { evento('mp_erro', { codigo, erro: err.message }); }\n    }\n    return send(res, 201, { codigo, token, total, pagamento });\n  }\n\n  if ((mm = /^\\/api\\/pedidos\\/(MIO\\d+)$$/.exec(p)) && m === 'GET') {\n    const ped = db.prepare('SELECT * FROM pedidos WHERE codigo=?').get(mm[1]);\n    if (!ped || !safeEqual(url.searchParams.get('t') || '', ped.token)) return send(res, 404, { erro: 'Pedido não encontrado.' });\n    // Na volta do Mercado Pago, confere o pagamento direto na API (não confia na URL).\n    const pid = url.searchParams.get('payment_id');\n    if (pid && CFG.mpToken && ped.status === 'aguardando_pagamento') { try { await atualizarPagamento(pid); } catch (e) { evento('mp_erro', { erro: e.message }); } }\n    const atual = db.prepare('SELECT * FROM pedidos WHERE id=?').get(ped.id);\n    return send(res, 200, {\n      codigo: atual.codigo, status: atual.status, criado_em: atual.criado_em, itens: JSON.parse(atual.itens), subtotal: atual.subtotal,\n      frete: atual.frete, frete_nome: atual.frete_nome, total: atual.total, pagamento: atual.status === 'aguardando_pagamento' ? atual.mp_link : null,\n      cliente: { nome: JSON.parse(atual.cliente).nome },\n    });\n  }\n\n  if (p === '/api/webhooks/mercadopago' && m === 'POST') {\n    const b = await readJson(req).catch(() => ({}));\n    const tipo = b.type || b.topic || url.searchParams.get('type') || url.searchParams.get('topic');\n    const id = b.data?.id || url.searchParams.get('data.id') || url.searchParams.get('id');\n    if (tipo === 'payment' && id && CFG.mpToken) atualizarPagamento(id).catch((e) => evento('mp_webhook_erro', { erro: e.message }));\n    return send(res, 200, { ok: true });\n  }\n\n  // ---------- OAuth Bling (retorno) ----------\n  if (p === '/oauth/callback' && m === 'GET') {\n    const state = url.searchParams.get('state') || '';\n    const criado = oauthStates.get(state); oauthStates.delete(state);\n    if (!criado || Date.now() - criado > 10 * 60e3) return send(res, 400, 'Autorização expirada. Recomece pelo painel.');\n    const code = url.searchParams.get('code');\n    if (!code) return send(res, 400, 'Código ausente.');\n    await blingToken({ grant_type: 'authorization_code', code });\n    try { await garantirEmpresa(); } catch (e) {\n      tokens = null; kvSet('bling_tokens', null);\n      return send(res, 403, `<h2>Autorização recusada</h2><p>$${e.message.replace(/[<>&]/g, '')}</p>`);\n    }\n    evento('bling_conectado', {});\n    sincronizar({ completo: true });\n    return send(res, 302, '', { Location: '/painel.html?bling=ok' });\n  }\n\n  // ---------- Painel ----------\n  if (p === '/api/admin/login' && m === 'POST') {\n    limitar(req, 'login', 10, 15 * 60e3);\n    const b = await readJson(req);\n    if (!CFG.adminPassword || !CFG.sessionSecret || !safeEqual(b.senha || '', CFG.adminPassword)) throw httpErro(401, 'Senha incorreta.');\n    criarSessao(res);\n    return send(res, 200, { ok: true });\n  }\n  if (p === '/api/admin/logout' && m === 'POST') {\n    res.setHeader('Set-Cookie', 'mio_s=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0');\n    return send(res, 200, { ok: true });\n  }\n  if (!p.startsWith('/api/admin/')) return send(res, 404, { erro: 'não encontrado' });\n  if (!sessaoValida(req)) return send(res, 401, { erro: 'Faça login.' });\n\n  if (p === '/api/admin/status' && m === 'GET') {\n    const cont = db.prepare(`SELECT COUNT(*) total, SUM(publicado) publicados, SUM(situacao='A') ativos FROM produtos`).get();\n    const ped = db.prepare(`SELECT status, COUNT(*) n, SUM(total) v FROM pedidos GROUP BY status`).all();\n    return send(res, 200, {\n      bling: { conectado: !!tokens?.refresh_token, configurado: !!(CFG.blingClientId && CFG.blingClientSecret), empresa: kvGet('bling_empresa'), pedidoAuto: CFG.blingPedidoAuto, callback: `$${CFG.publicUrl}/oauth/callback` },\n      sync: { ...sync, ultimo: kvGet('ultimo_sync'), intervaloMin: CFG.syncMinutos },\n      mp: { configurado: !!CFG.mpToken, webhook: CFG.publicUrl.startsWith('https://') ? `$${CFG.publicUrl}/api/webhooks/mercadopago` : null },\n      frete: { local: CFG.freteLocalValor, melhorEnvio: !!CFG.melhorEnvioToken },\n      produtos: cont, pedidos: ped, publicUrl: CFG.publicUrl, categorias: CATEGORIAS.map(({ slug, nome }) => ({ slug, nome })),\n    });\n  }\n\n  if (p === '/api/admin/bling/conectar' && m === 'GET') {\n    if (!CFG.blingClientId) return send(res, 400, 'BLING_CLIENT_ID não configurado.');\n    const state = crypto.randomBytes(16).toString('hex');\n    oauthStates.set(state, Date.now());\n    const a = new URL(CFG.blingAuthorize);\n    a.searchParams.set('response_type', 'code'); a.searchParams.set('client_id', CFG.blingClientId); a.searchParams.set('state', state);\n    return send(res, 302, '', { Location: a.toString() });\n  }\n\n  if (p === '/api/admin/sync' && m === 'POST') {\n    const b = await readJson(req);\n    if (!tokens?.refresh_token) throw httpErro(409, 'Conecte o Bling primeiro.');\n    if (sync.rodando) return send(res, 202, { ok: true, jaRodando: true });\n    sincronizar({ completo: !!b.completo });\n    return send(res, 202, { ok: true });\n  }\n\n  if (p === '/api/admin/produtos' && m === 'GET') {\n    const q = semAcento(url.searchParams.get('q') || ''), filtro = url.searchParams.get('filtro') || 'todos', cat = url.searchParams.get('cat') || '';\n    let lista = db.prepare(\"SELECT * FROM produtos WHERE situacao='A' ORDER BY publicado DESC, nome ASC\").all().map(produtoAdmin);\n    if (q) lista = lista.filter((x) => semAcento(`$${x.nome} $${x.codigo} $${x.titulo_site || ''}`).includes(q));\n    if (cat) lista = lista.filter((x) => x.categoria_site === cat);\n    if (filtro === 'publicados') lista = lista.filter((x) => x.publicado);\n    if (filtro === 'prontos') lista = lista.filter((x) => !x.publicado && !x.bloqueios.length);\n    if (filtro === 'bloqueados') lista = lista.filter((x) => x.bloqueios.length);\n    const pagina = Math.max(1, Number(url.searchParams.get('pagina') || 1));\n    return send(res, 200, { total: lista.length, itens: lista.slice((pagina - 1) * 50, pagina * 50) });\n  }\n\n  if ((mm = /^\\/api\\/admin\\/produtos\\/(\\d+)$$/.exec(p)) && m === 'PATCH') {\n    const id = Number(mm[1]);\n    const prod = db.prepare('SELECT * FROM produtos WHERE id=?').get(id);\n    if (!prod) throw httpErro(404, 'Produto não encontrado.');\n    const b = await readJson(req);\n    if (b.publicado === true && problemas(prod).bloq.length) throw httpErro(409, `Não dá para publicar: $${problemas(prod).bloq.join(', ')}.`);\n    if (b.categoria_site !== undefined && !CAT_SLUGS.has(b.categoria_site)) throw httpErro(400, 'Categoria inválida.');\n    const titulo = b.titulo_site === undefined ? prod.titulo_site : (String(b.titulo_site || '').trim().slice(0, 120) || null);\n    if (b.categoria_site !== undefined && b.categoria_site !== prod.categoria_site) db.prepare('UPDATE produtos SET categoria_manual=1 WHERE id=?').run(id);\n    db.prepare('UPDATE produtos SET publicado=?, destaque=?, categoria_site=?, titulo_site=? WHERE id=?').run(\n      b.publicado === undefined ? prod.publicado : (b.publicado ? 1 : 0), b.destaque === undefined ? prod.destaque : (b.destaque ? 1 : 0),\n      b.categoria_site ?? prod.categoria_site, titulo, id);\n    evento('produto_editado', { id, ...b });\n    return send(res, 200, produtoAdmin(db.prepare('SELECT * FROM produtos WHERE id=?').get(id)));\n  }\n\n  if ((mm = /^\\/api\\/admin\\/produtos\\/(\\d+)\\/atualizar$$/.exec(p)) && m === 'POST') {\n    await detalharProduto(Number(mm[1]));\n    return send(res, 200, produtoAdmin(db.prepare('SELECT * FROM produtos WHERE id=?').get(Number(mm[1]))));\n  }\n\n  if (p === '/api/admin/pedidos' && m === 'GET') {\n    const st = url.searchParams.get('status');\n    const lista = db.prepare(`SELECT * FROM pedidos $${st ? 'WHERE status=?' : ''} ORDER BY id DESC LIMIT 200`).all(...(st ? [st] : []));\n    return send(res, 200, lista.map((x) => ({ ...x, token: undefined, cliente: JSON.parse(x.cliente), endereco: x.endereco && JSON.parse(x.endereco), itens: JSON.parse(x.itens) })));\n  }\n\n  if ((mm = /^\\/api\\/admin\\/pedidos\\/(\\d+)$$/.exec(p)) && m === 'PATCH') {\n    const b = await readJson(req);\n    const permitidos = ['aguardando_pagamento', 'pago', 'enviado', 'entregue', 'cancelado'];\n    if (b.status && !permitidos.includes(b.status)) throw httpErro(400, 'Status inválido.');\n    const ped = db.prepare('SELECT * FROM pedidos WHERE id=?').get(Number(mm[1]));\n    if (!ped) throw httpErro(404, 'Pedido não encontrado.');\n    db.prepare('UPDATE pedidos SET status=?, obs_interna=?, atualizado_em=? WHERE id=?').run(b.status || ped.status, b.obs_interna ?? ped.obs_interna, agora(), ped.id);\n    evento('pedido_editado', { codigo: ped.codigo, ...b });\n    return send(res, 200, { ok: true });\n  }\n\n  if ((mm = /^\\/api\\/admin\\/pedidos\\/(\\d+)\\/bling$$/.exec(p)) && m === 'POST') {\n    const bid = await enviarPedidoBling(Number(mm[1]));\n    return send(res, 200, { ok: true, bling: bid });\n  }\n\n  if ((mm = /^\\/api\\/admin\\/pedidos\\/(\\d+)\\/conferir-pagamento$$/.exec(p)) && m === 'POST') {\n    const ped = db.prepare('SELECT * FROM pedidos WHERE id=?').get(Number(mm[1]));\n    if (!ped || !CFG.mpToken) throw httpErro(409, 'Sem Mercado Pago configurado.');\n    const busca = await mp('GET', `/v1/payments/search?external_reference=$${encodeURIComponent(ped.codigo)}&sort=date_created&criteria=desc`);\n    const pg = busca.results?.[0];\n    if (!pg) return send(res, 200, { ok: true, encontrado: false });\n    await atualizarPagamento(pg.id);\n    return send(res, 200, { ok: true, encontrado: true, status: pg.status });\n  }\n\n  if (p === '/api/admin/eventos' && m === 'GET') {\n    return send(res, 200, db.prepare('SELECT * FROM eventos ORDER BY id DESC LIMIT 100').all());\n  }\n\n  return send(res, 404, { erro: 'não encontrado' });\n}\n\nconst server = http.createServer(async (req, res) => {\n  const url = new URL(req.url, 'http://localhost');\n  try {\n    await rotear(req, res, url);\n  } catch (e) {\n    if (!e.status || e.status >= 500) console.error(e);\n    // No painel (já autenticado) a mensagem real ajuda a resolver; para o público, mensagem genérica.\n    const admin = url.pathname.startsWith('/api/admin/') && sessaoValida(req);\n    if (!res.headersSent) send(res, e.status || 500, { erro: e.status || admin ? e.message : 'Erro interno. Tente de novo.' });\n  }\n});\n\n// Sincronização periódica: rápida a cada N minutos, completa uma vez por dia (madrugada).\nsetInterval(() => { if (tokens?.refresh_token) sincronizar(); }, CFG.syncMinutos * 60e3).unref();\nsetInterval(() => {\n  const h = new Date().getUTCHours(); // 6h UTC = 3h em São Paulo\n  const ultimo = kvGet('ultimo_completo');\n  if (tokens?.refresh_token && h === 6 && ultimo !== new Date().toISOString().slice(0, 10)) {\n    kvSet('ultimo_completo', new Date().toISOString().slice(0, 10));\n    sincronizar({ completo: true });\n  }\n}, 10 * 60e3).unref();\n\nif (require.main === module) {\n  server.listen(CFG.port, () => console.log(`mio-loja API na porta $${CFG.port}`));\n  espelharAssets().catch((e) => console.warn('[asset]', e.message));\n  instalarSharp().then((ok) => ok && otimizarTudo()).catch((e) => console.warn('[fotos]', e.message));\n  // Reaplica a classificação automática (mantém o que foi escolhido à mão no painel).\n  for (const r of db.prepare('SELECT id, nome FROM produtos WHERE categoria_manual=0').all()) db.prepare('UPDATE produtos SET categoria_site=? WHERE id=?').run(sugerirCategoria(r.nome), r.id);\n  if (tokens?.refresh_token) setTimeout(() => sincronizar(), 5000);\n}\nmodule.exports = { server, db, CFG, sugerirCategoria, problemas, cpfValido, limparHtml };\n"
  nginx_conf:
    content: "server {\n  listen 80;\n  server_name _;\n  root /usr/share/nginx/html;\n  index index.html;\n  charset utf-8;\n  server_tokens off;\n\n  gzip on;\n  gzip_types text/css application/javascript image/svg+xml application/json;\n\n  location /api/ {\n    proxy_pass http://api:3000;\n    proxy_set_header Host $$host;\n    proxy_set_header X-Real-IP $$remote_addr;\n    client_max_body_size 64k;\n    add_header X-Content-Type-Options nosniff always;\n  }\n\n  location /oauth/ {\n    proxy_pass http://api:3000;\n    proxy_set_header Host $$host;\n    proxy_set_header X-Real-IP $$remote_addr;\n  }\n\n  # Identidade visual da Dande (logo, banners, ícones, fontes) espelhada pela API.\n  location /assets/ {\n    proxy_pass http://api:3000;\n    proxy_set_header Host $$host;\n    expires 7d;\n  }\n\n  # Fotos dos produtos, baixadas do Bling e servidas pela API.\n  location /img/ {\n    proxy_pass http://api:3000;\n    proxy_set_header Host $$host;\n    expires 1d;\n  }\n\n  # Páginas, JS e CSS revalidam sempre (304 se nada mudou), para um deploy novo não aparecer quebrado.\n  location / {\n    add_header Cache-Control \"no-cache\" always;\n    add_header X-Content-Type-Options nosniff always;\n    add_header Referrer-Policy strict-origin-when-cross-origin always;\n    add_header X-Frame-Options DENY always;\n    try_files $$uri $$uri.html $$uri/ =404;\n  }\n}\n"
  web_app_js:
    content: "// Mio Peça — código compartilhado entre as páginas da loja.\n(function () {\n  const M = window.MIO || {};\n\n  // ---------- utilitários ----------\n  const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n  const qs = (k) => new URLSearchParams(location.search).get(k);\n\n  async function api(caminho, opts = {}) {\n    const res = await fetch(caminho, {\n      method: opts.method || 'GET',\n      headers: opts.body ? { 'Content-Type': 'application/json' } : {},\n      body: opts.body ? JSON.stringify(opts.body) : undefined,\n      credentials: 'same-origin',\n    });\n    let dados = null;\n    try { dados = await res.json(); } catch { /* sem corpo */ }\n    if (!res.ok) { const e = new Error(dados?.erro || `Erro $${res.status}`); e.status = res.status; throw e; }\n    return dados;\n  }\n\n  function toast(msg) {\n    let t = document.querySelector('.toast');\n    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }\n    t.textContent = msg; t.classList.add('on');\n    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600);\n  }\n\n  // ---------- ícones ----------\n  const ic = {\n    busca: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/></svg>',\n    carrinho: '<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6.2\"/><circle cx=\"10\" cy=\"20.5\" r=\"1.3\"/><circle cx=\"18\" cy=\"20.5\" r=\"1.3\"/></svg>',\n    whats: '<svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z\"/></svg>',\n    tel: '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z\"/></svg>',\n    pin: '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>',\n    relogio: '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg>',\n    mail: '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m3 7 9 6 9-6\"/></svg>',\n    check: '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 4.5 4.5L19 7\"/></svg>',\n    escudo: '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6l-8-3Z\"/><path d=\"m9 12 2 2 4-4\"/></svg>',\n    caixa: '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8Z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>',\n    loja: '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 9 5 4h14l2 5M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0V9ZM5 13v7h14v-7\"/></svg>',\n    foto: '<svg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"2\"/><path d=\"m21 17-5-5-9 8\"/></svg>',\n  };\n  const pitIcone = {\n    anos: '<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"9\" r=\"6\"/><path d=\"m8.5 14-1.5 7 5-2.5 5 2.5-1.5-7\"/></svg>',\n    rapido: '<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><path d=\"M13 2 4 14h7l-1 8 9-12h-7l1-8Z\"/></svg>',\n    marcas: '<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><path d=\"m12 2 2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7L12 2Z\"/></svg>',\n    entrega: '<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8Z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>',\n    seguro: '<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><path d=\"M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6l-8-3Z\"/><path d=\"m9 12 2 2 4-4\"/></svg>',\n  };\n  const catIcone = {\n    geladeiras: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"12\" y=\"4\" width=\"24\" height=\"40\" rx=\"3\"/><path d=\"M12 18h24M17 10v4M17 23v8\"/></svg>',\n    lavadoras: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"8\" y=\"4\" width=\"32\" height=\"40\" rx=\"3\"/><circle cx=\"24\" cy=\"27\" r=\"10\"/><path d=\"M8 12h32M14 8h2M20 8h2\"/><path d=\"M18 28c2-2 4 2 6 0s4 2 6 0\"/></svg>',\n    secadoras: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"8\" y=\"4\" width=\"32\" height=\"40\" rx=\"3\"/><circle cx=\"24\" cy=\"27\" r=\"10\"/><path d=\"M8 12h32M20 24c0 2 2 2 2 4M26 24c0 2 2 2 2 4\"/></svg>',\n    tanquinhos: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M10 12h28l-3 30H13L10 12Z\"/><path d=\"M8 12h32M18 6h12v6M24 20v14M19 24l5 4 5-4\"/></svg>',\n    microondas: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"4\" y=\"10\" width=\"40\" height=\"28\" rx=\"3\"/><rect x=\"9\" y=\"15\" width=\"24\" height=\"18\" rx=\"2\"/><path d=\"M38 16v2M38 22v2M38 28v2\"/></svg>',\n    'ar-condicionado': '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"4\" y=\"10\" width=\"40\" height=\"16\" rx=\"3\"/><path d=\"M10 20h28M14 32c0 3-2 3-2 6M24 32c0 3-2 3-2 6M34 32c0 3-2 3-2 6\"/></svg>',\n    filtros: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M24 4s-12 14-12 24a12 12 0 0 0 24 0C36 18 24 4 24 4Z\"/><path d=\"M18 30a6 6 0 0 0 6 6\"/></svg>',\n    'lava-loucas': '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"8\" y=\"4\" width=\"32\" height=\"40\" rx=\"3\"/><path d=\"M8 12h32M15 22h18M15 30h18M17 22v12M24 22v12M31 22v12\"/></svg>',\n    ferramentas: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 6a9 9 0 0 0-8.5 12L8 31.5a3.5 3.5 0 0 0 5 5L26.5 23A9 9 0 0 0 38 14l-5 5-5-1-1-5 5-5a9 9 0 0 0-2-2Z\"/></svg>',\n    outros: '<svg width=\"54\" height=\"54\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"24\" cy=\"24\" r=\"7\"/><path d=\"M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4\"/></svg>',\n  };\n\n  // ---------- carrinho (localStorage, com fallback em memória) ----------\n  let memoria = [];\n  const Carrinho = {\n    ler() { try { return JSON.parse(localStorage.getItem('mio_carrinho') || '[]'); } catch { return memoria; } },\n    salvar(itens) { memoria = itens; try { localStorage.setItem('mio_carrinho', JSON.stringify(itens)); } catch { /* modo privado */ } atualizarContador(); },\n    adicionar(p, qtd = 1) {\n      const itens = Carrinho.ler();\n      const ex = itens.find((i) => i.id === p.id);\n      const max = p.estoque || 99;\n      if (ex) ex.qtd = Math.min(ex.qtd + qtd, max);\n      else itens.push({ id: p.id, slug: p.slug, nome: p.nome, preco: p.preco, imagem: p.imagem, qtd: Math.min(qtd, max), max });\n      Carrinho.salvar(itens);\n    },\n    alterar(id, qtd) { const itens = Carrinho.ler().map((i) => (i.id === id ? { ...i, qtd: Math.max(1, Math.min(qtd, i.max || 99)) } : i)); Carrinho.salvar(itens); },\n    remover(id) { Carrinho.salvar(Carrinho.ler().filter((i) => i.id !== id)); },\n    limpar() { Carrinho.salvar([]); },\n    total() { return Carrinho.ler().reduce((s, i) => s + i.preco * i.qtd, 0); },\n    qtd() { return Carrinho.ler().reduce((s, i) => s + i.qtd, 0); },\n  };\n  function atualizarContador() { document.querySelectorAll('.btn-carrinho .qtd').forEach((el) => { const n = Carrinho.qtd(); el.textContent = n ? String(n) : ''; }); }\n\n  const linkWhats = (texto) => `https://wa.me/$${M.whatsapp}$${texto ? `?text=$${encodeURIComponent(texto)}` : ''}`;\n\n  // ---------- cabeçalho e rodapé ----------\n  function montarCabecalho(categorias) {\n    const el = document.getElementById('cabecalho-slot');\n    if (!el) return;\n    const catAtual = qs('cat');\n    el.outerHTML = `\n      <div class=\"topo-contato\"><div class=\"container\">\n        <span><span class=\"so-desk\">Loja física em São José dos Campos · </span>$${esc(M.telefone)}</span>\n        <span><a href=\"$${linkWhats()}\" target=\"_blank\" rel=\"noopener\">Atendimento via WhatsApp</a></span>\n      </div></div>\n      <header id=\"cabecalho\">\n        <div class=\"container\">\n          <a href=\"/\" class=\"logo\" aria-label=\"Dande — loja online\"><img src=\"/assets/logo-dande.png\" alt=\"Dande Peças para Refrigeração\" width=\"190\" height=\"62\" onerror=\"this.onerror=null;this.src='/logo.svg'\"><span class=\"tag\">Loja<br>online</span></a>\n          <form class=\"busca\" action=\"/loja.html\" role=\"search\">\n            <label for=\"q\" class=\"sr\">Buscar peça</label>\n            <input id=\"q\" name=\"q\" type=\"search\" autocomplete=\"off\" placeholder=\"Busque por peça, modelo ou código\" value=\"$${esc(qs('q') || '')}\">\n            <button type=\"submit\" aria-label=\"Buscar\">$${ic.busca}</button>\n          </form>\n          <nav class=\"menu-acoes\">\n            <a class=\"menu-link\" href=\"https://dandecomercial.com.br/a-dande/\" target=\"_blank\" rel=\"noopener\">A Dande</a>\n            <a class=\"menu-link\" href=\"/loja.html\">Produtos</a>\n            <a class=\"telefone\" href=\"tel:+551239362082\">$${ic.tel.replace(/16/g, '18')}$${esc(M.telefone)}</a>\n            <a class=\"social\" href=\"$${esc(M.facebook)}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\"><img src=\"/assets/ic-facebook.png\" alt=\"\" width=\"34\" height=\"34\"></a>\n            <a class=\"social\" href=\"$${linkWhats()}\" target=\"_blank\" rel=\"noopener\" aria-label=\"WhatsApp\"><img src=\"/assets/ic-whatsapp.png\" alt=\"\" width=\"34\" height=\"34\"></a>\n            <a href=\"/carrinho.html\" class=\"btn-carrinho\" aria-label=\"Carrinho\">$${ic.carrinho}<span class=\"qtd\"></span><span class=\"txt\">Carrinho</span></a>\n          </nav>\n        </div>\n        <nav class=\"nav-cat\" aria-label=\"Categorias\"><div class=\"container\">\n          <a href=\"/loja.html\" class=\"$${location.pathname.startsWith('/loja') && !catAtual && !qs('q') ? 'ativo' : ''}\">Todas as peças</a>\n          $${(categorias || []).filter((c) => c.total > 0).map((c) => `<a href=\"/loja.html?cat=$${c.slug}\" class=\"$${catAtual === c.slug ? 'ativo' : ''}\">$${esc(c.nome)}</a>`).join('')}\n        </div></nav>\n      </header>`;\n    atualizarContador();\n  }\n\n  function montarRodape() {\n    const el = document.getElementById('rodape-slot');\n    if (!el) return;\n    el.outerHTML = `\n      <footer id=\"rodape\">\n        <div class=\"container\">\n          <div>\n            <img class=\"logo-rodape\" src=\"/assets/logo-dande-negativo.png\" alt=\"Dande\" width=\"160\" height=\"64\" onerror=\"this.onerror=null;this.src='/logo.svg';this.style.background='#fff';this.style.borderRadius='8px';this.style.padding='6px 10px'\">\n            <p style=\"color:#dbe9f7;margin:0\">Peças para refrigeração, lavadoras, tanquinhos, micro-ondas, lava-louças e filtros de água. Há mais de 20 anos em São José dos Campos, agora também online.</p>\n          </div>\n          <div>\n            <h4>Atendimento</h4>\n            <div class=\"item\">$${ic.tel}<span>$${esc(M.telefone)}</span></div>\n            <div class=\"item\"><img src=\"/assets/ic-whatsapp-rodape.png\" alt=\"\"><a href=\"$${linkWhats()}\" target=\"_blank\" rel=\"noopener\">$${esc(M.whatsappTexto)}</a></div>\n            <div class=\"item\"><img src=\"/assets/ic-mail.png\" alt=\"\"><a href=\"mailto:$${esc(M.email)}\">$${esc(M.email)}</a></div>\n            <div class=\"item\"><img src=\"/assets/ic-horario.png\" alt=\"\"><span>$${esc(M.horario)}</span></div>\n          </div>\n          <div>\n            <h4>Loja física</h4>\n            <div class=\"item\">$${ic.pin}<span>$${esc(M.endereco)}<br>$${esc(M.cidade)}</span></div>\n            <div class=\"item\"><img src=\"/assets/ic-facebook-rodape.png\" alt=\"\"><a href=\"$${esc(M.facebook)}\" target=\"_blank\" rel=\"noopener\">@danderefrigeracao</a></div>\n          </div>\n          <div>\n            <h4>Institucional</h4>\n            <ul>\n              <li><a href=\"/politicas.html#trocas\">Trocas e devoluções</a></li>\n              <li><a href=\"/politicas.html#entrega\">Entrega e retirada</a></li>\n              <li><a href=\"/politicas.html#privacidade\">Privacidade</a></li>\n              <li><a href=\"/politicas.html#garantia\">Garantia</a></li>\n            </ul>\n          </div>\n        </div>\n      </footer>\n      <div class=\"assinatura\"><div class=\"container\">\n        <span>Loja online operada por $${esc(M.razao)} · CNPJ $${esc(M.cnpj)}</span>\n        <span>Pagamentos processados pelo Mercado Pago</span>\n      </div></div>\n      <a id=\"btn-whats\" href=\"$${linkWhats('Olá! Vim pela loja online da Dande.')}\" target=\"_blank\" rel=\"noopener\">$${ic.whats}<span>Fale no WhatsApp</span></a>`;\n  }\n\n  // ---------- card de produto ----------\n  function cardProduto(p) {\n    const foto = p.imagem ? `<img src=\"$${esc(p.imagem)}\" alt=\"$${esc(p.nome)}\" loading=\"lazy\" width=\"200\" height=\"200\">` : `<span class=\"sem-foto\">$${ic.foto}</span>`;\n    return `<a class=\"card\" href=\"/produto.html?p=$${esc(p.slug)}\">\n      <div class=\"foto\">$${foto}</div>\n      <div class=\"info\">\n        <span class=\"nome\">$${esc(p.nome)}</span>\n        <span>$${p.disponivel ? '<span class=\"selo selo-retira\">Retire hoje na loja</span>' : '<span class=\"selo selo-esgotado\">Esgotado</span>'}</span>\n        <span class=\"preco\">$${brl(p.preco)}</span>\n        <span class=\"pix\">no Pix, cartão ou boleto</span>\n      </div>\n    </a>`;\n  }\n\n  let categoriasCache = null;\n  async function categorias() {\n    if (!categoriasCache) { try { categoriasCache = await api('/api/categorias'); } catch { categoriasCache = []; } }\n    return categoriasCache;\n  }\n\n  async function iniciar() {\n    montarCabecalho([]);\n    montarRodape();\n    ligarSugestoes(document.getElementById('q'));\n    document.querySelectorAll('input[data-sugestoes]').forEach(ligarSugestoes);\n    const cats = await categorias();\n    // remonta o menu de categorias com as que têm produtos\n    const nav = document.querySelector('.nav-cat .container');\n    if (nav) {\n      const catAtual = qs('cat');\n      nav.innerHTML = `<a href=\"/loja.html\" class=\"$${location.pathname.startsWith('/loja') && !catAtual && !qs('q') ? 'ativo' : ''}\">Todas as peças</a>` +\n        cats.filter((c) => c.total > 0).map((c) => `<a href=\"/loja.html?cat=$${c.slug}\" class=\"$${catAtual === c.slug ? 'ativo' : ''}\">$${esc(c.nome)}</a>`).join('');\n    }\n  }\n\n  // ---------- busca com sugestões enquanto digita ----------\n  function ligarSugestoes(input) {\n    if (!input || input.dataset.sugLigado) return;\n    input.dataset.sugLigado = '1';\n    const form = input.closest('form');\n    const caixa = document.createElement('div');\n    caixa.className = 'sugestoes'; caixa.hidden = true; caixa.setAttribute('role', 'listbox');\n    form.appendChild(caixa);\n    let timer, ultima = '', idx = -1;\n    const fechar = () => { caixa.hidden = true; idx = -1; };\n    input.addEventListener('input', () => {\n      clearTimeout(timer);\n      const q = input.value.trim();\n      if (q.length < 2) return fechar();\n      timer = setTimeout(async () => {\n        ultima = q;\n        let r; try { r = await api('/api/produtos?limite=6&q=' + encodeURIComponent(q)); } catch { return fechar(); }\n        if (q !== ultima || input.value.trim() !== q) return;\n        if (!r.itens.length) {\n          caixa.innerHTML = `<a class=\"todas\" href=\"$${linkWhats(`Olá! Procuro: $${q}`)}\" target=\"_blank\" rel=\"noopener\">Não achamos “$${esc(q)}”. Pergunte no WhatsApp</a>`;\n        } else {\n          caixa.innerHTML = r.itens.map((p) => `<a href=\"/produto.html?p=$${esc(p.slug)}\" role=\"option\">$${p.imagem ? `<img src=\"$${esc(p.imagem)}\" alt=\"\">` : '<span class=\"ph\"></span>'}<span>$${esc(p.nome)}</span><span class=\"preco\">$${brl(p.preco)}</span></a>`).join('') +\n            `<a class=\"todas\" href=\"/loja.html?q=$${encodeURIComponent(q)}\">Ver $${r.total} $${r.total === 1 ? 'resultado' : 'resultados'}</a>`;\n        }\n        caixa.hidden = false; idx = -1;\n      }, 220);\n    });\n    input.addEventListener('keydown', (e) => {\n      const itens = [...caixa.querySelectorAll('a')];\n      if (caixa.hidden || !itens.length) return;\n      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {\n        e.preventDefault();\n        idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length;\n        itens.forEach((a, k) => a.classList.toggle('ativo', k === idx));\n      } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); location = itens[idx].href; }\n      else if (e.key === 'Escape') fechar();\n    });\n    document.addEventListener('click', (e) => { if (!form.contains(e.target)) fechar(); });\n  }\n\n  window.Mio = { esc, brl, qs, api, toast, ic, pitIcone, catIcone, Carrinho, cardProduto, categorias, linkWhats, cfg: M };\n  document.addEventListener('DOMContentLoaded', iniciar);\n})();\n"
  web_carrinho_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Carrinho | Dande Loja Online</title>\n  <meta name=\"robots\" content=\"noindex\">\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body>\n  <div id=\"cabecalho-slot\"></div>\n  <main class=\"container secao\" style=\"padding-top:28px\">\n    <h1 style=\"text-transform:uppercase;font-size:30px\">Carrinho</h1>\n    <div id=\"vazio\" class=\"vazio\" hidden>\n      <p style=\"margin-top:0\">Seu carrinho está vazio.</p>\n      <a class=\"btn btn-primario\" href=\"/loja.html\">Ver peças</a>\n    </div>\n    <form id=\"checkout\" class=\"checkout\" novalidate hidden>\n      <div>\n        <section class=\"painel-box\">\n          <h2><span class=\"n\">1</span>Itens</h2>\n          <div id=\"itens\"></div>\n        </section>\n\n        <section class=\"painel-box\">\n          <h2><span class=\"n\">2</span>Entrega</h2>\n          <div class=\"campos\">\n            <div class=\"campo m2\"><label for=\"cep\">CEP</label><input id=\"cep\" inputmode=\"numeric\" autocomplete=\"postal-code\" placeholder=\"00000-000\" maxlength=\"9\" required></div>\n            <div class=\"campo m4\" style=\"justify-content:end\"><a href=\"https://buscacepinter.correios.com.br/app/endereco/index.php\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;padding-bottom:12px\">Não sei meu CEP</a></div>\n          </div>\n          <div id=\"fretes\"></div>\n          <div id=\"endereco\" hidden>\n            <div class=\"campos\" style=\"margin-top:14px\">\n              <div class=\"campo m4\"><label for=\"rua\">Rua / avenida</label><input id=\"rua\" autocomplete=\"address-line1\" required></div>\n              <div class=\"campo m2\"><label for=\"numero\">Número</label><input id=\"numero\" required></div>\n              <div class=\"campo m3\"><label for=\"complemento\">Complemento (opcional)</label><input id=\"complemento\" autocomplete=\"address-line2\"></div>\n              <div class=\"campo m3\"><label for=\"bairro\">Bairro</label><input id=\"bairro\" required></div>\n              <div class=\"campo m4\"><label for=\"cidade\">Cidade</label><input id=\"cidade\" autocomplete=\"address-level2\" required></div>\n              <div class=\"campo m2\"><label for=\"uf\">UF</label><input id=\"uf\" maxlength=\"2\" autocomplete=\"address-level1\" required></div>\n            </div>\n          </div>\n        </section>\n\n        <section class=\"painel-box\">\n          <h2><span class=\"n\">3</span>Seus dados</h2>\n          <div class=\"campos\">\n            <div class=\"campo\"><label for=\"nome\">Nome completo</label><input id=\"nome\" autocomplete=\"name\" required></div>\n            <div class=\"campo m3\"><label for=\"cpf\">CPF (para a nota fiscal)</label><input id=\"cpf\" inputmode=\"numeric\" maxlength=\"14\" required></div>\n            <div class=\"campo m3\"><label for=\"telefone\">Celular / WhatsApp</label><input id=\"telefone\" type=\"tel\" autocomplete=\"tel\" inputmode=\"tel\" required></div>\n            <div class=\"campo\"><label for=\"email\">E-mail</label><input id=\"email\" type=\"email\" autocomplete=\"email\" required></div>\n          </div>\n        </section>\n      </div>\n\n      <aside class=\"painel-box resumo\">\n        <h2>Resumo</h2>\n        <div class=\"linha\"><span>Subtotal</span><span id=\"r-sub\">—</span></div>\n        <div class=\"linha\"><span>Entrega</span><span id=\"r-frete\">—</span></div>\n        <div class=\"linha total\"><span>Total</span><span id=\"r-total\">—</span></div>\n        <div id=\"erro\" class=\"aviso aviso-erro\" hidden role=\"alert\"></div>\n        <button class=\"btn btn-comprar btn-bloco\" type=\"submit\" id=\"pagar\" style=\"margin-top:14px\">Ir para o pagamento</button>\n        <div class=\"seguro\" id=\"seguro\"></div>\n        <p style=\"font-size:12.5px;color:var(--texto-2);margin:12px 0 0\">Ao finalizar você concorda com as <a href=\"/politicas.html\" target=\"_blank\">políticas de troca, entrega e privacidade</a>.</p>\n      </aside>\n    </form>\n  </main>\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n  <script>\n    document.addEventListener('DOMContentLoaded', () => {\n      const { api, esc, brl, ic, Carrinho, linkWhats } = window.Mio;\n      const $$ = (id) => document.getElementById(id);\n      let opcoes = [], escolhido = null;\n      $$('seguro').innerHTML = `$${ic.escudo}<span>Você paga no ambiente seguro do Mercado Pago: Pix, cartão ou boleto.</span>`;\n\n      function render() {\n        const itens = Carrinho.ler();\n        $$('vazio').hidden = !!itens.length;\n        $$('checkout').hidden = !itens.length;\n        if (!itens.length) return;\n        $$('itens').innerHTML = itens.map((i) => `\n          <div class=\"item-car\" data-id=\"$${i.id}\">\n            $${i.imagem ? `<img src=\"$${esc(i.imagem)}\" alt=\"\">` : '<span></span>'}\n            <div><a class=\"nome\" href=\"/produto.html?p=$${esc(i.slug)}\">$${esc(i.nome)}</a><br><button type=\"button\" class=\"rm\">Remover</button></div>\n            <div class=\"direita\">\n              <div class=\"qtd-ctrl\"><button type=\"button\" class=\"menos\" aria-label=\"Diminuir\">−</button><input type=\"number\" class=\"q\" value=\"$${i.qtd}\" min=\"1\" max=\"$${i.max || 99}\" aria-label=\"Quantidade\"><button type=\"button\" class=\"mais\" aria-label=\"Aumentar\">+</button></div>\n              <b>$${brl(i.preco * i.qtd)}</b>\n            </div>\n          </div>`).join('');\n        resumo();\n      }\n      function resumo() {\n        const sub = Carrinho.total();\n        $$('r-sub').textContent = brl(sub);\n        $$('r-frete').textContent = escolhido ? (escolhido.valor ? brl(escolhido.valor) : 'Grátis') : '—';\n        $$('r-total').textContent = brl(sub + (escolhido?.valor || 0));\n      }\n      $$('itens').addEventListener('click', (e) => {\n        const linha = e.target.closest('.item-car'); if (!linha) return;\n        const id = Number(linha.dataset.id), q = linha.querySelector('.q');\n        if (e.target.closest('.rm')) Carrinho.remover(id);\n        else if (e.target.closest('.menos')) Carrinho.alterar(id, Number(q.value) - 1);\n        else if (e.target.closest('.mais')) Carrinho.alterar(id, Number(q.value) + 1);\n        else return;\n        render(); recalcular();\n      });\n      $$('itens').addEventListener('change', (e) => { if (!e.target.matches('.q')) return; Carrinho.alterar(Number(e.target.closest('.item-car').dataset.id), Number(e.target.value)); render(); recalcular(); });\n\n      // máscaras\n      const mascara = (el, f) => el.addEventListener('input', () => { el.value = f(el.value.replace(/\\D/g, '')); });\n      mascara($$('cep'), (d) => (d = d.slice(0, 8), d.length > 5 ? `$${d.slice(0, 5)}-$${d.slice(5)}` : d));\n      mascara($$('cpf'), (d) => (d = d.slice(0, 11), d.replace(/(\\d{3})(\\d)/, '$$1.$$2').replace(/(\\d{3})(\\d)/, '$$1.$$2').replace(/(\\d{3})(\\d{1,2})$$/, '$$1-$$2')));\n      mascara($$('telefone'), (d) => (d = d.slice(0, 11), d.length > 6 ? `($${d.slice(0, 2)}) $${d.slice(2, d.length - 4)}-$${d.slice(-4)}` : d.length > 2 ? `($${d.slice(0, 2)}) $${d.slice(2)}` : d));\n\n      let cepAtual = '';\n      async function recalcular() {\n        const cep = $$('cep').value.replace(/\\D/g, '');\n        if (cep.length !== 8) { $$('fretes').innerHTML = ''; escolhido = null; resumo(); return; }\n        $$('fretes').innerHTML = '<p style=\"color:var(--texto-2)\">Calculando entrega…</p>';\n        const tipoAntes = escolhido?.tipo;\n        try {\n          opcoes = await api('/api/frete', { method: 'POST', body: { cep, itens: Carrinho.ler().map((i) => ({ id: i.id, qtd: i.qtd })) } });\n          $$('fretes').innerHTML = opcoes.map((o, n) => `\n            <label class=\"opcao-frete\"><input type=\"radio\" name=\"frete\" value=\"$${esc(o.tipo)}\" $${o.tipo === tipoAntes || (!tipoAntes && n === 0) ? 'checked' : ''}>\n              <span>$${esc(o.nome)}<small>$${esc(o.prazo)}</small></span><span class=\"v\">$${o.valor ? brl(o.valor) : 'Grátis'}</span></label>`).join('') +\n            (opcoes.some((o) => o.tipo !== 'retirada') ? '' : `<p class=\"aviso aviso-info\">Para este CEP, por enquanto, a compra online é com retirada na loja. Para envio, <a target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Quero comprar pelo site com envio para o CEP $${$$('cep').value}.`)}\">fale com a gente no WhatsApp</a>.</p>`);\n          escolher();\n        } catch (e) { $$('fretes').innerHTML = `<p class=\"aviso aviso-erro\">$${esc(e.message)}</p>`; escolhido = null; resumo(); }\n        if (cep !== cepAtual) { cepAtual = cep; buscarEndereco(cep); }\n      }\n      function escolher() {\n        const v = document.querySelector('input[name=frete]:checked')?.value;\n        escolhido = opcoes.find((o) => o.tipo === v) || null;\n        $$('endereco').hidden = !escolhido || escolhido.tipo === 'retirada';\n        resumo();\n      }\n      $$('fretes').addEventListener('change', escolher);\n      $$('cep').addEventListener('input', () => { if ($$('cep').value.replace(/\\D/g, '').length === 8) recalcular(); });\n      async function buscarEndereco(cep) {\n        try {\n          const r = await fetch(`https://viacep.com.br/ws/$${cep}/json/`).then((x) => x.json());\n          if (r.erro) return;\n          if (!$$('rua').value) $$('rua').value = r.logradouro || '';\n          if (!$$('bairro').value) $$('bairro').value = r.bairro || '';\n          $$('cidade').value = r.localidade || ''; $$('uf').value = r.uf || '';\n          if ($$('rua').value) $$('numero').focus({ preventScroll: true });\n        } catch { /* preenchimento manual */ }\n      }\n\n      $$('checkout').addEventListener('submit', async (e) => {\n        e.preventDefault();\n        const erro = $$('erro'); erro.hidden = true;\n        const falha = (m, campo) => { erro.textContent = m; erro.hidden = false; if (campo) $$(campo).focus(); };\n        if (!escolhido) return falha('Informe o CEP e escolha a forma de entrega.', 'cep');\n        const precisaEnd = escolhido.tipo !== 'retirada';\n        if (precisaEnd) for (const c of ['rua', 'numero', 'bairro', 'cidade', 'uf']) if (!$$(c).value.trim()) return falha('Preencha o endereço de entrega.', c);\n        for (const c of ['nome', 'cpf', 'telefone', 'email']) if (!$$(c).value.trim()) return falha('Preencha seus dados.', c);\n        const btn = $$('pagar'); btn.disabled = true; btn.textContent = 'Gerando pedido…';\n        try {\n          const r = await api('/api/pedidos', { method: 'POST', body: {\n            itens: Carrinho.ler().map((i) => ({ id: i.id, qtd: i.qtd })),\n            frete_tipo: escolhido.tipo,\n            cliente: { nome: $$('nome').value, cpf: $$('cpf').value, telefone: $$('telefone').value, email: $$('email').value },\n            endereco: { cep: $$('cep').value, rua: $$('rua').value, numero: $$('numero').value, complemento: $$('complemento').value, bairro: $$('bairro').value, cidade: $$('cidade').value, uf: $$('uf').value },\n          } });\n          Carrinho.limpar();\n          location = r.pagamento || `/pedido.html?c=$${encodeURIComponent(r.codigo)}&t=$${encodeURIComponent(r.token)}`;\n        } catch (err) {\n          falha(err.message);\n          btn.disabled = false; btn.textContent = 'Ir para o pagamento';\n        }\n      });\n\n      render();\n    });\n  </script>\n</body>\n</html>\n"
  web_config_js:
    content: "// Dados de contato e da empresa exibidos no site.\nwindow.MIO = {\n  loja: 'Dande Loja Online',\n  razao: 'Mio Peças para Refrigeração Ltda',\n  cnpj: '61.102.078/0001-01',\n  whatsapp: '5512982664536',\n  whatsappTexto: '(12) 98266-4536',\n  telefone: '(12) 3936-2082',\n  email: 'gerencia@dandecomercial.com.br',\n  endereco: 'Av. Andrômeda, 3358 – Bosque dos Eucaliptos',\n  cidade: 'São José dos Campos – SP',\n  horario: 'Seg a Sex: 8h às 18h · Sáb: 8h às 12h',\n  facebook: 'https://www.facebook.com/danderefrigeracao',\n};\n"
  web_favicon_svg:
    content: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#337db9\"/><stop offset=\"1\" stop-color=\"#0a4e9b\"/></linearGradient></defs><circle cx=\"32\" cy=\"32\" r=\"30\" fill=\"url(#g)\"/><g transform=\"translate(32 32)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"><path d=\"M0-17V17M-15-8.5 15 8.5M-15 8.5 15-8.5\"/></g><circle cx=\"32\" cy=\"32\" r=\"6.5\" fill=\"#25aae1\" stroke=\"#fff\" stroke-width=\"3\"/></svg>\n"
  web_index_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Dande Loja Online — Peças para geladeira, lavadora, tanquinho e micro-ondas</title>\n  <meta name=\"description\" content=\"Encontre a peça do seu eletrodoméstico pelo nome, modelo ou código. Peças para geladeira, lavadora, tanquinho, micro-ondas e purificadores. Retire na loja em São José dos Campos ou receba em casa.\">\n  <meta property=\"og:title\" content=\"Dande Loja Online — Peças para Refrigeração\">\n  <meta property=\"og:description\" content=\"Peças para geladeira, lavadora, micro-ondas e purificadores com pronta entrega.\">\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body class=\"home\">\n  <div id=\"cabecalho-slot\"></div>\n\n  <main>\n    <!-- 1. Boas-vindas: a pergunta do balcão -->\n    <section class=\"boas-vindas\">\n      <div class=\"container\">\n        <div class=\"bv-texto\">\n          <h1>Qual aparelho parou de funcionar?</h1>\n          <p>Procure a peça pelo nome, pelo modelo do aparelho ou pelo código. Se ficar na dúvida, a gente confere com você antes da compra.</p>\n          <form class=\"busca-grande\" action=\"/loja.html\" role=\"search\" autocomplete=\"off\">\n            <label for=\"q-home\" class=\"sr\">O que você procura?</label>\n            <input id=\"q-home\" name=\"q\" type=\"search\" placeholder=\"Ex.: damper Brastemp, BWL11, W10882241\" data-sugestoes>\n            <button type=\"submit\">Buscar peça</button>\n          </form>\n          <p class=\"bv-ajuda\">Não sabe o nome da peça? <a id=\"whats-foto\" href=\"#\" target=\"_blank\" rel=\"noopener\">Mande uma foto no WhatsApp</a> e a gente encontra para você.</p>\n        </div>\n        <aside class=\"hoje-loja\" aria-label=\"Situação da loja hoje\">\n          <span class=\"hl-status\" id=\"hl-status\">Loja física</span>\n          <p class=\"hl-titulo\" id=\"hl-titulo\">Retire na Av. Andrômeda, 3358</p>\n          <p class=\"hl-texto\" id=\"hl-texto\">Seg a sex, 8h às 18h. Sáb, 8h às 12h.</p>\n          <a class=\"btn btn-whats btn-bloco\" id=\"hl-whats\" href=\"#\" target=\"_blank\" rel=\"noopener\">Falar com o balcão</a>\n        </aside>\n        <nav class=\"aparelhos\" id=\"aparelhos\" aria-label=\"Escolha o aparelho\"></nav>\n      </div>\n    </section>\n\n    <section id=\"pit\" aria-label=\"Por que comprar com a gente\"><div class=\"container\" id=\"pit-itens\"></div></section>\n\n    <!-- 2. Ajuda: onde fica o modelo -->\n    <section class=\"secao modelo-ajuda\"><div class=\"container\">\n      <div class=\"secao-titulo\"><h2>Primeiro, ache o modelo do seu aparelho</h2></div>\n      <p class=\"intro\">Com o modelo em mãos fica fácil achar a peça certa. Ele está numa etiqueta como esta:</p>\n      <div class=\"dicas\">\n        <article class=\"dica\">\n          <img src=\"/assets/cat-geladeiras.png\" alt=\"\" loading=\"lazy\">\n          <div><h3>Geladeira e freezer</h3><p>Na parede interna, do lado esquerdo, perto da gaveta de legumes. Em alguns modelos fica atrás, embaixo.</p></div>\n        </article>\n        <article class=\"dica\">\n          <img src=\"/assets/cat-lavadoras.png\" alt=\"\" loading=\"lazy\">\n          <div><h3>Lavadora e tanquinho</h3><p>Na parte de trás do gabinete ou embaixo da tampa. Na lava e seca, na moldura da porta.</p></div>\n        </article>\n        <article class=\"dica\">\n          <img src=\"/assets/cat-microondas.png\" alt=\"\" loading=\"lazy\">\n          <div><h3>Micro-ondas</h3><p>Abrindo a porta, na lateral da moldura, ou na tampa de trás.</p></div>\n        </article>\n      </div>\n      <div class=\"etiqueta\" aria-hidden=\"true\">\n        <span class=\"et-marca\">BRASTEMP</span>\n        <span class=\"et-linha\">Modelo <b>BWK11AB</b></span>\n        <span class=\"et-linha\">Nº série JB5412345</span>\n        <span class=\"et-linha\">127 V ~ 60 Hz</span>\n      </div>\n    </div></section>\n\n    <!-- 3. Peças mais procuradas -->\n    <section class=\"secao\" style=\"padding-top:0\"><div class=\"container\">\n      <div class=\"secao-titulo\"><h2>Peças mais procuradas</h2><a href=\"/loja.html\">Ver todas</a></div>\n      <div class=\"grade-prod\" id=\"destaques\"><div class=\"esqueleto\" style=\"grid-column:1/-1\"></div></div>\n    </div></section>\n\n    <!-- 4. Banner da Dande -->\n    <section class=\"container banner-faixa\">\n      <div class=\"slider\" id=\"slider\" aria-label=\"Novidades da Dande\">\n        <div class=\"slides\" id=\"slides\"></div>\n        <button class=\"seta ant\" id=\"ant\" aria-label=\"Banner anterior\">‹</button>\n        <button class=\"seta prox\" id=\"prox\" aria-label=\"Próximo banner\">›</button>\n        <div class=\"pontos\" id=\"pontos\"></div>\n      </div>\n    </section>\n\n    <!-- 5. Como comprar (sequência real) -->\n    <section class=\"secao\"><div class=\"container\">\n      <div class=\"secao-titulo\"><h2>Como comprar</h2></div>\n      <ol class=\"passos\">\n        <li><h3>Escolha a peça</h3><p>Busque pelo modelo do aparelho. Na dúvida, pergunte no WhatsApp antes de pagar.</p></li>\n        <li><h3>Pague do seu jeito</h3><p>Pix, cartão de crédito ou boleto, no ambiente seguro do Mercado Pago.</p></li>\n        <li><h3>Retire ou receba</h3><p>Retire grátis na loja da Av. Andrômeda ou receba em casa em São José dos Campos.</p></li>\n      </ol>\n    </div></section>\n\n    <section class=\"secao\" style=\"padding-top:0\"><div class=\"container marcas-dande\">\n      <h2>As melhores peças e marcas você encontra aqui</h2>\n      <div class=\"marcas\" aria-label=\"Marcas atendidas\">\n        <img src=\"/assets/marca-brastemp.png\" alt=\"Brastemp\" loading=\"lazy\">\n        <img src=\"/assets/marca-consul.png\" alt=\"Consul\" loading=\"lazy\">\n        <img src=\"/assets/marca-electrolux.png\" alt=\"Electrolux\" loading=\"lazy\">\n        <img src=\"/assets/marca-planeta-agua.png\" alt=\"Planeta Água\" loading=\"lazy\">\n      </div>\n    </div></section>\n\n    <!-- 6. Perguntas frequentes -->\n    <section class=\"secao faq-secao\"><div class=\"container faq-grade\">\n      <h2>Dúvidas de quem está comprando</h2>\n      <div class=\"faq\">\n        <details>\n          <summary>Como sei se a peça serve no meu aparelho?</summary>\n          <p>Confira o modelo na etiqueta do aparelho e procure por ele aqui. A descrição de cada peça lista os modelos compatíveis. Se ainda ficar em dúvida, mande o modelo ou uma foto no WhatsApp que a gente confirma.</p>\n        </details>\n        <details>\n          <summary>Posso retirar no mesmo dia?</summary>\n          <p>Sim. Escolha “Retirar na loja” no carrinho. Com o pagamento aprovado, a peça fica separada e você retira no horário de atendimento, com estacionamento no local.</p>\n        </details>\n        <details>\n          <summary>E se a peça não servir?</summary>\n          <p>Você tem 7 dias depois de receber para desistir da compra, desde que a peça não tenha sido instalada. Se chegou errada ou com defeito, a troca é por nossa conta.</p>\n        </details>\n        <details>\n          <summary>Vocês entregam fora de São José dos Campos?</summary>\n          <p>Ao informar o CEP no carrinho você vê as opções disponíveis para o seu endereço. Se não aparecer envio para sua cidade, chame no WhatsApp que a gente combina.</p>\n        </details>\n      </div>\n    </div></section>\n\n    <section class=\"secao loja-fisica\"><div class=\"container\">\n      <div>\n        <h2>Prefere vir até a loja?</h2>\n        <p>Traga a peça velha ou uma foto da etiqueta: nossa equipe confere com você no balcão.</p>\n        <p id=\"end-loja\" style=\"font-weight:700\"></p>\n      </div>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a class=\"btn btn-primario\" href=\"https://maps.google.com/?q=Av.+Andr%C3%B4meda,+3358,+S%C3%A3o+Jos%C3%A9+dos+Campos\" target=\"_blank\" rel=\"noopener\">Como chegar</a>\n        <a class=\"btn btn-whats\" id=\"whats-loja\" href=\"#\" target=\"_blank\" rel=\"noopener\">Falar no WhatsApp</a>\n      </div>\n    </div></section>\n  </main>\n\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n  <script>\n    document.addEventListener('DOMContentLoaded', async () => {\n      const { api, cardProduto, categorias, catIcone, linkWhats, esc, cfg } = window.Mio;\n      document.getElementById('whats-foto').href = linkWhats('Olá! Vou mandar a foto de uma peça que preciso. Vocês têm?');\n      document.getElementById('whats-loja').href = linkWhats('Olá! Quero tirar uma dúvida sobre uma peça.');\n      // Cartão \"Hoje na loja\": aberta agora? (horário de São Paulo)\n      (() => {\n        const agora = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));\n        const d = agora.getDay(), h = agora.getHours() + agora.getMinutes() / 60;\n        const fecha = d >= 1 && d <= 5 ? 18 : d === 6 ? 12 : null;\n        const aberta = fecha !== null && h >= 8 && h < fecha;\n        const st = document.getElementById('hl-status');\n        st.textContent = aberta ? `Aberta agora, até $${fecha}h` : 'Fechada agora';\n        st.classList.add(aberta ? 'aberta' : 'fechada');\n        const prox = d !== 0 && h < 8 ? 'hoje, às 8h' : (d === 6 || d === 0) ? 'segunda, às 8h' : d === 5 ? 'sábado, às 8h' : 'amanhã, às 8h';\n        document.getElementById('hl-titulo').textContent = aberta ? 'Compre agora e retire hoje' : `Abrimos $${prox}`;\n        document.getElementById('hl-texto').textContent = aberta ? 'Pagou, separamos a peça. É só passar na Av. Andrômeda, 3358, com estacionamento.' : 'Faça o pedido agora: a peça fica separada para você retirar quando abrirmos.';\n        document.getElementById('hl-whats').href = linkWhats('Olá! Quero tirar uma dúvida antes de comprar.');\n      })();\n      document.getElementById('end-loja').textContent = `$${cfg.endereco}, $${cfg.cidade}. $${cfg.horario}.`;\n\n      const pit = [['20anos', 'Há 20 anos no mercado'], ['rapido', 'Atendimento rápido'], ['marcas', 'Grandes marcas'], ['entrega', 'Peças a pronta entrega'], ['estacionamento', 'Retire na loja: temos estacionamento']];\n      document.getElementById('pit-itens').innerHTML = pit.map(([i, t]) => `<div class=\"item\"><img src=\"/assets/pit-$${i}.png\" alt=\"\" width=\"38\" height=\"38\"><span>$${t}</span></div>`).join('');\n\n      // Atalhos por aparelho com as fotos da Dande\n      const comFoto = new Set(['geladeiras', 'lavadoras', 'secadoras', 'tanquinhos', 'microondas', 'ar-condicionado', 'filtros', 'lava-loucas']);\n      const curto = { geladeiras: 'Geladeira', lavadoras: 'Lavadora', secadoras: 'Secadora', tanquinhos: 'Tanquinho', microondas: 'Micro-ondas', 'ar-condicionado': 'Ar-condicionado', filtros: 'Purificador e filtro', 'lava-loucas': 'Lava-louças', ferramentas: 'Ferramentas', outros: 'Outras peças' };\n      const cats = await categorias();\n      const comItens = cats.filter((c) => c.total > 0);\n      const lista = (comItens.length >= 4 ? comItens : cats.filter((c) => comFoto.has(c.slug)));\n      document.getElementById('aparelhos').innerHTML = lista.map((c) => `\n        <a class=\"aparelho\" href=\"/loja.html?cat=$${c.slug}\">\n          <span class=\"ap-foto\">$${comFoto.has(c.slug) ? `<img src=\"/assets/cat-$${c.slug}.png\" alt=\"\" width=\"96\" height=\"96\">` : (catIcone[c.slug] || catIcone.outros)}</span>\n          <span class=\"ap-nome\">$${esc(curto[c.slug] || c.nome)}</span>\n          $${c.total ? `<span class=\"ap-qtd\">$${c.total} $${c.total === 1 ? 'peça' : 'peças'}</span>` : ''}\n        </a>`).join('');\n\n      const alvo = document.getElementById('destaques');\n      try {\n        let r = await api('/api/produtos?destaque=1&limite=8');\n        if (!r.itens.length) r = await api('/api/produtos?limite=8');\n        alvo.innerHTML = r.itens.length ? r.itens.map(cardProduto).join('')\n          : `<div class=\"vazio\" style=\"grid-column:1/-1\">Estamos colocando as peças no site agora. Enquanto isso, <a href=\"$${linkWhats('Olá! Procuro uma peça.')}\" target=\"_blank\" rel=\"noopener\">fale com a gente no WhatsApp</a> que a gente separa para você.</div>`;\n      } catch { alvo.innerHTML = '<div class=\"vazio\" style=\"grid-column:1/-1\">Não deu para carregar as peças agora. Atualize a página em instantes.</div>'; }\n\n      // Banner da Dande (versão quadrada no celular)\n      const ban = [1, 2, 3, 4];\n      document.getElementById('slides').innerHTML = ban.map((n) => `<picture><source media=\"(max-width: 640px)\" srcset=\"/assets/banner-m-$${n}.jpg\"><img src=\"/assets/banner-$${n}.jpg\" alt=\"Passa na Dande! As melhores peças para refrigeração você encontra aqui\" loading=\"lazy\" width=\"1920\" height=\"500\"></picture>`).join('');\n      const pontos = document.getElementById('pontos');\n      pontos.innerHTML = ban.map((n, i) => `<button aria-label=\"Banner $${n}\" class=\"$${i ? '' : 'ativo'}\"></button>`).join('');\n      const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;\n      let atual = 0, timer;\n      const ir = (i) => { atual = (i + ban.length) % ban.length; document.getElementById('slides').style.transform = `translateX(-$${atual * 100}%)`; [...pontos.children].forEach((b, k) => b.classList.toggle('ativo', k === atual)); clearInterval(timer); if (!reduzido) timer = setInterval(() => ir(atual + 1), 7000); };\n      pontos.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) ir([...pontos.children].indexOf(b)); });\n      document.getElementById('ant').onclick = () => ir(atual - 1);\n      document.getElementById('prox').onclick = () => ir(atual + 1);\n      ir(0);\n    });\n  </script>\n</body>\n</html>\n"
  web_logo_svg:
    content: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 228 60\" role=\"img\" aria-label=\"Mio Peça\">\n  <defs>\n    <linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"#337db9\"/>\n      <stop offset=\"1\" stop-color=\"#0a4e9b\"/>\n    </linearGradient>\n  </defs>\n  <!-- engrenagem estilizada com floco: peças para refrigeração e lavanderia -->\n  <g transform=\"translate(30 30)\">\n    <circle r=\"26\" fill=\"url(#g)\"/>\n    <g fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\">\n      <path d=\"M0-15V15M-13-7.5 13 7.5M-13 7.5 13-7.5\"/>\n      <path d=\"M-4-11 0-15 4-11M-4 11 0 15 4 11\"/>\n    </g>\n    <circle r=\"5.2\" fill=\"#25aae1\" stroke=\"#fff\" stroke-width=\"2.4\"/>\n  </g>\n  <text x=\"66\" y=\"34\" font-family=\"Jost, 'PT Sans', Arial, sans-serif\" font-size=\"30\" font-weight=\"700\" fill=\"#0a4e9b\" letter-spacing=\"-0.5\">mio<tspan fill=\"#25aae1\"> peça</tspan></text>\n  <text x=\"67\" y=\"51\" font-family=\"'PT Sans', Arial, sans-serif\" font-size=\"11\" fill=\"#727272\" letter-spacing=\"1.6\">LOJA ONLINE DA DANDE</text>\n</svg>\n"
  web_loja_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Peças | Dande Loja Online</title>\n  <meta name=\"description\" content=\"Catálogo de peças para geladeira, lavadora, micro-ondas, purificadores e mais. Loja online da Dande.\">\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body>\n  <div id=\"cabecalho-slot\"></div>\n  <main class=\"container secao\" style=\"padding-top:28px\">\n    <div class=\"lista-topo\">\n      <div>\n        <h1 id=\"titulo\">Todas as peças</h1>\n        <span id=\"contagem\" style=\"color:var(--texto-2);font-size:14px\"></span>\n      </div>\n      <label>\n        <span class=\"sr\">Ordenar</span>\n        <select id=\"ordem\">\n          <option value=\"\">Relevância</option>\n          <option value=\"menor\">Menor preço</option>\n          <option value=\"maior\">Maior preço</option>\n          <option value=\"nome\">Nome (A–Z)</option>\n        </select>\n      </label>\n    </div>\n    <div class=\"grade-prod\" id=\"grade\"></div>\n    <div class=\"paginacao\" id=\"paginacao\"></div>\n  </main>\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n  <script>\n    document.addEventListener('DOMContentLoaded', async () => {\n      const { api, qs, esc, cardProduto, categorias, linkWhats } = window.Mio;\n      const cat = qs('cat') || '', q = qs('q') || '';\n      const sel = document.getElementById('ordem');\n      sel.value = qs('ordem') || '';\n      sel.addEventListener('change', () => { const u = new URL(location); sel.value ? u.searchParams.set('ordem', sel.value) : u.searchParams.delete('ordem'); u.searchParams.delete('pagina'); location = u; });\n\n      const cats = await categorias();\n      const nomeCat = cats.find((c) => c.slug === cat)?.nome;\n      const titulo = q ? `Resultados para “$${q}”` : (nomeCat || 'Todas as peças');\n      document.getElementById('titulo').textContent = titulo;\n      document.title = `$${titulo} | Dande Loja Online`;\n\n      const grade = document.getElementById('grade');\n      grade.innerHTML = '<div class=\"esqueleto\" style=\"grid-column:1/-1\"></div>';\n      const pagina = Number(qs('pagina') || 1);\n      const p = new URLSearchParams({ pagina, limite: 24 });\n      if (cat) p.set('cat', cat); if (q) p.set('q', q); if (qs('ordem')) p.set('ordem', qs('ordem'));\n      try {\n        const r = await api('/api/produtos?' + p);\n        document.getElementById('contagem').textContent = `$${r.total} $${r.total === 1 ? 'produto' : 'produtos'}`;\n        if (!r.itens.length) {\n          grade.innerHTML = `<div class=\"vazio\" style=\"grid-column:1/-1\">\n            <p style=\"margin-top:0\">Nenhuma peça encontrada$${q ? ` para “$${esc(q)}”` : ''}.</p>\n            <p>Temos muito mais no balcão da loja. Mande o modelo do aparelho que a gente procura para você.</p>\n            <a class=\"btn btn-whats\" target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Procuro uma peça$${q ? `: $${q}` : ''}.`)}\">Pedir pelo WhatsApp</a></div>`;\n          return;\n        }\n        grade.innerHTML = r.itens.map(cardProduto).join('');\n        const paginas = Math.ceil(r.total / 24);\n        if (paginas > 1) {\n          const pag = document.getElementById('paginacao');\n          pag.innerHTML = Array.from({ length: paginas }, (_, i) => `<button class=\"$${i + 1 === pagina ? 'ativo' : ''}\" data-p=\"$${i + 1}\" aria-label=\"Página $${i + 1}\">$${i + 1}</button>`).join('');\n          pag.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const u = new URL(location); u.searchParams.set('pagina', b.dataset.p); location = u; });\n        }\n      } catch (e) { grade.innerHTML = `<div class=\"vazio\" style=\"grid-column:1/-1\">$${esc(e.message)}</div>`; }\n    });\n  </script>\n</body>\n</html>\n"
  web_painel_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Painel | Dande Loja Online</title>\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n  <style>\n    body { background: #eef3f6; }\n    .pn-topo { background: linear-gradient(to right, var(--azul-escuro), var(--azul)); color: #fff; }\n    .pn-topo .container { display: flex; align-items: center; gap: 16px; min-height: 60px; }\n    .pn-topo img { height: 36px; background: #fff; border-radius: 6px; padding: 3px 8px; }\n    .pn-topo nav { display: flex; gap: 4px; margin-left: 12px; overflow-x: auto; }\n    .pn-topo nav button { background: none; border: 0; color: #d6e7f7; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; white-space: nowrap; }\n    .pn-topo nav button.ativo { background: rgba(255,255,255,.18); color: #fff; }\n    .pn-topo .sair { margin-left: auto; color: #fff; background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; padding: 6px 14px; cursor: pointer; }\n    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 20px 0; }\n    .kpi { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; }\n    .kpi .v { font-size: 28px; font-weight: 700; color: var(--azul-escuro); line-height: 1.1; }\n    .kpi .l { font-size: 13px; color: var(--texto-2); }\n    .tabela { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }\n    .tabela th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); padding: 10px; border-bottom: 2px solid var(--linha); background: #f8fbfc; position: sticky; top: 0; }\n    .tabela td { padding: 10px; border-bottom: 1px solid var(--linha); vertical-align: middle; }\n    .tabela img { width: 48px; height: 48px; object-fit: contain; border: 1px solid var(--linha); border-radius: 6px; background: #fff; }\n    .tabela .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }\n    .tab-wrap { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); max-height: 70vh; }\n    .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }\n    .filtros input, .filtros select { border: 1px solid #c8d6df; border-radius: 20px; padding: 7px 14px; background: #fff; }\n    .chip { display: inline-block; font-size: 11.5px; border-radius: 10px; padding: 1px 8px; margin: 2px 2px 0 0; }\n    .chip-b { background: var(--erro-claro); color: var(--erro); }\n    .chip-a { background: var(--alerta-claro); color: var(--alerta); }\n    .chip-ok { background: var(--verde-claro); color: var(--verde); }\n    .interruptor { position: relative; width: 44px; height: 24px; display: inline-block; }\n    .interruptor input { opacity: 0; width: 0; height: 0; }\n    .interruptor span { position: absolute; inset: 0; background: #c9d4db; border-radius: 12px; cursor: pointer; transition: .2s; }\n    .interruptor span::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }\n    .interruptor input:checked + span { background: var(--verde); }\n    .interruptor input:checked + span::before { transform: translateX(20px); }\n    .interruptor input:disabled + span { opacity: .45; cursor: not-allowed; }\n    .tabela select, .tabela input[type=text] { border: 1px solid #c8d6df; border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 190px; background: #fff; }\n    .st { font-weight: 700; font-size: 12px; text-transform: uppercase; }\n    .st-aguardando_pagamento { color: var(--alerta); } .st-pago { color: var(--verde); } .st-enviado, .st-entregue { color: var(--azul-vivo); } .st-cancelado { color: var(--erro); }\n    .login { max-width: 380px; margin: 12vh auto; }\n    .config-lista { display: grid; gap: 10px; }\n    .config-lista .l { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--linha); }\n    .config-lista code { background: var(--gelo); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; word-break: break-all; }\n    dialog { border: 0; border-radius: var(--raio); padding: 0; max-width: 640px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }\n    dialog::backdrop { background: rgba(10, 30, 50, .45); }\n    dialog .cab { padding: 16px 20px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }\n    dialog .corpo { padding: 16px 20px; max-height: 70vh; overflow: auto; }\n  </style>\n</head>\n<body>\n  <section id=\"tela-login\" class=\"login\" hidden>\n    <form class=\"painel-box\" id=\"form-login\">\n      <img src=\"/logo.svg\" alt=\"Mio Peça\" width=\"190\" height=\"50\" style=\"margin:0 auto 16px\">\n      <div class=\"campo\"><label for=\"senha\">Senha do painel</label><input id=\"senha\" type=\"password\" autocomplete=\"current-password\" required></div>\n      <div id=\"login-erro\" class=\"aviso aviso-erro\" hidden></div>\n      <button class=\"btn btn-primario btn-bloco\" style=\"margin-top:14px\">Entrar</button>\n    </form>\n  </section>\n\n  <div id=\"app\" hidden>\n    <header class=\"pn-topo\"><div class=\"container\">\n      <img src=\"/logo.svg\" alt=\"Mio Peça\">\n      <nav id=\"abas\">\n        <button data-aba=\"geral\" class=\"ativo\">Visão geral</button>\n        <button data-aba=\"produtos\">Produtos</button>\n        <button data-aba=\"pedidos\">Pedidos</button>\n      </nav>\n      <a href=\"/\" target=\"_blank\" style=\"color:#fff;font-size:14px;margin-left:auto\">Ver loja ↗</a>\n      <button class=\"sair\" id=\"sair\">Sair</button>\n    </div></header>\n    <main class=\"container\" style=\"padding-bottom:40px\">\n      <section data-painel=\"geral\"></section>\n      <section data-painel=\"produtos\" hidden></section>\n      <section data-painel=\"pedidos\" hidden></section>\n    </main>\n  </div>\n\n  <dialog id=\"dlg\"><div class=\"cab\"><h3 id=\"dlg-titulo\" style=\"margin:0\"></h3><button class=\"btn btn-pequeno\" onclick=\"document.getElementById('dlg').close()\">Fechar</button></div><div class=\"corpo\" id=\"dlg-corpo\"></div></dialog>\n\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/painel.js?v=89ebcc5d\"></script>\n</body>\n</html>\n"
  web_painel_js:
    content: "// Painel da Mio Peça: conexão com o Bling, curadoria do catálogo e pedidos.\n(function () {\n  const $$ = (s, el = document) => el.querySelector(s);\n  const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n  const data = (s) => (s ? new Date(s).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—');\n  const STATUS = { aguardando_pagamento: 'Aguardando pagamento', pago: 'Pago', enviado: 'Enviado', entregue: 'Entregue', cancelado: 'Cancelado' };\n\n  async function api(caminho, opts = {}) {\n    const res = await fetch(caminho, { method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });\n    let d = null; try { d = await res.json(); } catch {}\n    if (res.status === 401 && !caminho.endsWith('/login')) { mostrarLogin(); throw new Error('Sessão expirada.'); }\n    if (!res.ok) throw new Error(d?.erro || `Erro $${res.status}`);\n    return d;\n  }\n  function toast(msg, erro) {\n    let t = $$('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }\n    t.textContent = msg; t.style.background = erro ? 'var(--erro)' : ''; t.classList.add('on');\n    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200);\n  }\n  function mostrarLogin() { $$('#tela-login').hidden = false; $$('#app').hidden = true; }\n\n  $$('#form-login').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    try { await api('/api/admin/login', { method: 'POST', body: { senha: $$('#senha').value } }); $$('#tela-login').hidden = true; iniciar(); }\n    catch (err) { $$('#login-erro').textContent = err.message; $$('#login-erro').hidden = false; }\n  });\n  $$('#sair').addEventListener('click', async () => { await api('/api/admin/logout', { method: 'POST' }).catch(() => {}); location.reload(); });\n\n  let status = null, abaAtual = 'geral';\n  $$('#abas').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) abrir(b.dataset.aba); });\n  function abrir(aba) {\n    abaAtual = aba;\n    document.querySelectorAll('#abas button').forEach((b) => b.classList.toggle('ativo', b.dataset.aba === aba));\n    document.querySelectorAll('[data-painel]').forEach((s) => { s.hidden = s.dataset.painel !== aba; });\n    ({ geral: renderGeral, produtos: renderProdutos, pedidos: renderPedidos })[aba]();\n  }\n\n  // ---------------- Visão geral ----------------\n  let pollSync = null;\n  async function renderGeral() {\n    const el = $$('[data-painel=geral]');\n    status = await api('/api/admin/status');\n    const s = status, ped = Object.fromEntries(s.pedidos.map((p) => [p.status, p]));\n    const pagos = ['pago', 'enviado', 'entregue'].reduce((a, k) => a + (ped[k]?.v || 0), 0);\n    const ok = (b) => (b ? '<span class=\"chip chip-ok\">ok</span>' : '<span class=\"chip chip-b\">pendente</span>');\n    el.innerHTML = `\n      $${new URLSearchParams(location.search).get('bling') === 'ok' ? '<div class=\"aviso aviso-ok\" style=\"margin-top:16px\">Bling conectado. A primeira sincronização começou e leva alguns minutos (o Bling limita a 3 consultas por segundo).</div>' : ''}\n      <div class=\"kpis\">\n        <div class=\"kpi\"><div class=\"v\">$${s.produtos.publicados || 0}</div><div class=\"l\">produtos no ar</div></div>\n        <div class=\"kpi\"><div class=\"v\">$${s.produtos.ativos || 0}</div><div class=\"l\">produtos ativos no Bling</div></div>\n        <div class=\"kpi\"><div class=\"v\">$${ped.aguardando_pagamento?.n || 0}</div><div class=\"l\">pedidos aguardando pagamento</div></div>\n        <div class=\"kpi\"><div class=\"v\">$${ped.pago?.n || 0}</div><div class=\"l\">pedidos pagos para separar</div></div>\n        <div class=\"kpi\"><div class=\"v\">$${brl(pagos)}</div><div class=\"l\">vendido (pagos)</div></div>\n      </div>\n      <div class=\"painel-box\">\n        <h2>Integrações</h2>\n        <div class=\"config-lista\">\n          <div class=\"l\"><div><b>Bling</b> $${ok(s.bling.conectado)}<br><small style=\"color:var(--texto-2)\">$${s.bling.conectado ? `$${esc(s.bling.empresa?.nome || '')} · $${esc(s.bling.empresa?.cnpj || '')}` : s.bling.configurado ? 'Credenciais configuradas. Falta autorizar.' : 'Faltam BLING_CLIENT_ID e BLING_CLIENT_SECRET no servidor.'}</small><br><small>URL de retorno do app no Bling: <code>$${esc(s.bling.callback)}</code></small></div>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">$${s.bling.configurado ? `<a class=\"btn btn-pequeno $${s.bling.conectado ? '' : 'btn-primario'}\" href=\"/api/admin/bling/conectar\">$${s.bling.conectado ? 'Reconectar' : 'Conectar Bling'}</a>` : ''}</div></div>\n          <div class=\"l\"><div><b>Sincronização do catálogo</b><br><small style=\"color:var(--texto-2)\" id=\"sync-txt\"></small></div>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn btn-pequeno\" id=\"sync-rapido\" $${s.bling.conectado ? '' : 'disabled'}>Atualizar preço e estoque</button><button class=\"btn btn-pequeno\" id=\"sync-completo\" $${s.bling.conectado ? '' : 'disabled'}>Reler tudo (fotos e descrições)</button></div></div>\n          <div class=\"l\"><div><b>Mercado Pago</b> $${ok(s.mp.configurado)}<br><small style=\"color:var(--texto-2)\">$${s.mp.configurado ? (s.mp.webhook ? `Notificações: <code>$${esc(s.mp.webhook)}</code>` : 'Sem HTTPS: o status do pagamento é conferido quando o cliente volta ao site ou pelo botão “Conferir pagamento” no pedido.') : 'Sem MP_ACCESS_TOKEN: pedidos ficam registrados e o pagamento é combinado pelo WhatsApp.'}</small></div></div>\n          <div class=\"l\"><div><b>Pedido no Bling</b><br><small style=\"color:var(--texto-2)\">$${s.bling.pedidoAuto ? 'Automático: pedido pago vira pedido de venda no Bling.' : 'Manual: em cada pedido pago, clique em “Enviar ao Bling”.'}</small></div></div>\n          <div class=\"l\"><div><b>Frete</b><br><small style=\"color:var(--texto-2)\">Retirada grátis · Entrega em São José dos Campos $${brl(s.frete.local)} · Correios/transportadoras $${s.frete.melhorEnvio ? 'via Melhor Envio' : '<b>desligado</b> (falta MELHOR_ENVIO_TOKEN)'}</small></div></div>\n        </div>\n      </div>\n      <div class=\"painel-box\"><h2>Últimos eventos</h2><div id=\"eventos\" style=\"font-size:13px\"></div></div>`;\n    $$('#sync-rapido')?.addEventListener('click', () => dispararSync(false));\n    $$('#sync-completo')?.addEventListener('click', () => dispararSync(true));\n    atualizarSyncTxt(s.sync);\n    if (s.sync.rodando) acompanharSync();\n    const ev = await api('/api/admin/eventos');\n    $$('#eventos').innerHTML = ev.length ? ev.slice(0, 25).map((e) => `<div style=\"padding:5px 0;border-bottom:1px solid var(--linha)\"><span style=\"color:var(--texto-2)\">$${data(e.em)}</span> · <b>$${esc(e.tipo)}</b> <span style=\"color:var(--texto-2)\">$${esc(e.dados).slice(0, 160)}</span></div>`).join('') : '<p style=\"color:var(--texto-2)\">Nada ainda.</p>';\n  }\n  function atualizarSyncTxt(sy) {\n    const t = $$('#sync-txt'); if (!t) return;\n    t.textContent = sy.rodando ? `Rodando: $${sy.etapa} ($${sy.lidos} lidos, $${sy.detalhados} detalhados)…`\n      : `$${sy.ultimo ? `Última: $${data(sy.ultimo.em)} ($${sy.ultimo.lidos} produtos)` : 'Ainda não sincronizou.'} · Automática a cada $${sy.intervaloMin} min$${sy.erro ? ` · Último erro: $${sy.erro}` : ''}`;\n  }\n  async function dispararSync(completo) {\n    try { await api('/api/admin/sync', { method: 'POST', body: { completo } }); toast('Sincronização iniciada'); acompanharSync(); } catch (e) { toast(e.message, true); }\n  }\n  function acompanharSync() {\n    clearInterval(pollSync);\n    pollSync = setInterval(async () => {\n      const s = await api('/api/admin/status').catch(() => null); if (!s) return;\n      atualizarSyncTxt(s.sync);\n      if (!s.sync.rodando) { clearInterval(pollSync); if (abaAtual === 'geral') renderGeral(); toast(s.sync.erro ? 'Sincronização terminou com erro' : 'Catálogo sincronizado', !!s.sync.erro); }\n    }, 3000);\n  }\n\n  // ---------------- Produtos ----------------\n  const filtroProd = { q: '', filtro: 'prontos', cat: '', pagina: 1 };\n  async function renderProdutos() {\n    const el = $$('[data-painel=produtos]');\n    if (!status) status = await api('/api/admin/status');\n    const cats = status.categorias;\n    if (!el.dataset.montado) {\n      el.dataset.montado = '1';\n      el.innerHTML = `\n        <div class=\"aviso aviso-info\" style=\"margin-top:16px\">O catálogo do Bling da Mio é uma lista de candidatos: nada vai ao ar sozinho. Ligue “No ar” só nos produtos que fazem sentido vender online. Itens com <span class=\"chip chip-b\">bloqueio</span> precisam ser corrigidos no Bling primeiro (preço, foto ou descrição).</div>\n        <div class=\"filtros\">\n          <input id=\"f-q\" type=\"search\" placeholder=\"Buscar por nome ou código\" style=\"min-width:240px\">\n          <select id=\"f-filtro\">\n            <option value=\"prontos\">Prontos para publicar</option>\n            <option value=\"publicados\">No ar</option>\n            <option value=\"bloqueados\">Com bloqueio</option>\n            <option value=\"todos\">Todos</option>\n          </select>\n          <select id=\"f-cat\"><option value=\"\">Todas as categorias</option>$${cats.map((c) => `<option value=\"$${c.slug}\">$${esc(c.nome)}</option>`).join('')}</select>\n          <span id=\"f-total\" style=\"color:var(--texto-2);font-size:14px\"></span>\n        </div>\n        <div class=\"tab-wrap\"><table class=\"tabela\"><thead><tr>\n          <th></th><th>Produto</th><th class=\"num\">Preço</th><th class=\"num\">Estoque</th><th>Categoria no site</th><th>Higiene</th><th>Destaque</th><th>No ar</th>\n        </tr></thead><tbody id=\"prod-corpo\"></tbody></table></div>\n        <div class=\"paginacao\" id=\"prod-pag\"></div>`;\n      let t;\n      $$('#f-q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { filtroProd.q = e.target.value; filtroProd.pagina = 1; carregarProdutos(); }, 300); });\n      $$('#f-filtro').addEventListener('change', (e) => { filtroProd.filtro = e.target.value; filtroProd.pagina = 1; carregarProdutos(); });\n      $$('#f-cat').addEventListener('change', (e) => { filtroProd.cat = e.target.value; filtroProd.pagina = 1; carregarProdutos(); });\n      $$('#prod-corpo').addEventListener('change', async (e) => {\n        const tr = e.target.closest('tr'); if (!tr) return;\n        const id = tr.dataset.id, campo = e.target.dataset.campo;\n        const valor = e.target.type === 'checkbox' ? e.target.checked : e.target.value;\n        try {\n          await api(`/api/admin/produtos/$${id}`, { method: 'PATCH', body: { [campo]: valor } });\n          toast(campo === 'publicado' ? (valor ? 'Produto no ar' : 'Produto fora do ar') : 'Salvo');\n        } catch (err) { toast(err.message, true); if (e.target.type === 'checkbox') e.target.checked = !valor; }\n      });\n      $$('#prod-corpo').addEventListener('click', async (e) => {\n        const b = e.target.closest('[data-acao=reler]'); if (!b) return;\n        b.disabled = true; b.textContent = 'Lendo…';\n        try { await api(`/api/admin/produtos/$${b.closest('tr').dataset.id}/atualizar`, { method: 'POST' }); toast('Produto relido do Bling'); carregarProdutos(); } catch (err) { toast(err.message, true); b.disabled = false; b.textContent = 'Reler'; }\n      });\n      $$('#prod-pag').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; filtroProd.pagina = Number(b.dataset.p); carregarProdutos(); });\n    }\n    $$('#f-filtro').value = filtroProd.filtro;\n    carregarProdutos();\n  }\n  async function carregarProdutos() {\n    const corpo = $$('#prod-corpo');\n    corpo.innerHTML = '<tr><td colspan=\"8\" class=\"carregando\">Carregando…</td></tr>';\n    const p = new URLSearchParams({ q: filtroProd.q, filtro: filtroProd.filtro, cat: filtroProd.cat, pagina: filtroProd.pagina });\n    const r = await api('/api/admin/produtos?' + p);\n    $$('#f-total').textContent = `$${r.total} produto(s)`;\n    const cats = status.categorias;\n    corpo.innerHTML = r.itens.length ? r.itens.map((x) => `\n      <tr data-id=\"$${x.id}\">\n        <td>$${x.imagem ? `<img src=\"$${esc(x.imagem)}\" alt=\"\">` : '<div style=\"width:48px;height:48px;border:1px dashed var(--linha);border-radius:6px\"></div>'}</td>\n        <td style=\"min-width:260px\"><div>$${esc(x.nome)}</div><small style=\"color:var(--texto-2)\">$${esc(x.codigo || 'sem código')} · Bling $${x.id}</small><br>\n          <input type=\"text\" data-campo=\"titulo_site\" placeholder=\"Título no site (opcional)\" value=\"$${esc(x.titulo_site || '')}\" style=\"margin-top:4px;max-width:320px;width:100%\"></td>\n        <td class=\"num\">$${brl(x.preco)}$${x.custo ? `<br><small style=\"color:var(--texto-2)\">custo $${brl(x.custo)}</small>` : ''}</td>\n        <td class=\"num\">$${Math.floor(x.estoque)}</td>\n        <td><select data-campo=\"categoria_site\">$${cats.map((c) => `<option value=\"$${c.slug}\" $${c.slug === x.categoria_site ? 'selected' : ''}>$${esc(c.nome)}</option>`).join('')}</select></td>\n        <td style=\"min-width:180px\">$${x.bloqueios.map((b) => `<span class=\"chip chip-b\">$${esc(b)}</span>`).join('')}$${x.avisos.map((a) => `<span class=\"chip chip-a\">$${esc(a)}</span>`).join('')}$${!x.bloqueios.length && !x.avisos.length ? '<span class=\"chip chip-ok\">ok</span>' : ''}\n          $${!x.detalhado || x.bloqueios.includes('sem imagem') ? '<br><button class=\"btn btn-pequeno\" data-acao=\"reler\" style=\"margin-top:4px;padding:3px 10px\">Reler</button>' : ''}</td>\n        <td><label class=\"interruptor\"><input type=\"checkbox\" data-campo=\"destaque\" $${x.destaque ? 'checked' : ''} aria-label=\"Destaque\"><span></span></label></td>\n        <td><label class=\"interruptor\"><input type=\"checkbox\" data-campo=\"publicado\" $${x.publicado ? 'checked' : ''} $${x.bloqueios.length && !x.publicado ? 'disabled' : ''} aria-label=\"No ar\"><span></span></label></td>\n      </tr>`).join('') : `<tr><td colspan=\"8\" class=\"carregando\">$${status.bling.conectado ? 'Nenhum produto neste filtro.' : 'Conecte o Bling na Visão geral para trazer o catálogo.'}</td></tr>`;\n    const paginas = Math.ceil(r.total / 50);\n    $$('#prod-pag').innerHTML = paginas > 1 ? Array.from({ length: paginas }, (_, i) => `<button class=\"$${i + 1 === filtroProd.pagina ? 'ativo' : ''}\" data-p=\"$${i + 1}\">$${i + 1}</button>`).join('') : '';\n  }\n\n  // ---------------- Pedidos ----------------\n  let pedidos = [];\n  async function renderPedidos() {\n    const el = $$('[data-painel=pedidos]');\n    el.innerHTML = `<div class=\"filtros\"><select id=\"f-st\"><option value=\"\">Todos os status</option>$${Object.entries(STATUS).map(([k, v]) => `<option value=\"$${k}\">$${v}</option>`).join('')}</select></div>\n      <div class=\"tab-wrap\"><table class=\"tabela\"><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Entrega</th><th class=\"num\">Total</th><th>Status</th><th>Bling</th><th></th></tr></thead><tbody id=\"ped-corpo\"></tbody></table></div>`;\n    $$('#f-st').addEventListener('change', carregarPedidos);\n    $$('#ped-corpo').addEventListener('click', (e) => { const b = e.target.closest('[data-ver]'); if (b) verPedido(Number(b.dataset.ver)); });\n    carregarPedidos();\n  }\n  async function carregarPedidos() {\n    const st = $$('#f-st').value;\n    pedidos = await api('/api/admin/pedidos' + (st ? `?status=$${st}` : ''));\n    $$('#ped-corpo').innerHTML = pedidos.length ? pedidos.map((p) => `\n      <tr><td><b>$${esc(p.codigo)}</b></td><td>$${data(p.criado_em)}</td><td>$${esc(p.cliente.nome)}<br><small style=\"color:var(--texto-2)\">$${esc(p.cliente.telefone)}</small></td>\n        <td>$${esc(p.frete_nome || '')}</td><td class=\"num\">$${brl(p.total)}</td><td><span class=\"st st-$${p.status}\">$${STATUS[p.status] || p.status}</span></td>\n        <td>$${p.bling_pedido_id ? `<span class=\"chip chip-ok\">nº $${esc(p.bling_numero || p.bling_pedido_id)}</span>` : p.bling_erro ? '<span class=\"chip chip-b\">erro</span>' : '—'}</td>\n        <td><button class=\"btn btn-pequeno\" data-ver=\"$${p.id}\">Abrir</button></td></tr>`).join('') : '<tr><td colspan=\"8\" class=\"carregando\">Nenhum pedido ainda.</td></tr>';\n  }\n  function verPedido(id) {\n    const p = pedidos.find((x) => x.id === id); if (!p) return;\n    const end = p.endereco ? `$${esc(p.endereco.rua)}, $${esc(p.endereco.numero)} $${esc(p.endereco.complemento || '')}<br>$${esc(p.endereco.bairro)} · $${esc(p.endereco.cidade)}/$${esc(p.endereco.uf)} · CEP $${esc(p.endereco.cep)}` : 'Retirada na loja';\n    const whats = `https://wa.me/55$${String(p.cliente.telefone).replace(/^55/, '')}?text=$${encodeURIComponent(`Olá, $${p.cliente.nome.split(' ')[0]}! Aqui é da Mio Peça, sobre o seu pedido $${p.codigo}.`)}`;\n    $$('#dlg-titulo').textContent = `Pedido $${p.codigo}`;\n    $$('#dlg-corpo').innerHTML = `\n      <p><b>$${esc(p.cliente.nome)}</b> · CPF $${esc(p.cliente.cpf)}<br>$${esc(p.cliente.email)} · <a href=\"$${whats}\" target=\"_blank\" rel=\"noopener\">$${esc(p.cliente.telefone)}</a></p>\n      <p><b>Entrega:</b> $${esc(p.frete_nome || '')}<br>$${end}</p>\n      <table class=\"tabela\" style=\"margin:10px 0\">$${p.itens.map((i) => `<tr><td>$${i.qtd}×</td><td>$${esc(i.nome)}<br><small style=\"color:var(--texto-2)\">$${esc(i.codigo)}</small></td><td class=\"num\">$${brl(i.preco * i.qtd)}</td></tr>`).join('')}\n        <tr><td></td><td>Frete</td><td class=\"num\">$${brl(p.frete)}</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>$${brl(p.total)}</b></td></tr></table>\n      <p><b>Mercado Pago:</b> $${p.mp_pagamento ? `pagamento $${esc(p.mp_pagamento)} ($${esc(p.mp_status)})` : p.mp_preferencia ? 'link gerado, sem pagamento ainda' : 'sem link (pagamento a combinar)'}</p>\n      $${p.bling_erro ? `<div class=\"aviso aviso-erro\">Erro ao enviar ao Bling: $${esc(p.bling_erro)}</div>` : ''}\n      <div class=\"campos\" style=\"margin-top:10px\">\n        <div class=\"campo m3\"><label for=\"d-st\">Status</label><select id=\"d-st\">$${Object.entries(STATUS).map(([k, v]) => `<option value=\"$${k}\" $${k === p.status ? 'selected' : ''}>$${v}</option>`).join('')}</select></div>\n        <div class=\"campo\"><label for=\"d-obs\">Observação interna</label><textarea id=\"d-obs\" rows=\"2\">$${esc(p.obs_interna || '')}</textarea></div>\n      </div>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\">\n        <button class=\"btn btn-primario btn-pequeno\" id=\"d-salvar\">Salvar</button>\n        $${p.mp_preferencia ? '<button class=\"btn btn-pequeno\" id=\"d-conferir\">Conferir pagamento</button>' : ''}\n        $${p.status === 'pago' && !p.bling_pedido_id ? '<button class=\"btn btn-comprar btn-pequeno\" id=\"d-bling\">Enviar ao Bling</button>' : ''}\n      </div>\n      $${p.status === 'pago' && !p.bling_pedido_id ? '<p style=\"font-size:12.5px;color:var(--texto-2)\">“Enviar ao Bling” cria o pedido de venda na conta da Mio (com o cliente cadastrado pelo CPF). A nota fiscal continua sendo emitida por você no Bling.</p>' : ''}`;\n    $$('#d-salvar').onclick = async () => {\n      if ($$('#d-st').value === 'pago' && p.status !== 'pago' && !confirm('Marcar como pago manualmente? Use só se o pagamento foi confirmado fora do Mercado Pago.')) return;\n      try { await api(`/api/admin/pedidos/$${p.id}`, { method: 'PATCH', body: { status: $$('#d-st').value, obs_interna: $$('#d-obs').value } }); toast('Pedido salvo'); $$('#dlg').close(); carregarPedidos(); } catch (e) { toast(e.message, true); }\n    };\n    if ($$('#d-conferir')) $$('#d-conferir').onclick = async () => {\n      try { const r = await api(`/api/admin/pedidos/$${p.id}/conferir-pagamento`, { method: 'POST' }); toast(r.encontrado ? `Pagamento: $${r.status}` : 'Nenhum pagamento encontrado'); $$('#dlg').close(); carregarPedidos(); } catch (e) { toast(e.message, true); }\n    };\n    if ($$('#d-bling')) $$('#d-bling').onclick = async (ev) => {\n      if (!confirm(`Criar o pedido de venda $${p.codigo} ($${brl(p.total)}) no Bling da Mio?`)) return;\n      ev.target.disabled = true; ev.target.textContent = 'Enviando…';\n      try { await api(`/api/admin/pedidos/$${p.id}/bling`, { method: 'POST' }); toast('Pedido criado no Bling'); $$('#dlg').close(); carregarPedidos(); } catch (e) { toast(e.message, true); ev.target.disabled = false; ev.target.textContent = 'Enviar ao Bling'; }\n    };\n    $$('#dlg').showModal();\n  }\n\n  async function iniciar() {\n    try { status = await api('/api/admin/status'); } catch { return; }\n    $$('#app').hidden = false;\n    abrir('geral');\n  }\n  iniciar();\n})();\n"
  web_pedido_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Seu pedido | Dande Loja Online</title>\n  <meta name=\"robots\" content=\"noindex\">\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body>\n  <div id=\"cabecalho-slot\"></div>\n  <main class=\"container secao\" style=\"max-width:760px\" id=\"conteudo\"><div class=\"esqueleto\"></div></main>\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n  <script>\n    document.addEventListener('DOMContentLoaded', async () => {\n      const { api, qs, esc, brl, ic, linkWhats } = window.Mio;\n      const alvo = document.getElementById('conteudo');\n      const extra = qs('payment_id') ? `&payment_id=$${encodeURIComponent(qs('payment_id'))}` : '';\n      let p;\n      try { p = await api(`/api/pedidos/$${encodeURIComponent(qs('c') || '')}?t=$${encodeURIComponent(qs('t') || '')}$${extra}`); }\n      catch { alvo.innerHTML = '<div class=\"vazio\">Pedido não encontrado. Confira o link recebido ou fale com a gente no WhatsApp.</div>'; return; }\n      const estados = {\n        aguardando_pagamento: ['espera', ic.relogio.replace(/16/g, '30'), 'Aguardando pagamento', p.pagamento ? 'Seu pedido foi registrado. Conclua o pagamento para separarmos as peças.' : 'Seu pedido foi registrado. Vamos falar com você pelo WhatsApp para combinar o pagamento.'],\n        pago: ['ok', ic.check.replace(/18/g, '30'), 'Pagamento aprovado', 'Recebemos seu pagamento. Já estamos separando as peças.'],\n        enviado: ['ok', ic.caixa.replace(/18/g, '30'), 'Pedido enviado', 'Seu pedido saiu para entrega.'],\n        entregue: ['ok', ic.check.replace(/18/g, '30'), 'Pedido entregue', 'Obrigado por comprar com a Dande!'],\n        cancelado: ['cancelado', '✕', 'Pedido cancelado', 'Se foi engano, fale com a gente pelo WhatsApp.'],\n      };\n      const [cls, icone, titulo, texto] = estados[p.status] || estados.aguardando_pagamento;\n      alvo.innerHTML = `\n        <div class=\"painel-box status-pedido $${cls}\">\n          <div class=\"icone\">$${icone}</div>\n          <h1 style=\"font-size:26px\">$${titulo}</h1>\n          <p style=\"color:var(--texto-2)\">$${texto}</p>\n          <p>Pedido <b>$${esc(p.codigo)}</b></p>\n          $${p.pagamento ? `<a class=\"btn btn-comprar\" href=\"$${esc(p.pagamento)}\">Pagar agora</a>` : ''}\n        </div>\n        <div class=\"painel-box\">\n          <h2>Itens</h2>\n          $${p.itens.map((i) => `<div class=\"linha\" style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0\"><span>$${i.qtd}× $${esc(i.nome)}</span><b>$${brl(i.preco * i.qtd)}</b></div>`).join('')}\n          <hr style=\"border:0;border-top:1px solid var(--linha)\">\n          <div style=\"display:flex;justify-content:space-between\"><span>$${esc(p.frete_nome || 'Entrega')}</span><span>$${p.frete ? brl(p.frete) : 'Grátis'}</span></div>\n          <div style=\"display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:var(--azul-escuro);margin-top:8px\"><span>Total</span><span>$${brl(p.total)}</span></div>\n        </div>\n        <p style=\"text-align:center\"><a class=\"btn btn-whats\" target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Sobre meu pedido $${p.codigo}.`)}\">Falar sobre este pedido</a></p>\n        <p style=\"text-align:center;font-size:13px;color:var(--texto-2)\">Guarde este link para acompanhar o pedido.</p>`;\n    });\n  </script>\n</body>\n</html>\n"
  web_politicas_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Políticas da loja | Dande Loja Online</title>\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body>\n  <div id=\"cabecalho-slot\"></div>\n  <main class=\"container\">\n    <article class=\"texto-pg\">\n      <h1>Políticas da loja</h1>\n      <p>A Mio Peça é a loja online da Dande, operada por Mio Peças para Refrigeração Ltda, CNPJ 61.102.078/0001-01, Av. Andrômeda, 3358 – Bosque dos Eucaliptos, São José dos Campos – SP.</p>\n\n      <h2 id=\"trocas\">Trocas e devoluções</h2>\n      <p><b>Arrependimento:</b> em compras pela internet você pode desistir em até 7 dias corridos após o recebimento, conforme o Código de Defesa do Consumidor (art. 49). A peça deve voltar sem sinais de instalação ou uso, com a embalagem e os acessórios. Devolvemos o valor pago, incluindo o frete, pelo mesmo meio de pagamento.</p>\n      <p><b>Peça errada ou com defeito:</b> se a peça chegou diferente do anunciado ou com defeito, fale com a gente pelo WhatsApp com o número do pedido e fotos. A troca não tem custo para você.</p>\n      <p><b>Compatibilidade:</b> antes de comprar, confira o modelo do seu aparelho. Na dúvida, mande o modelo pelo WhatsApp e confirmamos para você.</p>\n\n      <h2 id=\"entrega\">Entrega e retirada</h2>\n      <p><b>Retirada na loja:</b> grátis, no endereço acima, após a confirmação do pagamento, no horário de atendimento (seg a sex 8h às 18h, sáb 8h às 12h). Leve o número do pedido e um documento com foto.</p>\n      <p><b>Entrega em São José dos Campos:</b> em até 1 dia útil após a confirmação do pagamento, com o valor mostrado no carrinho.</p>\n      <p><b>Envio para outras cidades:</b> quando disponível, os prazos e valores aparecem no carrinho ao informar o CEP. O prazo começa a contar após a confirmação do pagamento.</p>\n\n      <h2 id=\"garantia\">Garantia</h2>\n      <p>Todas as peças têm a garantia legal de 90 dias para produtos duráveis (CDC, art. 26), contada a partir do recebimento. A garantia não cobre danos causados por instalação incorreta ou uso em aparelho incompatível.</p>\n\n      <h2 id=\"pagamento\">Pagamento</h2>\n      <p>Os pagamentos são processados pelo Mercado Pago (Pix, cartão de crédito e boleto). Não recebemos nem guardamos dados de cartão. A nota fiscal é emitida no CPF informado na compra.</p>\n\n      <h2 id=\"privacidade\">Privacidade</h2>\n      <p>Usamos seu nome, CPF, contato e endereço apenas para processar o pedido, emitir a nota fiscal, fazer a entrega e falar com você sobre a compra, conforme a Lei Geral de Proteção de Dados (Lei 13.709/2018). Compartilhamos esses dados só com quem participa da venda: o Mercado Pago (pagamento), a transportadora (entrega) e o nosso sistema de gestão. Para consultar, corrigir ou pedir a exclusão dos seus dados, escreva para <a href=\"mailto:gerencia@dandecomercial.com.br\">gerencia@dandecomercial.com.br</a>.</p>\n      <p>O site guarda o carrinho no seu próprio navegador e não usa cookies de publicidade.</p>\n    </article>\n  </main>\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n</body>\n</html>\n"
  web_produto_html:
    content: "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Produto | Dande Loja Online</title>\n  <meta name=\"description\" content=\"Peças para eletrodomésticos com pronta entrega. Loja online da Dande.\">\n  <meta name=\"theme-color\" content=\"#0a4e9b\">\n  <link rel=\"icon\" href=\"/assets/favicon-dande.png\" type=\"image/png\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css?v=5b683177\">\n</head>\n<body>\n  <div id=\"cabecalho-slot\"></div>\n  <main class=\"container\" id=\"conteudo\">\n    <div class=\"esqueleto\" style=\"margin-top:24px;min-height:460px\"></div>\n  </main>\n  <div id=\"rodape-slot\"></div>\n  <script src=\"/config.js?v=a0cb7a79\"></script>\n  <script src=\"/app.js?v=e211a23d\"></script>\n  <script>\n    document.addEventListener('DOMContentLoaded', async () => {\n      const { api, qs, esc, brl, ic, Carrinho, cardProduto, categorias, toast, linkWhats } = window.Mio;\n      const alvo = document.getElementById('conteudo');\n      let p;\n      try { p = await api('/api/produtos/' + encodeURIComponent(qs('p') || '')); }\n      catch (e) { alvo.innerHTML = `<div class=\"vazio\" style=\"margin-top:24px\"><p>Produto não encontrado ou indisponível.</p><a class=\"btn\" href=\"/loja.html\">Ver catálogo</a></div>`; return; }\n      document.title = `$${p.nome} | Dande Loja Online`;\n      document.querySelector('meta[name=description]').content = `$${p.nome}. Compre online na Dande, peças para refrigeração em São José dos Campos.`;\n      const cats = await categorias();\n      const cat = cats.find((c) => c.slug === p.categoria);\n\n      // Dados estruturados para o Google\n      const ld = document.createElement('script'); ld.type = 'application/ld+json';\n      ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Product', name: p.nome, sku: p.codigo, gtin13: p.gtin || undefined, brand: p.marca ? { '@type': 'Brand', name: p.marca } : undefined, image: p.imagens.map((i) => location.origin + i), offers: { '@type': 'Offer', priceCurrency: 'BRL', price: p.preco, availability: p.disponivel ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock' } });\n      document.head.appendChild(ld);\n\n      const imgs = p.imagens.length ? p.imagens : [null];\n      alvo.innerHTML = `\n        <nav class=\"migalha\"><a href=\"/\">Início</a> › $${cat ? `<a href=\"/loja.html?cat=$${cat.slug}\">$${esc(cat.nome)}</a> › ` : ''}<span>$${esc(p.nome)}</span></nav>\n        <section class=\"produto\">\n          <div class=\"galeria\">\n            <div class=\"principal\">$${imgs[0] ? `<img id=\"foto\" src=\"$${esc(imgs[0])}\" alt=\"$${esc(p.nome)}\">` : `<span class=\"sem-foto\">$${ic.foto}</span>`}</div>\n            $${imgs.length > 1 ? `<div class=\"miniaturas\">$${imgs.map((i, n) => `<button class=\"$${n ? '' : 'ativo'}\" data-i=\"$${esc(i)}\" aria-label=\"Foto $${n + 1}\"><img src=\"$${esc(i)}\" alt=\"\"></button>`).join('')}</div>` : ''}\n          </div>\n          <div>\n            <h1>$${esc(p.nome)}</h1>\n            <div class=\"cod\">$${p.marca ? `Marca: $${esc(p.marca)} · ` : ''}Cód.: $${esc(p.codigo || p.id)}</div>\n            <div class=\"preco-grande\">$${brl(p.preco)}</div>\n            <div class=\"condicoes\">Pix, cartão de crédito ou boleto pelo Mercado Pago</div>\n            $${p.disponivel ? `<span class=\"selo selo-ok\">Em estoque</span>` : `<span class=\"selo selo-esgotado\">Esgotado</span>`}\n            $${p.disponivel ? `\n            <div class=\"qtd-linha\">\n              <div class=\"qtd-ctrl\"><button type=\"button\" id=\"menos\" aria-label=\"Diminuir\">−</button><input id=\"qtd\" type=\"number\" min=\"1\" max=\"$${p.estoque}\" value=\"1\" aria-label=\"Quantidade\"><button type=\"button\" id=\"mais\" aria-label=\"Aumentar\">+</button></div>\n              <button class=\"btn btn-comprar\" id=\"comprar\">Comprar</button>\n              <button class=\"btn\" id=\"add\">Adicionar ao carrinho</button>\n            </div>` : `<p><a class=\"btn btn-whats\" target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Quero saber quando chega: $${p.nome} (cód. $${p.codigo})`)}\">Avise-me pelo WhatsApp</a></p>`}\n            <div>\n              <label for=\"cep\" style=\"font-size:14px;font-weight:700;color:var(--texto-2)\">Calcular frete</label>\n              <div class=\"frete-calc\"><input id=\"cep\" inputmode=\"numeric\" placeholder=\"00000-000\" maxlength=\"9\"><button class=\"btn btn-pequeno\" id=\"calc\">Calcular</button></div>\n              <div class=\"frete-res\" id=\"frete-res\"></div>\n            </div>\n            <ul class=\"garantias\">\n              <li>$${ic.escudo}<span>Compra segura: o pagamento é processado pelo Mercado Pago.</span></li>\n              <li>$${ic.loja}<span>Retire grátis na loja em São José dos Campos.</span></li>\n              <li>$${ic.check}<span>Dúvida se serve no seu aparelho? <a target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Essa peça serve no meu aparelho? $${p.nome} (cód. $${p.codigo})`)}\">Pergunte no WhatsApp</a> antes de comprar.</span></li>\n            </ul>\n          </div>\n        </section>\n        <section class=\"descricao\"><h2>Descrição</h2><div class=\"texto\">$${p.descricao || '<p>Sem descrição.</p>'}</div></section>\n        $${p.relacionados.length ? `<section class=\"secao\"><div class=\"secao-titulo\"><h2>Veja também</h2></div><div class=\"grade-prod\">$${p.relacionados.map(cardProduto).join('')}</div></section>` : ''}`;\n\n      alvo.querySelector('.miniaturas')?.addEventListener('click', (e) => {\n        const b = e.target.closest('button'); if (!b) return;\n        document.getElementById('foto').src = b.dataset.i;\n        alvo.querySelectorAll('.miniaturas button').forEach((x) => x.classList.toggle('ativo', x === b));\n      });\n      const qtd = document.getElementById('qtd');\n      const limitar = (v) => Math.max(1, Math.min(p.estoque, Number(v) || 1));\n      document.getElementById('menos')?.addEventListener('click', () => { qtd.value = limitar(Number(qtd.value) - 1); });\n      document.getElementById('mais')?.addEventListener('click', () => { qtd.value = limitar(Number(qtd.value) + 1); });\n      qtd?.addEventListener('change', () => { qtd.value = limitar(qtd.value); });\n      document.getElementById('add')?.addEventListener('click', () => { Carrinho.adicionar(p, limitar(qtd.value)); toast('Adicionado ao carrinho'); });\n      document.getElementById('comprar')?.addEventListener('click', () => { Carrinho.adicionar(p, limitar(qtd.value)); location = '/carrinho.html'; });\n\n      const cep = document.getElementById('cep');\n      cep.addEventListener('input', () => { const d = cep.value.replace(/\\D/g, '').slice(0, 8); cep.value = d.length > 5 ? `$${d.slice(0, 5)}-$${d.slice(5)}` : d; });\n      document.getElementById('calc').addEventListener('click', async () => {\n        const res = document.getElementById('frete-res');\n        res.textContent = 'Calculando…';\n        try {\n          const ops = await api('/api/frete', { method: 'POST', body: { cep: cep.value, itens: [{ id: p.id, qtd: limitar(qtd?.value || 1) }] } });\n          res.innerHTML = ops.map((o) => `<div><b>$${o.valor ? brl(o.valor) : 'Grátis'}</b> · $${esc(o.nome)} <span style=\"color:var(--texto-2)\">($${esc(o.prazo)})</span></div>`).join('') +\n            (ops.some((o) => o.tipo !== 'retirada') ? '' : `<div style=\"color:var(--texto-2)\">Para outras cidades, <a target=\"_blank\" rel=\"noopener\" href=\"$${linkWhats(`Olá! Quanto fica o envio de $${p.nome} para o CEP $${cep.value}?`)}\">consulte o envio no WhatsApp</a>.</div>`);\n        } catch (e) { res.textContent = e.message; }\n      });\n    });\n  </script>\n</body>\n</html>\n"
  web_styles_css:
    content: "/* Mio Peça — identidade visual da Dande Comercial */\n/* Fontes do site da Dande (espelhadas em /assets) */\n@font-face { font-family: 'Dande Sans'; src: url('/assets/pt-sans.woff') format('woff'); font-weight: 400; font-display: swap; }\n@font-face { font-family: 'Dande Sans'; src: url('/assets/pt-sans-bold.woff') format('woff'); font-weight: 700; font-display: swap; }\n@font-face { font-family: 'Dande Narrow'; src: url('/assets/pt-sans-narrow.woff') format('woff'); font-weight: 400; font-display: swap; }\n@font-face { font-family: 'Futura PT'; src: url('/assets/futura-pt-book.woff2') format('woff2'); font-weight: 400; font-display: swap; }\n@font-face { font-family: 'Futura PT'; src: url('/assets/futura-pt-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }\n\n:root {\n  --azul-escuro: #0a4e9b;\n  --azul: #337db9;\n  --azul-vivo: #257de1;\n  --ciano: #25aae1;\n  --ciano-claro: #56b8f6;\n  --ciano-suave: #93d4f0;\n  --gelo: #eef4f7;\n  --nevoa: #d5e3e8;\n  --texto: #2c343a;\n  --texto-2: #5b6670;\n  --cinza: #727272;\n  --linha: #dfe7ec;\n  --branco: #fff;\n  --verde: #0a8f2a;\n  --verde-claro: #e3f6e8;\n  --alerta: #b45309;\n  --alerta-claro: #fdf2e2;\n  --erro: #c0262d;\n  --erro-claro: #fdecec;\n  --raio: 10px;\n  --sombra: 0 3px 3px rgba(0, 0, 0, .15);\n  --sombra-card: 0 1px 2px rgba(10, 78, 155, .08), 0 6px 18px rgba(10, 78, 155, .08);\n  --fonte: 'Dande Sans', 'PT Sans', system-ui, sans-serif;\n  --fonte-titulo: 'Futura PT', 'Jost', 'PT Sans', sans-serif;\n}\n\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody { margin: 0; font-family: var(--fonte); color: var(--texto); background: #f5f8fa; font-size: 16px; line-height: 1.5; }\nimg { max-width: 100%; display: block; }\na { color: var(--azul-vivo); text-decoration: none; }\na:hover { color: var(--azul-escuro); }\nh1, h2, h3, h4 { font-family: var(--fonte); font-weight: 700; color: var(--azul-vivo); line-height: 1.2; margin: 0 0 .5em; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\n.container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n/* ---------- Cabeçalho ---------- */\n.topo-contato { background: var(--azul-escuro); color: #cfe2f5; font-size: 13px; }\n.topo-contato .container { display: flex; justify-content: space-between; gap: 12px; padding-top: 6px; padding-bottom: 6px; }\n.topo-contato a { color: #fff; }\n.topo-contato .so-desk { display: inline; }\n#cabecalho { position: sticky; top: 0; z-index: 50; background: #fff; box-shadow: var(--sombra); }\n#cabecalho > .container { display: flex; align-items: center; gap: 20px; min-height: 76px; }\n.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; color: var(--azul-escuro); }\n.logo img { height: 46px; width: auto; }\n.logo small { display: block; font-size: 11px; color: var(--cinza); text-transform: uppercase; letter-spacing: .06em; line-height: 1.1; }\n.busca { flex: 1; display: flex; max-width: 560px; }\n.busca input { flex: 1; min-width: 0; border: 2px solid var(--ciano); border-right: 0; border-radius: 25px 0 0 25px; padding: 9px 18px; font-size: 15px; outline: none; }\n.busca input:focus { border-color: var(--azul-vivo); }\n.busca button { border: 0; background: var(--ciano); color: #fff; border-radius: 0 25px 25px 0; padding: 0 18px; cursor: pointer; display: flex; align-items: center; }\n.busca button:hover { background: var(--azul-vivo); }\n.menu-acoes { display: flex; align-items: center; gap: 18px; margin-left: auto; }\n.menu-acoes a { color: var(--cinza); text-transform: uppercase; font-size: 14px; display: flex; align-items: center; gap: 6px; }\n.menu-acoes a:hover { color: #3b86ff; }\n.btn-carrinho { position: relative; }\n.btn-carrinho .qtd { position: absolute; top: -8px; right: -10px; background: var(--ciano); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; }\n.btn-carrinho .qtd:empty { display: none; }\n.nav-cat { border-top: 1px solid var(--linha); background: #fff; }\n.nav-cat .container { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }\n.nav-cat a { white-space: nowrap; padding: 10px 12px; font-size: 14px; color: var(--texto-2); border-bottom: 3px solid transparent; }\n.nav-cat a:hover, .nav-cat a.ativo { color: var(--azul-vivo); border-bottom-color: var(--ciano); }\n\n@media (max-width: 760px) {\n  .topo-contato .so-desk { display: none; }\n  #cabecalho > .container { flex-wrap: wrap; gap: 10px; padding-top: 10px; padding-bottom: 10px; }\n  .busca { order: 3; max-width: none; flex-basis: 100%; }\n  .menu-acoes .txt { display: none; }\n  .logo img { height: 38px; }\n}\n\n/* ---------- Faixa de benefícios (#pit da Dande) ---------- */\n#pit { background: linear-gradient(to bottom, var(--azul) 0%, var(--azul-escuro) 100%); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); font-family: var(--fonte-titulo); }\n#pit .container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding-top: 14px; padding-bottom: 14px; }\n#pit .item { display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.2; }\n#pit svg { flex-shrink: 0; opacity: .95; }\n@media (max-width: 900px) { #pit .container { grid-template-columns: repeat(2, 1fr); } #pit .item:last-child { grid-column: span 2; } }\n\n/* ---------- Hero ---------- */\n.hero { background: radial-gradient(ellipse at 70% 40%, #56b8f6 0%, #0a6fc2 55%, var(--azul-escuro) 100%); color: #fff; overflow: hidden; }\n.hero .container { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 24px; padding-top: 48px; padding-bottom: 48px; }\n.hero h1 { color: #fff; font-size: clamp(30px, 4.4vw, 48px); font-family: var(--fonte-titulo); font-weight: 700; letter-spacing: -.01em; }\n.hero p { color: #e2f1fc; font-size: 18px; max-width: 520px; margin: 0 0 24px; }\n.hero .acoes { display: flex; gap: 12px; flex-wrap: wrap; }\n.hero-arte { justify-self: center; width: 100%; max-width: 360px; }\n@media (max-width: 760px) { .hero .container { grid-template-columns: 1fr; padding-top: 32px; padding-bottom: 32px; } .hero-arte { display: none; } }\n\n/* ---------- Botões ---------- */\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ciano); background: #fff; color: var(--azul-vivo); border-radius: 25px; padding: 10px 24px; font-weight: 700; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: .02em; transition: background .15s, color .15s, transform .1s; }\n.btn:hover { background: var(--gelo); color: var(--azul-escuro); }\n.btn:active { transform: translateY(1px); }\n.btn-primario { background: var(--azul-vivo); border-color: var(--azul-vivo); color: #fff; }\n.btn-primario:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); color: #fff; }\n.btn-comprar { background: var(--verde); border-color: var(--verde); color: #fff; }\n.btn-comprar:hover { background: #087323; border-color: #087323; color: #fff; }\n.btn-claro { background: transparent; border-color: #fff; color: #fff; }\n.btn-claro:hover { background: rgba(255, 255, 255, .12); color: #fff; }\n.btn-whats { border-color: #0d9b38; color: #0d7a2f; }\n.btn-pequeno { padding: 6px 14px; font-size: 13px; }\n.btn[disabled] { opacity: .5; cursor: not-allowed; }\n.btn-bloco { width: 100%; }\n\n/* ---------- Seções ---------- */\n.secao { padding: 40px 0; }\n.secao-titulo { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }\n.secao-titulo h2 { color: var(--ciano); font-size: clamp(24px, 3vw, 32px); margin: 0; }\n.secao-titulo a { font-size: 14px; text-transform: uppercase; }\n\n/* Categorias em blocos como na home da Dande */\n.grade-cat { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: var(--raio); overflow: hidden; box-shadow: var(--sombra-card); }\n.cat { min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px 12px; text-align: center; color: #fff; }\n.cat:nth-child(odd) { background: radial-gradient(ellipse at center, #56b8f6 0%, #0095d6 100%); }\n.cat:nth-child(even) { background: radial-gradient(ellipse at center, #93d4f0 0%, #25a9e0 100%); }\n.cat h3 { color: #fff; font-size: 19px; margin: 6px 0 10px; text-shadow: 0 2px 0 rgba(0, 0, 0, .12); }\n.cat svg { opacity: .95; }\n.cat .btn-produto { color: #006b7b; border: 1px solid #73b5f9; border-radius: 24px; padding: 7px 20px; background: #fff; font-size: 13px; }\n.cat:hover .btn-produto { background: var(--gelo); }\n@media (max-width: 760px) { .grade-cat { grid-template-columns: repeat(2, 1fr); } .cat { min-height: 140px; } }\n\n/* ---------- Cards de produto ---------- */\n.grade-prod { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }\n.card { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; color: var(--texto); }\n.card:hover { box-shadow: var(--sombra-card); border-color: #b9d8ee; color: var(--texto); }\n.card .foto { aspect-ratio: 1; background: #fff; display: grid; place-items: center; padding: 12px; border-bottom: 1px solid var(--linha); }\n.card .foto img { max-height: 100%; object-fit: contain; }\n.card .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }\n.card .nome { font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em; }\n.card .preco { font-size: 22px; font-weight: 700; color: var(--azul-escuro); margin-top: auto; }\n.card .pix { font-size: 12.5px; color: var(--texto-2); }\n.selo { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 2px 7px; }\n.selo-esgotado { background: #eceff1; color: #6b7680; }\n.selo-ok { background: var(--verde-claro); color: var(--verde); }\n.sem-foto { color: #b8c6d1; }\n\n/* ---------- Listagem ---------- */\n.lista-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }\n.lista-topo h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); text-transform: uppercase; }\n.lista-topo select { border: 1px solid var(--linha); border-radius: 20px; padding: 7px 14px; background: #fff; }\n.paginacao { display: flex; gap: 6px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }\n.paginacao button { border: 1px solid var(--linha); background: #fff; border-radius: 6px; min-width: 38px; height: 38px; cursor: pointer; }\n.paginacao button.ativo { background: var(--azul-vivo); border-color: var(--azul-vivo); color: #fff; }\n.vazio { text-align: center; padding: 50px 16px; color: var(--texto-2); background: #fff; border-radius: var(--raio); border: 1px dashed var(--linha); }\n\n/* ---------- Produto ---------- */\n.migalha { font-size: 13px; color: var(--texto-2); margin: 18px 0; }\n.migalha a { color: var(--texto-2); }\n.produto { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; background: #fff; border-radius: var(--raio); padding: 24px; border: 1px solid var(--linha); }\n.galeria .principal { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; background: #fff; }\n.galeria .principal img { max-height: 100%; object-fit: contain; }\n.miniaturas { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }\n.miniaturas button { width: 64px; height: 64px; border: 2px solid var(--linha); border-radius: 8px; padding: 4px; background: #fff; cursor: pointer; }\n.miniaturas button.ativo { border-color: var(--ciano); }\n.miniaturas img { width: 100%; height: 100%; object-fit: contain; }\n.produto h1 { font-size: clamp(22px, 2.6vw, 28px); color: var(--texto); }\n.produto .cod { font-size: 13px; color: var(--texto-2); margin-bottom: 14px; }\n.produto .preco-grande { font-size: 36px; font-weight: 700; color: var(--azul-escuro); line-height: 1; }\n.produto .condicoes { color: var(--texto-2); font-size: 14px; margin: 6px 0 18px; }\n.qtd-linha { display: flex; gap: 12px; align-items: center; margin: 18px 0; flex-wrap: wrap; }\n.qtd-ctrl { display: inline-flex; border: 1px solid var(--linha); border-radius: 25px; overflow: hidden; }\n.qtd-ctrl button { border: 0; background: var(--gelo); width: 38px; height: 42px; cursor: pointer; font-size: 18px; }\n.qtd-ctrl input { width: 48px; border: 0; text-align: center; -moz-appearance: textfield; }\n.qtd-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none; }\n.garantias { list-style: none; padding: 16px 0 0; margin: 18px 0 0; border-top: 1px solid var(--linha); display: grid; gap: 10px; font-size: 14px; color: var(--texto-2); }\n.garantias li { display: flex; gap: 10px; align-items: flex-start; }\n.garantias svg { color: var(--ciano); flex-shrink: 0; margin-top: 2px; }\n.descricao { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px; margin-top: 20px; }\n.descricao h2 { font-size: 22px; }\n.descricao .texto { color: var(--texto); max-width: 78ch; }\n.descricao .texto p { margin: 0 0 .6em; }\n.frete-calc { display: flex; gap: 8px; margin-top: 8px; }\n.frete-calc input { border: 1px solid var(--linha); border-radius: 20px; padding: 8px 14px; width: 140px; }\n.frete-res { font-size: 14px; margin-top: 8px; display: grid; gap: 4px; }\n@media (max-width: 860px) { .produto { grid-template-columns: 1fr; padding: 16px; gap: 20px; } }\n\n/* ---------- Carrinho / checkout ---------- */\n.checkout { display: grid; grid-template-columns: 1fr 360px; gap: 24px; align-items: start; }\n.painel-box { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 20px; }\n.painel-box + .painel-box { margin-top: 16px; }\n.painel-box h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }\n.painel-box h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ciano); color: #fff; display: grid; place-items: center; font-size: 14px; }\n.item-car { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); }\n.item-car:last-child { border-bottom: 0; }\n.item-car img { width: 72px; height: 72px; object-fit: contain; border: 1px solid var(--linha); border-radius: 8px; padding: 4px; background: #fff; }\n.item-car .nome { font-size: 14.5px; line-height: 1.3; color: var(--texto); }\n.item-car .rm { background: none; border: 0; color: var(--erro); font-size: 13px; cursor: pointer; padding: 0; margin-top: 4px; }\n.item-car .direita { text-align: right; display: grid; gap: 6px; justify-items: end; }\n.campos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }\n.campo { display: flex; flex-direction: column; gap: 4px; grid-column: span 6; }\n.campo.m3 { grid-column: span 3; } .campo.m2 { grid-column: span 2; } .campo.m4 { grid-column: span 4; }\n.campo label { font-size: 13px; color: var(--texto-2); font-weight: 700; }\n.campo input, .campo select, .campo textarea { border: 1px solid #c8d6df; border-radius: 8px; padding: 10px 12px; background: #fff; outline: none; }\n.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--ciano); box-shadow: 0 0 0 3px rgba(37, 170, 225, .15); }\n@media (max-width: 600px) { .campo.m3, .campo.m2, .campo.m4 { grid-column: span 6; } }\n.opcao-frete { display: flex; gap: 12px; align-items: center; border: 1px solid var(--linha); border-radius: 8px; padding: 12px; cursor: pointer; margin-top: 8px; }\n.opcao-frete:has(input:checked) { border-color: var(--ciano); background: #f2faff; }\n.opcao-frete .v { margin-left: auto; font-weight: 700; white-space: nowrap; }\n.opcao-frete small { display: block; color: var(--texto-2); }\n.resumo { position: sticky; top: 140px; }\n.resumo .linha { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }\n.resumo .total { border-top: 1px solid var(--linha); margin-top: 8px; padding-top: 12px; font-size: 20px; font-weight: 700; color: var(--azul-escuro); }\n.seguro { font-size: 13px; color: var(--texto-2); display: flex; gap: 8px; align-items: center; margin-top: 12px; }\n@media (max-width: 900px) { .checkout { grid-template-columns: 1fr; } .resumo { position: static; } }\n\n.aviso { border-radius: 8px; padding: 12px 14px; font-size: 14.5px; margin: 12px 0; }\n.aviso-erro { background: var(--erro-claro); color: var(--erro); }\n.aviso-ok { background: var(--verde-claro); color: #0b6b24; }\n.aviso-info { background: #e8f4fc; color: #0b4f86; }\n.aviso-alerta { background: var(--alerta-claro); color: var(--alerta); }\n\n/* Status do pedido */\n.status-pedido { text-align: center; padding: 32px 20px; }\n.status-pedido .icone { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; }\n.status-pedido.ok .icone { background: var(--verde-claro); color: var(--verde); }\n.status-pedido.espera .icone { background: #e8f4fc; color: var(--azul-vivo); }\n.status-pedido.cancelado .icone { background: var(--erro-claro); color: var(--erro); }\n\n/* Páginas de texto */\n.texto-pg { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 28px; max-width: 860px; margin: 24px auto; }\n.texto-pg h1 { text-transform: uppercase; font-size: 30px; }\n.texto-pg h2 { font-size: 20px; margin-top: 1.4em; }\n.texto-pg p, .texto-pg li { color: var(--texto); }\n\n/* Marcas */\n.marcas { background: #fff; border: 1px solid #86b7cb; border-radius: 7px; display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 12px; padding: 18px; }\n.marcas span { font-family: var(--fonte-titulo); font-weight: 700; font-size: 22px; color: #8aa4b8; letter-spacing: .02em; }\n\n/* Bloco loja física */\n.loja-fisica { background: var(--nevoa); }\n.loja-fisica .container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }\n.loja-fisica h2 { color: var(--azul-vivo); font-size: 30px; }\n@media (max-width: 760px) { .loja-fisica .container { grid-template-columns: 1fr; } }\n\n/* ---------- Rodapé ---------- */\n#rodape { background: linear-gradient(to right, var(--azul-escuro) 0%, var(--azul) 100%); color: #fff; font-size: 14px; margin-top: 48px; }\n#rodape .container { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 24px; padding-top: 36px; padding-bottom: 28px; }\n#rodape h4 { color: #fff; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; }\n#rodape a { color: #fff; }\n#rodape a:hover { color: #a6c0e9; }\n#rodape ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n#rodape .item { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }\n#rodape .item svg { flex-shrink: 0; margin-top: 2px; opacity: .85; }\n.assinatura { background: #303133; color: #c9cdd1; font-size: 12.5px; }\n.assinatura .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 12px; padding-bottom: 12px; }\n@media (max-width: 860px) { #rodape .container { grid-template-columns: 1fr 1fr; } }\n@media (max-width: 520px) { #rodape .container { grid-template-columns: 1fr; } }\n\n/* WhatsApp flutuante (como na Dande) */\n#btn-whats { position: fixed; right: 16px; bottom: 18px; z-index: 60; background: #f3f3f3; border: 1px solid #8799aa; border-radius: 30px; padding: 8px 16px 8px 10px; display: flex; align-items: center; gap: 8px; color: #4a5a69; font-size: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); }\n#btn-whats svg { color: #068f1d; }\n#btn-whats:hover { color: #3266a2; }\n@media (max-width: 760px) { #btn-whats { padding: 10px; } #btn-whats span { display: none; } }\n\n/* Toast */\n.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--texto); color: #fff; padding: 12px 20px; border-radius: 25px; font-size: 14.5px; opacity: 0; transition: .25s; z-index: 100; pointer-events: none; }\n.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n.carregando { color: var(--texto-2); padding: 30px; text-align: center; }\n.esqueleto { background: linear-gradient(90deg, #eef3f6 25%, #f7fafc 50%, #eef3f6 75%); background-size: 200% 100%; animation: brilho 1.2s infinite; border-radius: var(--raio); min-height: 300px; }\n@keyframes brilho { to { background-position: -200% 0; } }\n:focus-visible { outline: 3px solid rgba(37, 170, 225, .5); outline-offset: 2px; }\n\n/* ======================================================================\n   Identidade Dande — camada sobre a base acima\n   ====================================================================== */\n#cabecalho > .container { min-height: 92px; }\n.logo img { height: 62px; width: auto; }\n.logo .tag { font-family: 'Dande Narrow', var(--fonte); font-size: 12px; color: var(--cinza); text-transform: uppercase; letter-spacing: .08em; border-left: 1px solid var(--linha); padding-left: 10px; line-height: 1.2; }\n.menu-acoes .telefone { font-family: 'Dande Sans', var(--fonte); font-weight: 700; font-size: 17px; color: #727272; text-transform: none; }\n.menu-acoes .telefone svg { color: #3b86ff; }\n.menu-acoes .social img { width: 34px; height: 34px; }\n.menu-acoes .menu-link { font-size: 14px; }\n@media (max-width: 1080px) { .menu-acoes .menu-link, .menu-acoes .telefone { display: none; } }\n@media (max-width: 760px) { .logo img { height: 46px; } .logo .tag { display: none; } .menu-acoes .social { display: none; } }\n\n/* Banner rotativo (os mesmos da home da Dande) */\n.slider { position: relative; background: #016ba9; overflow: hidden; }\n.slider .slides { display: flex; transition: transform .6s ease; }\n.slider picture { flex: 0 0 100%; display: block; }\n.slider img { width: 100%; height: auto; display: block; }\n.slider .pontos { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 8px; }\n.slider .pontos button { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; background: transparent; padding: 0; cursor: pointer; }\n.slider .pontos button.ativo { background: #fff; }\n.slider .seta { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: var(--azul-escuro); cursor: pointer; font-size: 22px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }\n.slider .seta.ant { left: 16px; } .slider .seta.prox { right: 16px; }\n@media (max-width: 640px) { .slider .seta { display: none; } }\n\n#pit .item img { width: 38px; height: auto; flex-shrink: 0; }\n#pit { font-family: 'Futura PT', var(--fonte-titulo); font-weight: 400; }\n\n/* Blocos de categoria com as fotos da Dande */\n.cat { min-height: 290px; padding: 20px 12px 0; justify-content: flex-start; gap: 10px; }\n.cat h3 { font-family: 'Dande Sans', var(--fonte); font-size: 26px; margin: 4px 0 0; }\n.cat .foto-cat { margin-top: auto; max-height: 150px; width: auto; object-fit: contain; }\n.cat .ico-cat { margin: auto 0 26px; }\n@media (max-width: 760px) { .cat { min-height: 230px; } .cat h3 { font-size: 20px; } .cat .foto-cat { max-height: 110px; } }\n\n/* Marcas como na Dande */\n.marcas-dande { display: grid; grid-template-columns: 1fr 3fr; gap: 24px; align-items: center; }\n.marcas-dande h2 { color: var(--ciano); font-size: 32px; margin: 0; }\n.marcas { justify-content: space-between; padding: 18px 28px; }\n.marcas img { max-height: 54px; width: auto; }\n@media (max-width: 760px) { .marcas-dande { grid-template-columns: 1fr; } .marcas { flex-direction: column; } }\n\n.loja-fisica { background: #d5e3e8 url('/assets/supergraphic.jpg') center / cover; }\n\n/* Rodapé com o logo negativo da Dande */\n#rodape .logo-rodape { height: 64px; width: auto; margin-bottom: 14px; }\n#rodape .item img { width: 22px; height: 22px; flex-shrink: 0; }\n\n/* ======================================================================\n   Home mais acolhedora: a pergunta do balcão, atalhos por aparelho,\n   ajuda para achar o modelo, passos de compra e dúvidas.\n   ====================================================================== */\n.btn { text-transform: none; letter-spacing: 0; font-size: 15.5px; }\n\n.boas-vindas { background: linear-gradient(180deg, #e9f5fd 0%, #f5f8fa 100%); border-bottom: 1px solid var(--linha); }\n.boas-vindas .container { padding-top: 44px; padding-bottom: 36px; }\n.bv-texto { max-width: 720px; }\n.boas-vindas h1 { font-family: 'Dande Sans', var(--fonte); font-size: clamp(30px, 4.4vw, 46px); color: var(--azul-escuro); letter-spacing: -.01em; margin-bottom: 12px; }\n.boas-vindas .bv-texto > p { font-size: 18px; color: var(--texto-2); max-width: 60ch; margin: 0 0 22px; }\n.busca-grande { position: relative; display: flex; background: #fff; border: 2px solid var(--ciano); border-radius: 32px; padding: 6px; box-shadow: 0 6px 24px rgba(10, 78, 155, .10); }\n.busca-grande:focus-within { border-color: var(--azul-vivo); box-shadow: 0 0 0 4px rgba(37, 170, 225, .18), 0 6px 24px rgba(10, 78, 155, .10); }\n.busca-grande input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 18px; padding: 10px 18px; background: transparent; }\n.busca-grande button { border: 0; border-radius: 26px; background: var(--azul-vivo); color: #fff; font-weight: 700; font-size: 16px; padding: 0 26px; cursor: pointer; white-space: nowrap; }\n.busca-grande button:hover { background: var(--azul-escuro); }\n.bv-ajuda { font-size: 15px; color: var(--texto-2); margin: 14px 4px 0; }\n@media (max-width: 520px) { .busca-grande button { padding: 0 16px; font-size: 15px; } .busca-grande input { font-size: 16px; padding: 10px 12px; } }\n\n/* atalhos por aparelho */\n.aparelhos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; margin-top: 30px; }\n.aparelho { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px 8px 12px; background: #fff; border: 1px solid var(--linha); border-radius: 14px; color: var(--texto); transition: border-color .15s, transform .15s; }\n.aparelho:hover { border-color: var(--ciano); color: var(--azul-escuro); transform: translateY(-2px); }\n.ap-foto { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(ellipse at center, #93d4f0 0%, #25a9e0 100%); overflow: hidden; }\n.ap-foto img { width: 74px; height: 74px; object-fit: contain; }\n.ap-foto svg { width: 46px; height: 46px; }\n.ap-nome { font-weight: 700; font-size: 15px; line-height: 1.2; }\n.ap-qtd { font-size: 12.5px; color: var(--texto-2); }\n@media (prefers-reduced-motion: reduce) { .aparelho, .aparelho:hover { transition: none; transform: none; } }\n\n/* onde achar o modelo */\n.modelo-ajuda .container { display: grid; grid-template-columns: 1fr 300px; column-gap: 40px; align-items: start; }\n.modelo-ajuda .secao-titulo, .modelo-ajuda .intro, .modelo-ajuda .dicas { grid-column: 1; }\n.modelo-ajuda .intro { color: var(--texto-2); font-size: 17px; margin: -6px 0 18px; }\n.dicas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }\n.dica { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 14px; }\n.dica img { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; background: var(--gelo); border-radius: 10px; padding: 4px; }\n.dica h3 { font-size: 16px; color: var(--azul-escuro); margin: 0 0 4px; }\n.dica p { font-size: 14.5px; color: var(--texto-2); margin: 0; }\n/* a etiqueta prateada de fábrica: o elemento que fica na memória */\n.etiqueta { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: grid; gap: 6px; padding: 18px 20px 20px; border-radius: 8px; background: linear-gradient(135deg, #f4f6f8 0%, #d9dfe5 45%, #f1f3f5 60%, #c9d1d8 100%); border: 1px solid #b8c2cb; box-shadow: inset 0 1px 0 #fff, 0 10px 26px rgba(10, 30, 50, .12); font-family: 'Dande Narrow', var(--fonte); color: #37424b; transform: rotate(-2deg); }\n.et-marca { font-family: 'Futura PT', var(--fonte-titulo); font-weight: 700; letter-spacing: .06em; font-size: 20px; color: #24303a; border-bottom: 1px solid #aab4bd; padding-bottom: 6px; }\n.et-linha { font-size: 16px; }\n.et-linha b { background: #fff3a6; box-shadow: 0 0 0 3px #fff3a6; border-radius: 2px; color: #1d2730; }\n@media (max-width: 900px) { .modelo-ajuda .container { grid-template-columns: 1fr; } .etiqueta { grid-column: 1; grid-row: auto; justify-self: start; margin-top: 18px; transform: rotate(-1deg); } .dicas { grid-template-columns: 1fr; } }\n\n/* banner da Dande em faixa */\n.banner-faixa { margin-top: 8px; }\n.banner-faixa .slider { border-radius: 14px; }\n\n/* passos (sequência real de compra) */\n.passos { list-style: none; counter-reset: passo; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n.passos li { counter-increment: passo; position: relative; background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 18px 18px 18px 66px; }\n.passos li::before { content: counter(passo); position: absolute; left: 18px; top: 18px; width: 34px; height: 34px; border-radius: 50%; background: var(--ciano); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 17px; }\n.passos h3 { font-size: 17px; color: var(--azul-escuro); margin: 4px 0 4px; }\n.passos p { margin: 0; color: var(--texto-2); font-size: 15px; }\n@media (max-width: 760px) { .passos { grid-template-columns: 1fr; } }\n\n/* dúvidas */\n.faq-secao { background: #fff; border-top: 1px solid var(--linha); }\n.faq-grade { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; align-items: start; }\n.faq-grade h2 { color: var(--ciano); font-size: 30px; }\n.faq details { border-bottom: 1px solid var(--linha); }\n.faq summary { cursor: pointer; list-style: none; padding: 16px 36px 16px 0; font-weight: 700; font-size: 17px; color: var(--texto); position: relative; }\n.faq summary::-webkit-details-marker { display: none; }\n.faq summary::after { content: '+'; position: absolute; right: 6px; top: 12px; font-size: 24px; color: var(--ciano); font-weight: 400; }\n.faq details[open] summary::after { content: '−'; }\n.faq details p { margin: 0 0 16px; color: var(--texto-2); max-width: 68ch; }\n@media (max-width: 760px) { .faq-grade { grid-template-columns: 1fr; gap: 8px; } }\n\n/* sugestões da busca */\n.sugestoes { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--linha); border-radius: 14px; box-shadow: 0 14px 34px rgba(10, 30, 50, .16); z-index: 70; overflow: hidden; }\n.sugestoes a { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 14px; color: var(--texto); font-size: 14.5px; }\n.sugestoes a:hover, .sugestoes a.ativo { background: #eef7fd; }\n.sugestoes img, .sugestoes .ph { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; background: #fff; border: 1px solid var(--linha); }\n.sugestoes .preco { font-weight: 700; color: var(--azul-escuro); white-space: nowrap; }\n.sugestoes .todas { display: block; text-align: center; padding: 10px; border-top: 1px solid var(--linha); font-weight: 700; color: var(--azul-vivo); }\n.busca { position: relative; }\n\n/* selo de retirada nos cards */\n.selo-retira { background: #e6f4fb; color: #0b5d8f; }\n\n/* topo: texto + cartão da loja lado a lado */\n.boas-vindas .container { display: grid; grid-template-columns: minmax(0, 1fr) 300px; column-gap: 40px; align-items: start; }\n.boas-vindas .aparelhos { grid-column: 1 / -1; }\n.hoje-loja { background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 20px; box-shadow: 0 8px 28px rgba(10, 78, 155, .08); margin-top: 8px; }\n.hl-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--texto-2); }\n.hl-status::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #9aa6b0; }\n.hl-status.aberta { color: var(--verde); } .hl-status.aberta::before { background: #19b347; box-shadow: 0 0 0 4px rgba(25, 179, 71, .18); }\n.hl-status.fechada { color: #8a5a00; } .hl-status.fechada::before { background: #e3a008; }\n.hl-titulo { font-size: 21px; font-weight: 700; color: var(--azul-escuro); margin: 10px 0 6px; line-height: 1.2; }\n.hl-texto { font-size: 15px; color: var(--texto-2); margin: 0 0 16px; }\n@media (max-width: 900px) { .boas-vindas .container { grid-template-columns: 1fr; } .hoje-loja { margin-top: 22px; } }\n\n/* cabeçalho sem quebrar linha */\n.menu-acoes a { white-space: nowrap; }\n@media (max-width: 1240px) { .menu-acoes .telefone { display: none; } }\n.secao-titulo a { text-transform: none; font-weight: 700; font-size: 15px; }\n.marcas-dande { grid-template-columns: 1fr 2fr; }\n@media (max-width: 760px) {\n  .marcas-dande { grid-template-columns: 1fr; }\n  .marcas-dande h2 { font-size: 24px; }\n  .grade-prod { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n  .card .info { padding: 10px; }\n  .card .preco { font-size: 19px; }\n  .boas-vindas .aparelhos { order: 2; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }\n  .boas-vindas .hoje-loja { order: 3; }\n  .ap-foto { width: 64px; height: 64px; } .ap-foto img { width: 56px; height: 56px; }\n  .ap-nome { font-size: 13.5px; }\n}\n\n/* páginas cujo <main> é container + seção ao mesmo tempo mantêm a margem lateral */\n.container.secao { padding-left: 16px; padding-right: 16px; }\n"
