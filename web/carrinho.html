<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho | Dande Loja Online</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a4e9b">
  <link rel="icon" href="/assets/favicon-dande.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cabecalho-slot"></div>
  <main class="container secao" style="padding-top:28px">
    <h1 style="text-transform:uppercase;font-size:30px">Carrinho</h1>
    <div id="vazio" class="vazio" hidden>
      <p style="margin-top:0">Seu carrinho está vazio.</p>
      <a class="btn btn-primario" href="/loja.html">Ver peças</a>
    </div>
    <form id="checkout" class="checkout" novalidate hidden>
      <div>
        <section class="painel-box">
          <h2><span class="n">1</span>Itens</h2>
          <div id="itens"></div>
        </section>

        <section class="painel-box">
          <h2><span class="n">2</span>Entrega</h2>
          <div class="campos">
            <div class="campo m2"><label for="cep">CEP</label><input id="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" maxlength="9" required></div>
            <div class="campo m4" style="justify-content:end"><a href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" rel="noopener" style="font-size:13px;padding-bottom:12px">Não sei meu CEP</a></div>
          </div>
          <div id="fretes"></div>
          <div id="endereco" hidden>
            <div class="campos" style="margin-top:14px">
              <div class="campo m4"><label for="rua">Rua / avenida</label><input id="rua" autocomplete="address-line1" required></div>
              <div class="campo m2"><label for="numero">Número</label><input id="numero" required></div>
              <div class="campo m3"><label for="complemento">Complemento (opcional)</label><input id="complemento" autocomplete="address-line2"></div>
              <div class="campo m3"><label for="bairro">Bairro</label><input id="bairro" required></div>
              <div class="campo m4"><label for="cidade">Cidade</label><input id="cidade" autocomplete="address-level2" required></div>
              <div class="campo m2"><label for="uf">UF</label><input id="uf" maxlength="2" autocomplete="address-level1" required></div>
            </div>
          </div>
        </section>

        <section class="painel-box">
          <h2><span class="n">3</span>Seus dados</h2>
          <div class="campos">
            <div class="campo"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required></div>
            <div class="campo m3"><label for="cpf">CPF (para a nota fiscal)</label><input id="cpf" inputmode="numeric" maxlength="14" required></div>
            <div class="campo m3"><label for="telefone">Celular / WhatsApp</label><input id="telefone" type="tel" autocomplete="tel" inputmode="tel" required></div>
            <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
          </div>
        </section>
      </div>

      <aside class="painel-box resumo">
        <h2>Resumo</h2>
        <div class="linha"><span>Subtotal</span><span id="r-sub">—</span></div>
        <div class="linha"><span>Entrega</span><span id="r-frete">—</span></div>
        <div class="linha total"><span>Total</span><span id="r-total">—</span></div>
        <div id="erro" class="aviso aviso-erro" hidden role="alert"></div>
        <button class="btn btn-comprar btn-bloco" type="submit" id="pagar" style="margin-top:14px">Ir para o pagamento</button>
        <div class="seguro" id="seguro"></div>
        <p style="font-size:12.5px;color:var(--texto-2);margin:12px 0 0">Ao finalizar você concorda com as <a href="/politicas.html" target="_blank">políticas de troca, entrega e privacidade</a>.</p>
      </aside>
    </form>
  </main>
  <div id="rodape-slot"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { api, esc, brl, ic, Carrinho, linkWhats } = window.Mio;
      const $ = (id) => document.getElementById(id);
      let opcoes = [], escolhido = null;
      $('seguro').innerHTML = `${ic.escudo}<span>Você paga no ambiente seguro do Mercado Pago: Pix, cartão ou boleto.</span>`;

      function render() {
        const itens = Carrinho.ler();
        $('vazio').hidden = !!itens.length;
        $('checkout').hidden = !itens.length;
        if (!itens.length) return;
        $('itens').innerHTML = itens.map((i) => `
          <div class="item-car" data-id="${i.id}">
            ${i.imagem ? `<img src="${esc(i.imagem)}" alt="">` : '<span></span>'}
            <div><a class="nome" href="/produto.html?p=${esc(i.slug)}">${esc(i.nome)}</a><br><button type="button" class="rm">Remover</button></div>
            <div class="direita">
              <div class="qtd-ctrl"><button type="button" class="menos" aria-label="Diminuir">−</button><input type="number" class="q" value="${i.qtd}" min="1" max="${i.max || 99}" aria-label="Quantidade"><button type="button" class="mais" aria-label="Aumentar">+</button></div>
              <b>${brl(i.preco * i.qtd)}</b>
            </div>
          </div>`).join('');
        resumo();
      }
      function resumo() {
        const sub = Carrinho.total();
        $('r-sub').textContent = brl(sub);
        $('r-frete').textContent = escolhido ? (escolhido.valor ? brl(escolhido.valor) : 'Grátis') : '—';
        $('r-total').textContent = brl(sub + (escolhido?.valor || 0));
      }
      $('itens').addEventListener('click', (e) => {
        const linha = e.target.closest('.item-car'); if (!linha) return;
        const id = Number(linha.dataset.id), q = linha.querySelector('.q');
        if (e.target.closest('.rm')) Carrinho.remover(id);
        else if (e.target.closest('.menos')) Carrinho.alterar(id, Number(q.value) - 1);
        else if (e.target.closest('.mais')) Carrinho.alterar(id, Number(q.value) + 1);
        else return;
        render(); recalcular();
      });
      $('itens').addEventListener('change', (e) => { if (!e.target.matches('.q')) return; Carrinho.alterar(Number(e.target.closest('.item-car').dataset.id), Number(e.target.value)); render(); recalcular(); });

      // máscaras
      const mascara = (el, f) => el.addEventListener('input', () => { el.value = f(el.value.replace(/\D/g, '')); });
      mascara($('cep'), (d) => (d = d.slice(0, 8), d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d));
      mascara($('cpf'), (d) => (d = d.slice(0, 11), d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2')));
      mascara($('telefone'), (d) => (d = d.slice(0, 11), d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d));

      let cepAtual = '';
      async function recalcular() {
        const cep = $('cep').value.replace(/\D/g, '');
        if (cep.length !== 8) { $('fretes').innerHTML = ''; escolhido = null; resumo(); return; }
        $('fretes').innerHTML = '<p style="color:var(--texto-2)">Calculando entrega…</p>';
        const tipoAntes = escolhido?.tipo;
        try {
          opcoes = await api('/api/frete', { method: 'POST', body: { cep, itens: Carrinho.ler().map((i) => ({ id: i.id, qtd: i.qtd })) } });
          $('fretes').innerHTML = opcoes.map((o, n) => `
            <label class="opcao-frete"><input type="radio" name="frete" value="${esc(o.tipo)}" ${o.tipo === tipoAntes || (!tipoAntes && n === 0) ? 'checked' : ''}>
              <span>${esc(o.nome)}<small>${esc(o.prazo)}</small></span><span class="v">${o.valor ? brl(o.valor) : 'Grátis'}</span></label>`).join('') +
            (opcoes.some((o) => o.tipo !== 'retirada') ? '' : `<p class="aviso aviso-info">Para este CEP, por enquanto, a compra online é com retirada na loja. Para envio, <a target="_blank" rel="noopener" href="${linkWhats(`Olá! Quero comprar pelo site com envio para o CEP ${$('cep').value}.`)}">fale com a gente no WhatsApp</a>.</p>`);
          escolher();
        } catch (e) { $('fretes').innerHTML = `<p class="aviso aviso-erro">${esc(e.message)}</p>`; escolhido = null; resumo(); }
        if (cep !== cepAtual) { cepAtual = cep; buscarEndereco(cep); }
      }
      function escolher() {
        const v = document.querySelector('input[name=frete]:checked')?.value;
        escolhido = opcoes.find((o) => o.tipo === v) || null;
        $('endereco').hidden = !escolhido || escolhido.tipo === 'retirada';
        resumo();
      }
      $('fretes').addEventListener('change', escolher);
      $('cep').addEventListener('input', () => { if ($('cep').value.replace(/\D/g, '').length === 8) recalcular(); });
      async function buscarEndereco(cep) {
        try {
          const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then((x) => x.json());
          if (r.erro) return;
          if (!$('rua').value) $('rua').value = r.logradouro || '';
          if (!$('bairro').value) $('bairro').value = r.bairro || '';
          $('cidade').value = r.localidade || ''; $('uf').value = r.uf || '';
          if ($('rua').value) $('numero').focus({ preventScroll: true });
        } catch { /* preenchimento manual */ }
      }

      $('checkout').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erro = $('erro'); erro.hidden = true;
        const falha = (m, campo) => { erro.textContent = m; erro.hidden = false; if (campo) $(campo).focus(); };
        if (!escolhido) return falha('Informe o CEP e escolha a forma de entrega.', 'cep');
        const precisaEnd = escolhido.tipo !== 'retirada';
        if (precisaEnd) for (const c of ['rua', 'numero', 'bairro', 'cidade', 'uf']) if (!$(c).value.trim()) return falha('Preencha o endereço de entrega.', c);
        for (const c of ['nome', 'cpf', 'telefone', 'email']) if (!$(c).value.trim()) return falha('Preencha seus dados.', c);
        const btn = $('pagar'); btn.disabled = true; btn.textContent = 'Gerando pedido…';
        try {
          const r = await api('/api/pedidos', { method: 'POST', body: {
            itens: Carrinho.ler().map((i) => ({ id: i.id, qtd: i.qtd })),
            frete_tipo: escolhido.tipo,
            cliente: { nome: $('nome').value, cpf: $('cpf').value, telefone: $('telefone').value, email: $('email').value },
            endereco: { cep: $('cep').value, rua: $('rua').value, numero: $('numero').value, complemento: $('complemento').value, bairro: $('bairro').value, cidade: $('cidade').value, uf: $('uf').value },
          } });
          Carrinho.limpar();
          location = r.pagamento || `/pedido.html?c=${encodeURIComponent(r.codigo)}&t=${encodeURIComponent(r.token)}`;
        } catch (err) {
          falha(err.message);
          btn.disabled = false; btn.textContent = 'Ir para o pagamento';
        }
      });

      render();
    });
  </script>
</body>
</html>
