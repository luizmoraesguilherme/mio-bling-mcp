<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel | Dande Loja Online</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon-dande.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #eef3f6; }
    .pn-topo { background: linear-gradient(to right, var(--azul-escuro), var(--azul)); color: #fff; }
    .pn-topo .container { display: flex; align-items: center; gap: 16px; min-height: 60px; }
    .pn-topo img { height: 36px; background: #fff; border-radius: 6px; padding: 3px 8px; }
    .pn-topo nav { display: flex; gap: 4px; margin-left: 12px; overflow-x: auto; }
    .pn-topo nav button { background: none; border: 0; color: #d6e7f7; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; white-space: nowrap; }
    .pn-topo nav button.ativo { background: rgba(255,255,255,.18); color: #fff; }
    .pn-topo .sair { margin-left: auto; color: #fff; background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; padding: 6px 14px; cursor: pointer; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 20px 0; }
    .kpi { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; }
    .kpi .v { font-size: 28px; font-weight: 700; color: var(--azul-escuro); line-height: 1.1; }
    .kpi .l { font-size: 13px; color: var(--texto-2); }
    .tabela { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    .tabela th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); padding: 10px; border-bottom: 2px solid var(--linha); background: #f8fbfc; position: sticky; top: 0; }
    .tabela td { padding: 10px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
    .tabela img { width: 48px; height: 48px; object-fit: contain; border: 1px solid var(--linha); border-radius: 6px; background: #fff; }
    .tabela .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tab-wrap { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); max-height: 70vh; }
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    .filtros input, .filtros select { border: 1px solid #c8d6df; border-radius: 20px; padding: 7px 14px; background: #fff; }
    .chip { display: inline-block; font-size: 11.5px; border-radius: 10px; padding: 1px 8px; margin: 2px 2px 0 0; }
    .chip-b { background: var(--erro-claro); color: var(--erro); }
    .chip-a { background: var(--alerta-claro); color: var(--alerta); }
    .chip-ok { background: var(--verde-claro); color: var(--verde); }
    .interruptor { position: relative; width: 44px; height: 24px; display: inline-block; }
    .interruptor input { opacity: 0; width: 0; height: 0; }
    .interruptor span { position: absolute; inset: 0; background: #c9d4db; border-radius: 12px; cursor: pointer; transition: .2s; }
    .interruptor span::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .interruptor input:checked + span { background: var(--verde); }
    .interruptor input:checked + span::before { transform: translateX(20px); }
    .interruptor input:disabled + span { opacity: .45; cursor: not-allowed; }
    .tabela select, .tabela input[type=text] { border: 1px solid #c8d6df; border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 190px; background: #fff; }
    .st { font-weight: 700; font-size: 12px; text-transform: uppercase; }
    .st-aguardando_pagamento { color: var(--alerta); } .st-pago { color: var(--verde); } .st-enviado, .st-entregue { color: var(--azul-vivo); } .st-cancelado { color: var(--erro); }
    .login { max-width: 380px; margin: 12vh auto; }
    .config-lista { display: grid; gap: 10px; }
    .config-lista .l { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--linha); }
    .config-lista code { background: var(--gelo); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; word-break: break-all; }
    dialog { border: 0; border-radius: var(--raio); padding: 0; max-width: 640px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(10, 30, 50, .45); }
    dialog .cab { padding: 16px 20px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }
    dialog .corpo { padding: 16px 20px; max-height: 70vh; overflow: auto; }
  </style>
</head>
<body>
  <section id="tela-login" class="login" hidden>
    <form class="painel-box" id="form-login">
      <img src="/logo.svg" alt="Mio Peça" width="190" height="50" style="margin:0 auto 16px">
      <div class="campo"><label for="senha">Senha do painel</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <div id="login-erro" class="aviso aviso-erro" hidden></div>
      <button class="btn btn-primario btn-bloco" style="margin-top:14px">Entrar</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="pn-topo"><div class="container">
      <img src="/logo.svg" alt="Mio Peça">
      <nav id="abas">
        <button data-aba="geral" class="ativo">Visão geral</button>
        <button data-aba="produtos">Produtos</button>
        <button data-aba="pedidos">Pedidos</button>
      </nav>
      <a href="/" target="_blank" style="color:#fff;font-size:14px;margin-left:auto">Ver loja ↗</a>
      <button class="sair" id="sair">Sair</button>
    </div></header>
    <main class="container" style="padding-bottom:40px">
      <section data-painel="geral"></section>
      <section data-painel="produtos" hidden></section>
      <section data-painel="pedidos" hidden></section>
    </main>
  </div>

  <dialog id="dlg"><div class="cab"><h3 id="dlg-titulo" style="margin:0"></h3><button class="btn btn-pequeno" onclick="document.getElementById('dlg').close()">Fechar</button></div><div class="corpo" id="dlg-corpo"></div></dialog>

  <script src="config.js"></script>
  <script src="painel.js"></script>
</body>
</html>
