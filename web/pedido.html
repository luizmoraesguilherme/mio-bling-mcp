<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu pedido | Mio Peça</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a4e9b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cabecalho-slot"></div>
  <main class="container secao" style="max-width:760px" id="conteudo"><div class="esqueleto"></div></main>
  <div id="rodape-slot"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { api, qs, esc, brl, ic, linkWhats } = window.Mio;
      const alvo = document.getElementById('conteudo');
      const extra = qs('payment_id') ? `&payment_id=${encodeURIComponent(qs('payment_id'))}` : '';
      let p;
      try { p = await api(`/api/pedidos/${encodeURIComponent(qs('c') || '')}?t=${encodeURIComponent(qs('t') || '')}${extra}`); }
      catch { alvo.innerHTML = '<div class="vazio">Pedido não encontrado. Confira o link recebido ou fale com a gente no WhatsApp.</div>'; return; }
      const estados = {
        aguardando_pagamento: ['espera', ic.relogio.replace(/16/g, '30'), 'Aguardando pagamento', p.pagamento ? 'Seu pedido foi registrado. Conclua o pagamento para separarmos as peças.' : 'Seu pedido foi registrado. Vamos falar com você pelo WhatsApp para combinar o pagamento.'],
        pago: ['ok', ic.check.replace(/18/g, '30'), 'Pagamento aprovado', 'Recebemos seu pagamento. Já estamos separando as peças.'],
        enviado: ['ok', ic.caixa.replace(/18/g, '30'), 'Pedido enviado', 'Seu pedido saiu para entrega.'],
        entregue: ['ok', ic.check.replace(/18/g, '30'), 'Pedido entregue', 'Obrigado por comprar com a Mio Peça!'],
        cancelado: ['cancelado', '✕', 'Pedido cancelado', 'Se foi engano, fale com a gente pelo WhatsApp.'],
      };
      const [cls, icone, titulo, texto] = estados[p.status] || estados.aguardando_pagamento;
      alvo.innerHTML = `
        <div class="painel-box status-pedido ${cls}">
          <div class="icone">${icone}</div>
          <h1 style="font-size:26px">${titulo}</h1>
          <p style="color:var(--texto-2)">${texto}</p>
          <p>Pedido <b>${esc(p.codigo)}</b></p>
          ${p.pagamento ? `<a class="btn btn-comprar" href="${esc(p.pagamento)}">Pagar agora</a>` : ''}
        </div>
        <div class="painel-box">
          <h2>Itens</h2>
          ${p.itens.map((i) => `<div class="linha" style="display:flex;justify-content:space-between;gap:12px;padding:6px 0"><span>${i.qtd}× ${esc(i.nome)}</span><b>${brl(i.preco * i.qtd)}</b></div>`).join('')}
          <hr style="border:0;border-top:1px solid var(--linha)">
          <div style="display:flex;justify-content:space-between"><span>${esc(p.frete_nome || 'Entrega')}</span><span>${p.frete ? brl(p.frete) : 'Grátis'}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:var(--azul-escuro);margin-top:8px"><span>Total</span><span>${brl(p.total)}</span></div>
        </div>
        <p style="text-align:center"><a class="btn btn-whats" target="_blank" rel="noopener" href="${linkWhats(`Olá! Sobre meu pedido ${p.codigo}.`)}">Falar sobre este pedido</a></p>
        <p style="text-align:center;font-size:13px;color:var(--texto-2)">Guarde este link para acompanhar o pedido.</p>`;
    });
  </script>
</body>
</html>
