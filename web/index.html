<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dande Loja Online — Peças para geladeira, lavadora, tanquinho e micro-ondas</title>
  <meta name="description" content="Peças para refrigeração, lavadoras, tanquinhos, micro-ondas, purificadores e filtros de água. Loja online da Dande, há mais de 20 anos em São José dos Campos. Envio e retirada na loja.">
  <meta property="og:title" content="Dande Loja Online — Peças para Refrigeração">
  <meta property="og:description" content="Peças para geladeira, lavadora, micro-ondas e purificadores com pronta entrega.">
  <meta name="theme-color" content="#0a4e9b">
  <link rel="icon" href="/assets/favicon-dande.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cabecalho-slot"></div>

  <main>
    <section class="slider" id="slider" aria-label="Destaques da Dande">
      <div class="slides" id="slides"></div>
      <button class="seta ant" id="ant" aria-label="Banner anterior">‹</button>
      <button class="seta prox" id="prox" aria-label="Próximo banner">›</button>
      <div class="pontos" id="pontos"></div>
    </section>

    <section id="pit" aria-label="Por que comprar com a gente"><div class="container" id="pit-itens"></div></section>

    <section class="secao"><div class="container">
      <div class="secao-titulo"><h2>Encontre por aparelho</h2><a href="/loja.html">Ver tudo</a></div>
      <div class="grade-cat" id="grade-cat"><div class="esqueleto" style="grid-column:1/-1;min-height:170px"></div></div>
    </div></section>

    <section class="secao" style="padding-top:0"><div class="container">
      <div class="secao-titulo"><h2>Destaques</h2><a href="/loja.html">Ver mais</a></div>
      <div class="grade-prod" id="destaques"></div>
    </div></section>

    <section class="secao" style="padding-top:0"><div class="container marcas-dande">
      <h2>As melhores peças e marcas você encontra aqui</h2>
      <div class="marcas" aria-label="Marcas atendidas">
        <img src="/assets/marca-brastemp.png" alt="Brastemp" loading="lazy">
        <img src="/assets/marca-consul.png" alt="Consul" loading="lazy">
        <img src="/assets/marca-electrolux.png" alt="Electrolux" loading="lazy">
        <img src="/assets/marca-planeta-agua.png" alt="Planeta Água" loading="lazy">
      </div>
    </div></section>

    <section class="secao loja-fisica"><div class="container">
      <div>
        <h2>Prefere retirar no balcão?</h2>
        <p>Compre aqui e retire na nossa loja em São José dos Campos, sem pagar frete. Nossa equipe confere a peça com você na hora.</p>
        <p id="end-loja" style="font-weight:700"></p>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a class="btn btn-primario" href="https://maps.google.com/?q=Av.+Andr%C3%B4meda,+3358,+S%C3%A3o+Jos%C3%A9+dos+Campos" target="_blank" rel="noopener">Como chegar</a>
        <a class="btn btn-whats" id="whats-loja" href="#" target="_blank" rel="noopener">Tirar dúvida sobre compatibilidade</a>
      </div>
    </div></section>
  </main>

  <div id="rodape-slot"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { api, cardProduto, categorias, catIcone, linkWhats, esc, cfg } = window.Mio;
            document.getElementById('whats-loja').href = linkWhats('Olá! Quero confirmar se uma peça serve no meu aparelho.');
      document.getElementById('end-loja').textContent = `${cfg.endereco} · ${cfg.cidade} · ${cfg.horario}`;

      // Banner rotativo com as artes da Dande (versão quadrada no celular)
      const ban = [1, 2, 3, 4];
      document.getElementById('slides').innerHTML = ban.map((n) => `<picture><source media="(max-width: 640px)" srcset="/assets/banner-m-${n}.jpg"><img src="/assets/banner-${n}.jpg" alt="Passa na Dande! As melhores peças para refrigeração você encontra aqui" ${n > 1 ? 'loading="lazy"' : ''} width="1920" height="500"></picture>`).join('');
      const pontos = document.getElementById('pontos');
      pontos.innerHTML = ban.map((n, i) => `<button aria-label="Banner ${n}" class="${i ? '' : 'ativo'}"></button>`).join('');
      let atual = 0, timer;
      const ir = (i) => { atual = (i + ban.length) % ban.length; document.getElementById('slides').style.transform = `translateX(-${atual * 100}%)`; [...pontos.children].forEach((b, k) => b.classList.toggle('ativo', k === atual)); clearInterval(timer); timer = setInterval(() => ir(atual + 1), 6000); };
      pontos.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) ir([...pontos.children].indexOf(b)); });
      document.getElementById('ant').onclick = () => ir(atual - 1);
      document.getElementById('prox').onclick = () => ir(atual + 1);
      ir(0);

      const pit = [['20anos', '20 anos de mercado'], ['rapido', 'Atendimento rápido'], ['marcas', 'Grandes marcas'], ['entrega', 'Peças a pronta entrega'], ['estacionamento', 'Retire na loja: temos estacionamento']];
      document.getElementById('pit-itens').innerHTML = pit.map(([i, t]) => `<div class="item"><img src="/assets/pit-${i}.png" alt="" width="38" height="38"><span>${t}</span></div>`).join('');

      const cats = await categorias();
      const mostrar = cats.filter((c) => c.total > 0);
      const lista = (mostrar.length >= 4 ? mostrar : cats.filter((c) => c.slug !== 'outros')).slice(0, 8);
      const comFoto = new Set(['geladeiras', 'lavadoras', 'secadoras', 'tanquinhos', 'microondas', 'ar-condicionado', 'filtros', 'lava-loucas']);
      document.getElementById('grade-cat').innerHTML = lista.map((c) => `
        <a class="cat" href="/loja.html?cat=${c.slug}">
          <h3>${esc(c.nome)}</h3><span class="btn-produto">Peças</span>${comFoto.has(c.slug) ? `<img class="foto-cat" src="/assets/cat-${c.slug}.png" alt="" loading="lazy">` : `<span class="ico-cat">${catIcone[c.slug] || catIcone.outros}</span>`}
        </a>`).join('');

      const alvo = document.getElementById('destaques');
      try {
        let r = await api('/api/produtos?destaque=1&limite=8');
        if (!r.itens.length) r = await api('/api/produtos?limite=8');
        alvo.innerHTML = r.itens.length ? r.itens.map(cardProduto).join('') : '<div class="vazio" style="grid-column:1/-1">Estamos preparando o catálogo. Enquanto isso, fale com a gente pelo WhatsApp.</div>';
      } catch { alvo.innerHTML = '<div class="vazio" style="grid-column:1/-1">Não foi possível carregar os produtos agora.</div>'; }
    });
  </script>
</body>
</html>
